      var grid = J.el("div", "grid");
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-mealadd">' +
          '<h2 id="h-mealadd">급식표 넣기</h2>' +
          '<p class="muted">날짜 줄 다음에 메뉴를 적어서 붙여넣어. 여러 날을 한 번에 넣을 수 있고, 알레르기 번호는 알아서 지워. 급식표 사진을 Claude에게 보내면 이 형식으로 바꿔줘.</p>' +
          '<textarea class="field textarea" id="mealText" style="min-height:160px" placeholder="10/12(월)&#10;쌀밥, 김치찌개, 돈까스, 배추김치&#10;10/13(화)&#10;카레라이스, 우동, 깍두기"></textarea>' +
          '<div class="row"><button class="btn primary grow" type="button" id="mealParse">읽어보기</button></div>' +
          '<div id="mealNote"></div>' +
          '<div class="row" id="mealConfirm" hidden><button class="btn primary grow" type="button" id="mealSave">저장</button><button class="btn grow" type="button" id="mealCancel">취소</button></div>' +
        '</section>'
      ));
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-mealmanage">' +
          '<h2 id="h-mealmanage">저장된 급식 <span id="mealCount"></span></h2>' +
          '<p class="muted" id="mealRange"></p>' +
          '<div class="row"><button class="btn small" type="button" id="mealClearOld">지난 급식 지우기</button></div>' +
        '</section>'
      ));
      root.appendChild(grid);

      J.$("mealPrev").addEventListener("click", function () { weekOffset--; draw(); });
      J.$("mealNext").addEventListener("click", function () { weekOffset++; draw(); });
      J.$("mealThis").addEventListener("click", function () { weekOffset = 0; draw(); });
      J.$("mealParse").addEventListener("click", function () {
        var parsed = JX.parseMeals(J.$("mealText").value, new Date());
        var keys = Object.keys(parsed).sort();
        if (!keys.length) {
          note("err", "날짜를 못 찾았어. 줄 맨 앞에 '10/12'나 '10월 12일'처럼 날짜를 적어줘.");
          J.$("mealConfirm").hidden = true;
          return;
        }
        pending = parsed;
        var lines = keys.map(function (k) {
          var d = JX.fromKey(k);
          return (d.getMonth() + 1) + "/" + d.getDate() + "(" + DN[d.getDay()] + ") " + parsed[k].join(", ") + (J.data.meals[k] ? "  ← 덮어씀" : "");
        });
        note("warn", keys.length + "일치 급식을 찾았어. 맞으면 저장을 눌러.\n" + lines.join("\n"));
        J.$("mealConfirm").hidden = false;
      });
      J.$("mealSave").addEventListener("click", function () {
        if (!pending) return;
        Object.keys(pending).forEach(function (k) { J.data.meals[k] = pending[k]; });
        var n = Object.keys(pending).length;
        pending = null;
        J.save();
        J.$("mealText").value = "";
        J.$("mealConfirm").hidden = true;
        note("ok", n + "일치 급식을 저장했어.");
        draw();
        J.emit("meals");
      });
      J.$("mealCancel").addEventListener("click", function () { pending = null; J.$("mealConfirm").hidden = true; note("", ""); });
      J.$("mealClearOld").addEventListener("click", function () {
        var today = JX.key(new Date());
        var n = 0;
        Object.keys(J.data.meals).forEach(function (k) { if (k < today) { delete J.data.meals[k]; n++; } });
        J.save();
        draw();
        note("ok", n ? "지난 급식 " + n + "일치를 지웠어." : "지울 지난 급식이 없어.");
      });
      draw();
    }
  });

  function note(kind, text) {
    var el = J.$("mealNote");
    el.textContent = "";
    if (text) {
      var n = J.el("div", "notice" + (kind ? " " + kind : ""), text);
      n.style.whiteSpace = "pre-wrap";
      el.appendChild(n);
    }
  }
  function draw() {
    if (!J.$("mealGrid")) return;
    var mon = monday(weekOffset);
    var fri = JX.addDays(mon, 4);
    J.$("mealWeek").textContent = (mon.getMonth() + 1) + "월 " + mon.getDate() + "일 ~ " + (fri.getMonth() + 1) + "월 " + fri.getDate() + "일" + (weekOffset === 0 ? " (이번 주)" : "");
    var box = J.$("mealGrid");
    box.textContent = "";
    var todayKey = JX.key(new Date());
    for (var i = 0; i < 5; i++) {
      var d = JX.addDays(mon, i);
      var k = JX.key(d);
      var p = J.el("section", "panel");
      if (k === todayKey) p.style.borderColor = "var(--accent)";
      var h = J.el("h2", null, (d.getMonth() + 1) + "/" + d.getDate() + " " + DN[d.getDay()] + "요일" + (k === todayKey ? " · 오늘" : ""));
      p.appendChild(h);
      var hol = JX.holiday(k);
      var menu = J.data.meals[k];
      if (menu && menu.length) {
        var ul = J.el("ul", "items");
        menu.forEach(function (m) { var li = J.el("li"); li.appendChild(J.el("span", "item-text", m)); ul.appendChild(li); });
        p.appendChild(ul);
      } else {
        p.appendChild(J.el("p", "empty", hol ? hol + " · 급식 없음" : "급식 정보가 없어."));
      }
      box.appendChild(p);
    }
    var keys = Object.keys(J.data.meals).sort();
    J.$("mealCount").textContent = keys.length ? keys.length + "일" : "";
    J.$("mealRange").textContent = keys.length ? keys[0].slice(5).replace("-", "/") + " ~ " + keys[keys.length - 1].slice(5).replace("-", "/") + " 저장돼 있어." : "아직 저장된 급식이 없어.";
  }

  J.meal = {
    menu: function (key) { return J.data.meals[key] || null; },
    text: function (date) {
      var k = JX.key(date);
      var label = (date.getMonth() + 1) + "/" + date.getDate() + " " + DN[date.getDay()] + "요일";
      var m = J.data.meals[k];
      if (m && m.length) return label + " 급식이야.\n" + m.join(", ");
      var hol = JX.holiday(k);
      if (hol) return label + "은 " + hol + "이라 급식이 없어.";
      if (date.getDay() === 0 || date.getDay() === 6) return label + "은 주말이라 급식이 없어.";
      return label + " 급식 정보가 없어. 학교 탭 → 급식에서 넣을 수 있어.";
    }
  };
})();

/* ===== 캘린더 탭: 월간 달력, 일정, D-day, 공휴일, 하루 보기 ===== */
(function () {
  var J = window.J;
  var DN = ["일", "월", "화", "수", "목", "금", "토"];
  if (!Array.isArray(J.data.events)) { J.data.events = []; }
  var view = new Date(); view.setDate(1);
  var selKey = JX.key(new Date());

  function eventsOn(key) {
    return J.data.events.filter(function (e) { return e.date === key; })
      .sort(function (a, b) { return (a.time || "99") < (b.time || "99") ? -1 : 1; });
  }
  function ddayNum(key) {
    var t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((JX.fromKey(key) - t) / 86400000);
  }
  function ddayLabel(key) {
    var n = ddayNum(key);
    return n === 0 ? "D-day" : n > 0 ? "D-" + n : "D+" + (-n);
  }

  J.tab({
    id: "cal",
    group: "calg",
    groupLabel: "캘린더",
    label: "달력",
    show: function () { draw(); },
    mount: function (root) {
      root.appendChild(J.html(
        '<div class="top"><h1 class="view-title" id="calTitle">캘린더</h1>' +
          '<div class="row"><button class="btn small" type="button" id="calPrev" aria-label="지난 달">◀</button>' +
          '<button class="btn small" type="button" id="calToday">오늘</button>' +
          '<button class="btn small" type="button" id="calNext" aria-label="다음 달">▶</button></div>' +
        '</div>'
      ));
      var box = J.el("div", "cal");
      box.id = "calGrid";
      root.appendChild(box);
      var grid = J.el("div", "grid");
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="calDayTitle">' +
          '<h2 id="calDayTitle"></h2>' +
          '<div id="calDayInfo"></div>' +
          '<ul class="items" id="calDayEvents"></ul>' +
          '<form class="add" id="calAddForm" autocomplete="off" style="flex-wrap:wrap">' +
            '<input class="field" id="calAddTitle" type="text" placeholder="일정 추가 (예: 중간고사)" aria-label="일정 이름" style="flex:1 1 160px">' +
            '<input class="field mini-input" id="calAddTime" type="time" aria-label="시간 (선택)" style="flex:0 0 8.5em;width:8.5em">' +
            '<label class="toggle"><input type="checkbox" id="calAddDday"> D-day</label>' +
            '<button class="btn" type="submit">추가</button>' +
          '</form>' +
          '<div class="row"><button class="btn small" type="button" id="calOpenDiary">이 날 일기</button></div>' +
        '</section>'
      ));
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-upcoming">' +
          '<h2 id="h-upcoming">다가오는 일정</h2>' +
          '<ul class="items" id="calUpcoming"></ul>' +
        '</section>'
      ));
      root.appendChild(grid);

      J.$("calPrev").addEventListener("click", function () { view.setMonth(view.getMonth() - 1); draw(); });
      J.$("calNext").addEventListener("click", function () { view.setMonth(view.getMonth() + 1); draw(); });
      J.$("calToday").addEventListener("click", function () { view = new Date(); view.setDate(1); selKey = JX.key(new Date()); draw(); });
      J.$("calAddForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var title = J.$("calAddTitle").value.trim();
        if (!title) return;
        J.cal.add(selKey, title, { time: J.$("calAddTime").value || "", dday: J.$("calAddDday").checked });
        J.$("calAddTitle").value = "";
        J.$("calAddTime").value = "";
        J.$("calAddDday").checked = false;
      });
      J.$("calOpenDiary").addEventListener("click", function () { if (J.diary) J.diary.open(selKey); });
      draw();
    }
  });

  function draw() {
    if (!J.$("calGrid")) return;
    J.$("calTitle").textContent = view.getFullYear() + "년 " + (view.getMonth() + 1) + "월";
    var box = J.$("calGrid");
    box.textContent = "";
    DN.forEach(function (d, i) { box.appendChild(J.el("div", "cal-h" + (i === 0 ? " sun" : i === 6 ? " sat" : ""), d)); });
    var first = new Date(view.getFullYear(), view.getMonth(), 1);
    var start = JX.addDays(first, -first.getDay());
    var todayKey = JX.key(new Date());
    for (var i = 0; i < 42; i++) {
      var d = JX.addDays(start, i);
      if (i >= 35 && d.getMonth() !== view.getMonth()) break;
      box.appendChild(dayCell(d, todayKey));
    }
    drawDay();
    drawUpcoming();
  }
  function dayCell(d, todayKey) {
    var k = JX.key(d);
    var hol = JX.holiday(k);
    var cls = ["cal-d"];
    if (d.getMonth() !== view.getMonth()) cls.push("other");
    if (d.getDay() === 0 || hol) cls.push("sun");
    else if (d.getDay() === 6) cls.push("sat");
    if (k === todayKey) cls.push("today");
    if (k === selKey) cls.push("sel");
    var b = J.el("button", cls.join(" "));
    b.type = "button";
    b.setAttribute("data-date", k);
    var top = J.el("div", "cal-top");
    top.appendChild(J.el("span", "cal-n", String(d.getDate())));
    if (J.data.diary && J.data.diary[k] && J.data.diary[k].text) top.appendChild(J.el("span", "cal-mood", J.data.diary[k].mood || "•"));
    b.appendChild(top);
    if (hol) b.appendChild(J.el("div", "cal-hol", hol.replace(/^대체공휴일.*/, "대체공휴일")));
    var evs = eventsOn(k);
    evs.slice(0, 2).forEach(function (e) { b.appendChild(J.el("div", "cal-ev" + (e.dday ? " dday" : ""), e.title)); });
    if (evs.length > 2) b.appendChild(J.el("div", "cal-more", "+" + (evs.length - 2)));
    b.setAttribute("aria-label", (d.getMonth() + 1) + "월 " + d.getDate() + "일" + (hol ? " " + hol : "") + (evs.length ? " 일정 " + evs.length + "개" : ""));
    b.addEventListener("click", function () {
      selKey = k;
      if (d.getMonth() !== view.getMonth()) { view = new Date(d.getFullYear(), d.getMonth(), 1); }
      draw();
    });
    return b;
  }
  function drawDay() {
    var d = JX.fromKey(selKey);
    J.$("calDayTitle").textContent = (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + DN[d.getDay()] + "요일";
    var info = J.$("calDayInfo");
    info.textContent = "";
    var bits = [];
    var hol = JX.holiday(selKey);
    if (hol) bits.push(hol);
    if (J.tt) {
      var list = JTT.dayClasses(J.data.timetable, d);
      if (list && !list.holiday) {
        var n = list.filter(function (x) { return x.cls; }).length;
        if (n) bits.push("수업 " + n + "교시");
      }
    }
    if (J.money) {
      var spent = J.money.daySpent(selKey);
      if (spent) bits.push("쓴 돈 " + JX.won(spent));
    }
    if (J.data.diary && J.data.diary[selKey] && J.data.diary[selKey].text) bits.push("일기 " + (J.data.diary[selKey].mood || "있음"));
    if (bits.length) info.appendChild(J.el("p", "muted", bits.join(" · ")));
    var ul = J.$("calDayEvents");
    ul.textContent = "";
    var evs = eventsOn(selKey);
    if (!evs.length) {
      var li0 = J.el("li");
      li0.appendChild(J.el("p", "empty", "이 날 일정이 없어."));
      ul.appendChild(li0);
    }
    evs.forEach(function (e) {
      var li = J.el("li");
      if (e.time) li.appendChild(J.el("span", "stamp", e.time));
      li.appendChild(J.el("span", "item-text", e.title));
      if (e.dday) li.appendChild(J.el("span", "chip", J.dday ? J.dday.label(e) : ddayLabel(e.date)));
      var del = J.el("button", "btn small", "삭제");
      del.type = "button";
      del.addEventListener("click", function () {
        J.data.events = J.data.events.filter(function (x) { return x.id !== e.id; });
        J.save(); draw(); J.emit("events");
      });
      li.appendChild(del);
      ul.appendChild(li);
    });
  }
  function drawUpcoming() {
    var ul = J.$("calUpcoming");
    ul.textContent = "";
    var list = J.cal.upcoming(60);
    if (!list.length) {
      var li0 = J.el("li");
      li0.appendChild(J.el("p", "empty", "앞으로 60일 안에 일정이 없어. 달력에서 날짜를 눌러 추가해봐."));
      ul.appendChild(li0);
      return;
    }
    list.slice(0, 12).forEach(function (e) {
      var d = JX.fromKey(e.date);
      var li = J.el("li");
      li.appendChild(J.el("span", "stamp", (d.getMonth() + 1) + "/" + d.getDate() + " " + DN[d.getDay()]));
      li.appendChild(J.el("span", "item-text", (e.time ? e.time + " " : "") + e.title));
      li.appendChild(J.el("span", "chip", ddayLabel(e.date)));
      li.style.cursor = "pointer";
      li.addEventListener("click", function () { selKey = e.date; view = new Date(d.getFullYear(), d.getMonth(), 1); draw(); });
      ul.appendChild(li);
    });
  }

  J.cal = {
    add: function (key, title, opts) {
      opts = opts || {};
      J.data.events.push({ id: J.nextId(), date: key, title: title, time: opts.time || "", dday: !!opts.dday });
      J.save();
      if (J.$("calGrid")) draw();
      J.emit("events");
    },
    upcoming: function (days) {
      var today = JX.key(new Date());
      var end = JX.key(JX.addDays(new Date(), days));
      return J.data.events.filter(function (e) { return e.date >= today && e.date <= end; })
        .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.time || "99") < (b.time || "99") ? -1 : 1; });
    },
    ddays: function () {
      var today = JX.key(new Date());
      return J.data.events.filter(function (e) { return e.dday && e.kind !== "since" && e.date >= today; })
        .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    },
    ddayLabel: ddayLabel,
    open: function (key) { selKey = key; var d = JX.fromKey(key); view = new Date(d.getFullYear(), d.getMonth(), 1); J.go("cal"); },
    redraw: function () { if (J.$("calGrid")) draw(); }
  };
})();

/* ===== 캘린더 > D-day ===== */
(function () {
  var J = window.J;
  var DN = ["일", "월", "화", "수", "목", "금", "토"];
  if (!Array.isArray(J.data.events)) J.data.events = [];
  var kind = "until";

  function today0() { var t = new Date(); t.setHours(0, 0, 0, 0); return t; }
  function diff(key) { return Math.round((JX.fromKey(key) - today0()) / 86400000); }
  function label(e) {
    var n = diff(e.date);
    if (e.kind === "since") return (-n + 1) + "일째";
    return n === 0 ? "D-day" : n > 0 ? "D-" + n : "D+" + (-n);
  }
  function all() { return J.data.events.filter(function (e) { return e.dday; }); }
  function sorted() {
    var pin = J.data.ddayPin;
    return all().slice().sort(function (a, b) {
      if (a.id === pin) return -1;
      if (b.id === pin) return 1;
      var pa = a.kind !== "since" && diff(a.date) < 0, pb = b.kind !== "since" && diff(b.date) < 0;
      if (pa !== pb) return pa ? 1 : -1;
      if (a.kind === "since" && b.kind !== "since") return 1;
      if (b.kind === "since" && a.kind !== "since") return -1;
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
  }

  J.tab({
    id: "dday",
    group: "calg",
    label: "D-day",
    show: function () { draw(); },
    mount: function (root) {
      root.appendChild(J.el("h1", "view-title", "D-day"));
      var grid = J.el("div", "grid");
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-ddadd">' +
          '<h2 id="h-ddadd">새 D-day</h2>' +
          '<div class="seg" role="group" aria-label="세는 방법"><button type="button" id="ddUntil" aria-pressed="true">그날까지 (D-)</button><button type="button" id="ddSince" aria-pressed="false">그날부터 (며칠째)</button></div>' +
          '<input class="field" id="ddTitle" type="text" maxlength="30" autocomplete="off" placeholder="이름 (예: 중간고사, 방학, 사귄 날)">' +
          '<div class="add"><input class="field" id="ddDate" type="date" aria-label="날짜"><button class="btn primary" type="button" id="ddAdd">추가</button></div>' +
          '<div class="opt-row" id="ddQuick"></div>' +
          '<div id="ddNote"></div>' +
        '</section>'
      ));
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-ddlist">' +
          '<h2 id="h-ddlist">내 D-day <span id="ddCount"></span></h2>' +
          '<p class="muted">★을 누르면 대표 D-day가 돼서 홈 인사 옆에 보여.</p>' +
          '<div class="dd-list" id="ddList"></div>' +
        '</section>'
      ));
      root.appendChild(grid);
      J.$("ddUntil").addEventListener("click", function () { setKind("until"); });
      J.$("ddSince").addEventListener("click", function () { setKind("since"); });
      J.$("ddAdd").addEventListener("click", addFromForm);
      J.$("ddTitle").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addFromForm(); } });
      setKind("until");
      draw();
    }
  });

  function setKind(k) {
    kind = k;
    J.$("ddUntil").setAttribute("aria-pressed", k === "until" ? "true" : "false");
    J.$("ddSince").setAttribute("aria-pressed", k === "since" ? "true" : "false");
    var q = J.$("ddQuick");
    q.textContent = "";
    var opts = k === "until"
      ? [["+7일", 7], ["+14일", 14], ["+30일", 30], ["+50일", 50], ["+100일", 100], ["+365일", 365]]
      : [["오늘", 0], ["어제", -1], ["일주일 전", -7], ["한 달 전", -30], ["100일 전", -99]];
    opts.forEach(function (o) {
      var b = J.el("button", null, o[0]);
      b.type = "button";
      b.addEventListener("click", function () { J.$("ddDate").value = JX.key(JX.addDays(new Date(), o[1])); });
      q.appendChild(b);
    });
    J.$("ddDate").value = JX.key(JX.addDays(new Date(), k === "until" ? 7 : 0));
  }
  function note(kindN, text) {
    var el = J.$("ddNote");
    el.textContent = "";
    if (text) el.appendChild(J.el("div", "notice " + kindN, text));
  }
  function addFromForm() {
    var t = J.$("ddTitle").value.trim();
    var d = J.$("ddDate").value;
    if (!t) { note("err", "이름을 적어줘."); J.$("ddTitle").focus(); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { note("err", "날짜를 골라줘."); return; }
    var e = J.dday.add(t, d, kind);
    J.$("ddTitle").value = "";
    note("ok", t + " " + label(e) + " 추가했어.");
  }

  function draw() {
    var box = J.$("ddList");
    if (!box) return;
    box.textContent = "";
    var list = sorted();
    J.$("ddCount").textContent = list.length ? list.length + "개" : "";
    if (!list.length) {
      box.appendChild(J.el("p", "empty", "아직 D-day가 없어. 왼쪽에서 추가하거나 명령어 창에서 'D-day'를 골라봐."));
      return;
    }
    list.forEach(function (e) {
      var d = JX.fromKey(e.date);
      var past = e.kind !== "since" && diff(e.date) < 0;
      var card = J.el("div", "dd-card" + (e.id === J.data.ddayPin ? " pinned" : "") + (past ? " past" : ""));
      card.appendChild(J.el("b", "dd-num", label(e)));
      var mid = J.el("div", "dd-mid");
      mid.appendChild(J.el("span", "dd-title", e.title));
      mid.appendChild(J.el("span", "muted", d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate() + " (" + DN[d.getDay()] + ")" + (e.kind === "since" ? " 부터" : "")));
      card.appendChild(mid);

      pin.type = "button";
      pin.setAttribute("aria-label", e.title + " 대표 D-day로");
      pin.addEventListener("click", function () { J.dday.pin(e.id === J.data.ddayPin ? null : e.id); });
      var del = J.el("button", "btn small", "삭제");
      del.type = "button";
      del.addEventListener("click", function () { J.dday.remove(e.id); });
      card.appendChild(pin);
      card.appendChild(del);
      box.appendChild(card);
    });
  }

  J.dday = {
    label: label,
    list: sorted,
    pinned: function () {
      var l = all();
      var p = l.filter(function (e) { return e.id === J.data.ddayPin; })[0];
      if (p) return p;
      // 고정한 게 없으면 가장 가까운 다가오는 D-day
      return l.filter(function (e) { return e.kind !== "since" && diff(e.date) >= 0; })
        .sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0] || null;
    },
    add: function (title, date, k) {
      var e = { id: J.nextId(), date: date, title: title, time: "", dday: true, kind: k === "since" ? "since" : "until" };
      J.data.events.push(e);
      J.save();
      draw();
      if (J.cal) J.cal.redraw();
      J.emit("events");
      return e;
    },
    remove: function (id) {
      J.data.events = J.data.events.filter(function (x) { return x.id !== id; });
      if (J.data.ddayPin === id) J.data.ddayPin = null;
      J.save();
      draw();
      if (J.cal) J.cal.redraw();
      J.emit("events");
    },
    pin: function (id) {
      J.data.ddayPin = id;
      J.save();
      draw();
      J.emit("events");
    },
    redraw: draw
  };
  J.on("events", draw);
})();

/* ===== 기록 > 일기 ===== */
(function () {
  var J = window.J;
  var DN = ["일", "월", "화", "수", "목", "금", "토"];
  var MOODS = [["😄", "최고"], ["🙂", "좋음"], ["😐", "보통"], ["😢", "슬픔"], ["😡", "화남"], ["😴", "피곤"]];
  var PROMPTS = [
    "오늘 가장 기억에 남는 순간은?",
    "오늘 잘한 것 하나는?",
    "내일 꼭 하고 싶은 것은?",
    "오늘 고마웠던 사람이나 일은?",
    "오늘 새로 알게 된 것은?",
    "오늘 아쉬웠던 점과 다음엔 어떻게 할지?"
  ];
  if (!J.data.diary || typeof J.data.diary !== "object") J.data.diary = {};
  var curKey = JX.key(new Date());
  var timers = {};
  var pager = null;
  var first = null; // 지금 그려진 가장 오래된 날
  var last = null;  // 가장 최근 날 (보통 오늘)
  var scrollT = null;
  var mounted = false;

  J.tab({
    id: "diary",
    group: "rec",
    groupLabel: "기록",
    label: "일기",
    show: function () { build(); },
    mount: function (root) {
      root.appendChild(J.html(
        '<div class="top"><h1 class="view-title" id="diaryTitle">일기</h1>' +
          '<div class="row"><button class="btn small" type="button" id="diaryPrev" aria-label="전날">◀ 전날</button>' +
          '<button class="btn small" type="button" id="diaryToday">오늘</button>' +
          '<button class="btn small" type="button" id="diaryNext" aria-label="다음날">다음날 ▶</button></div>' +
        '</div>'
      ));
      root.appendChild(J.el("p", "muted diary-hint", "옆으로 밀면 하루씩 넘어가. 왼쪽이 어제, 그 왼쪽이 그저께야."));
      pager = J.el("div", "diary-pager");
      pager.id = "diaryPager";
      pager.setAttribute("aria-label", "날짜별 일기, 옆으로 넘기기");
      root.appendChild(pager);
      root.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-diarylist">' +
          '<h2 id="h-diarylist">지난 일기 <span id="diaryCount"></span></h2>' +
          '<ul class="items" id="diaryList"></ul>' +
        '</section>'
      ));
      J.$("diaryPrev").addEventListener("click", function () { step(-1); });
      J.$("diaryNext").addEventListener("click", function () { step(1); });
      J.$("diaryToday").addEventListener("click", function () { goTo(JX.key(new Date()), true); });
      pager.addEventListener("scroll", function () {
        clearTimeout(scrollT);
        scrollT = setTimeout(onScrolled, 90);
      });
      window.addEventListener("resize", function () { if (J.current === "diary") snapTo(curKey, false); });
      mounted = true;
      build();
    }
  });

  function addDays(k, n) { return JX.key(JX.addDays(JX.fromKey(k), n)); }
  function cmpKey(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
  function label(k) {
    var d = JX.fromKey(k);
    var today = JX.key(new Date());
    var rel = k === today ? "오늘" : k === addDays(today, -1) ? "어제" : k === addDays(today, -2) ? "그저께" : "";
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + DN[d.getDay()] + "요일" + (rel ? " (" + rel + ")" : "");
  }

  function pageFor(k) {
    var d = JX.fromKey(k);
    var e = J.data.diary[k];
    var pg = J.el("section", "panel diary-page");
    pg.setAttribute("data-key", k);
    pg.setAttribute("aria-label", label(k) + " 일기");
    var h = J.el("h2", null, label(k) + " ");
    var saved = J.el("span", "diary-saved", e ? "저장됨" : "");
    h.appendChild(saved);
    pg.appendChild(h);
    var moods = J.el("div", "moods");
    moods.setAttribute("role", "group");
    moods.setAttribute("aria-label", "기분 고르기");
    MOODS.forEach(function (m) {
      var b = J.el("button", "mood", m[0]);
      b.type = "button";
      b.title = m[1];
      b.setAttribute("aria-label", "기분 " + m[1]);
      b.setAttribute("aria-pressed", e && e.mood === m[0] ? "true" : "false");
      b.addEventListener("click", function () {
        var en = entry(k, true);
        en.mood = en.mood === m[0] ? "" : m[0];
        Array.prototype.forEach.call(moods.children, function (x) { x.setAttribute("aria-pressed", x === b && en.mood ? "true" : "false"); });
        commit(k);
      });
      moods.appendChild(b);
    });
    pg.appendChild(moods);
    pg.appendChild(J.el("p", "muted", "생각이 안 나면: " + PROMPTS[(d.getDate() + d.getMonth()) % PROMPTS.length]));
    var ta = J.el("textarea", "field diary-text");
    ta.placeholder = "있었던 일을 자유롭게 써봐. 쓰는 대로 저장돼.";
    ta.value = e ? e.text : "";
    ta.addEventListener("input", function () {
      entry(k, true).text = ta.value;
      saved.textContent = "저장 중…";
      clearTimeout(timers[k]);
      timers[k] = setTimeout(function () { commit(k); }, 600);
    });
    ta.addEventListener("blur", function () { if (timers[k]) { clearTimeout(timers[k]); commit(k); } });
    pg.appendChild(ta);
    var del = J.el("button", "btn small", "이 날 일기 지우기");
    del.type = "button";
    del.addEventListener("click", function () {
      if (del.getAttribute("data-armed") !== "1") {
        del.setAttribute("data-armed", "1");
        del.textContent = "정말 지울까? 한 번 더 누르면 지워";
        setTimeout(function () { del.removeAttribute("data-armed"); del.textContent = "이 날 일기 지우기"; }, 4000);
        return;
      }
      clearTimeout(timers[k]); delete timers[k];
      delete J.data.diary[k];
      J.save();
      ta.value = "";
      saved.textContent = "";
      Array.prototype.forEach.call(moods.children, function (x) { x.setAttribute("aria-pressed", "false"); });
      del.removeAttribute("data-armed");
      del.textContent = "이 날 일기 지우기";
      drawList();
      if (J.cal) J.cal.redraw();
    });
    var row = J.el("div", "row");
    row.appendChild(del);
    pg.appendChild(row);
    pg._saved = saved;
    return pg;
  }

  // curKey 를 포함하도록 페이지를 다시 그린다 (오늘이 맨 오른쪽)
  function build() {
    if (!mounted || !pager) return;
    flushAll();
    var today = JX.key(new Date());
    if (cmpKey(curKey, today) > 0) curKey = today;
    last = today;
    first = addDays(today, -13);
    if (cmpKey(curKey, first) < 0) first = addDays(curKey, -3);
    pager.textContent = "";
    for (var k = first; cmpKey(k, last) <= 0; k = addDays(k, 1)) pager.appendChild(pageFor(k));
    drawList();
    snapTo(curKey, false);
  }
  // 왼쪽 끝에 가까워지면 일주일씩 더 붙인다
  function prepend(n) {
    var w = pager.scrollWidth;
    var frag = document.createDocumentFragment();
    var start = addDays(first, -n);
    for (var k = start; cmpKey(k, first) < 0; k = addDays(k, 1)) frag.appendChild(pageFor(k));
    pager.insertBefore(frag, pager.firstChild);
    first = start;
    pager.scrollLeft += pager.scrollWidth - w;
  }
  function pageEl(k) { return pager.querySelector('[data-key="' + k + '"]'); }
  function snapTo(k, smooth) {
    var pg = pageEl(k);
    if (!pg) return;
    curKey = k;
    var left = pg.offsetLeft - pager.offsetLeft;
    if (smooth && pager.scrollTo) pager.scrollTo({ left: left, behavior: "smooth" });
    else pager.scrollLeft = left;
    title();
  }
  function goTo(k, smooth) {
    if (!pageEl(k)) { curKey = k; build(); return; }
    snapTo(k, smooth);
  }
  function step(d) {
    var k = addDays(curKey, d);
    if (cmpKey(k, last) > 0) return;
    if (cmpKey(k, first) < 0) prepend(7);
    snapTo(k, true);
  }
  function onScrolled() {
    var w = pager.clientWidth || 1;
    var pages = pager.children;
    var best = null, bestD = 1e9;
    for (var i = 0; i < pages.length; i++) {
      var dd = Math.abs(pages[i].offsetLeft - pager.offsetLeft - pager.scrollLeft);
      if (dd < bestD) { bestD = dd; best = pages[i]; }
    }
    if (best) { curKey = best.getAttribute("data-key"); title(); }
    if (pager.scrollLeft < w * 1.5) prepend(7);
  }
  function title() {
    var t = J.$("diaryTitle");
    if (t) t.textContent = label(curKey);
    var nx = J.$("diaryNext");
    if (nx) nx.disabled = curKey === last;
  }

  function entry(k, create) {
    var e = J.data.diary[k];
    if (!e && create) e = J.data.diary[k] = { mood: "", text: "", updated: 0 };
    return e;
  }
  function flushAll() { Object.keys(timers).forEach(function (k) { if (timers[k]) { clearTimeout(timers[k]); commit(k); } }); }
  function commit(k) {
    timers[k] = null;
    var e = J.data.diary[k];
    if (e) {
      if (!e.text.trim() && !e.mood) { delete J.data.diary[k]; }
      else {
        e.updated = Date.now();
        if (!e.counted && e.text.trim().length >= 10) {
          e.counted = true;
          J.emit("diary", { date: k });
        }
      }
    }
    J.save();
    var pg = pager && pageEl(k);
    if (pg) pg._saved.textContent = J.data.diary[k] ? "저장됨" : "";
    drawList();
    if (J.cal) J.cal.redraw();
  }
  function drawList() {
    var ul = J.$("diaryList");
    if (!ul) return;
    ul.textContent = "";
    var keys = Object.keys(J.data.diary).filter(function (k) { return J.data.diary[k] && (J.data.diary[k].text || J.data.diary[k].mood); }).sort().reverse();
    J.$("diaryCount").textContent = keys.length ? keys.length + "개" : "";
    if (!keys.length) {
      var li0 = J.el("li");
      li0.appendChild(J.el("p", "empty", "아직 쓴 일기가 없어."));
      ul.appendChild(li0);
      return;
    }
    keys.slice(0, 30).forEach(function (k) {
      var e = J.data.diary[k];
      var d = JX.fromKey(k);
      var li = J.el("li");
      li.style.cursor = "pointer";
      li.appendChild(J.el("span", "stamp", (d.getMonth() + 1) + "/" + d.getDate() + " " + DN[d.getDay()]));
      li.appendChild(J.el("span", null, e.mood || "·"));
      var t = (e.text || "").replace(/\s+/g, " ").trim();
      li.appendChild(J.el("span", "item-text", t.length > 40 ? t.slice(0, 40) + "…" : t || "(기분만 기록)"));
      li.addEventListener("click", function () { goTo(k, false); window.scrollTo(0, 0); });
      ul.appendChild(li);
    });
  }

  J.diary = {
    open: function (key) { curKey = key || JX.key(new Date()); J.go("diary"); },
    has: function (key) { var e = J.data.diary[key]; return !!(e && (e.text || e.mood)); }
  };
})();

      });
      J.$("mMemo").addEventListener("input", function () {
        if (type === "out" && J.$("mMemo").value) J.$("mCat").value = guessCat(J.$("mMemo").value, "out");
      });
      J.$("mBudget").value = J.data.moneyBudget || "";
      J.$("mBudget").addEventListener("change", function () {
        var v = parseInt(J.$("mBudget").value, 10);
        J.data.moneyBudget = v > 0 ? v : 0;
        J.save(); draw();
      });
      J.$("moneyPrev").addEventListener("click", function () { month.setMonth(month.getMonth() - 1); draw(); });
      J.$("moneyNext").addEventListener("click", function () { month.setMonth(month.getMonth() + 1); draw(); });
      J.$("moneyThis").addEventListener("click", function () { month = new Date(); month.setDate(1); draw(); });
      setType("out");
      draw();
    }
  });

  function note(kind, text) {
    var el = J.$("moneyNote");
    el.textContent = "";
    if (text) el.appendChild(J.el("div", "notice " + kind, text));
  }
  function setType(t) {
    type = t;
    J.$("mTypeOut").setAttribute("aria-pressed", t === "out" ? "true" : "false");
    J.$("mTypeIn").setAttribute("aria-pressed", t === "in" ? "true" : "false");
    var sel = J.$("mCat");
    sel.textContent = "";
    (t === "out" ? OUT_CATS : IN_CATS).forEach(function (c) { var o = J.el("option", null, c); o.value = c; sel.appendChild(o); });
  }
  function draw() {
    if (!J.$("moneyList")) return;
    var mk = monthKey(month);
    J.$("moneyTitle").textContent = month.getFullYear() + "년 " + (month.getMonth() + 1) + "월 가계부";
    var list = inMonth(mk);
    var tin = 0, tout = 0, byCat = {};
    list.forEach(function (x) {
      if (x.type === "in") tin += x.amount;
      else { tout += x.amount; byCat[x.cat] = (byCat[x.cat] || 0) + x.amount; }
    });
    J.$("sumIn").textContent = JX.won(tin);
    J.$("sumOut").textContent = JX.won(tout);
    J.$("sumLeft").textContent = (tin - tout < 0 ? "-" : "") + JX.won(Math.abs(tin - tout));
    // 분류별
    var cats = J.$("moneyCats");
    cats.textContent = "";
    var keys = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; });
    if (!keys.length) cats.appendChild(J.el("p", "empty", "이번 달에 쓴 돈 기록이 없어."));
    keys.forEach(function (k) {
      var row = J.el("div", "catbar");
      row.appendChild(J.el("span", null, k));
      var track = J.el("div", "track");
      var fill = J.el("i");
      fill.style.width = (tout ? (byCat[k] / tout) * 100 : 0) + "%";
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(J.el("span", "amt", JX.won(byCat[k])));
      cats.appendChild(row);
    });
    // 예산
    var budget = J.data.moneyBudget || 0;
    J.$("budgetBar").style.width = budget ? Math.min(100, (tout / budget) * 100) + "%" : "0%";
    J.$("budgetText").textContent = budget
      ? (tout <= budget ? "예산 " + JX.won(budget) + " 중 " + JX.won(budget - tout) + " 남았어." : "예산보다 " + JX.won(tout - budget) + " 더 썼어!")
      : "예산을 정하면 얼마나 남았는지 보여줄게.";
    // 목록
    var ul = J.$("moneyList");
    ul.textContent = "";
    J.$("moneyCount").textContent = list.length ? list.length + "개" : "";
    if (!list.length) {
      var li0 = J.el("li");
      li0.appendChild(J.el("p", "empty", "이 달 기록이 없어."));
      ul.appendChild(li0);
      return;
    }
    list.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id; }).forEach(function (x) {
      var d = JX.fromKey(x.date);
      var li = J.el("li");
      li.appendChild(J.el("span", "stamp", (d.getMonth() + 1) + "/" + d.getDate() + " " + DN[d.getDay()]));
      li.appendChild(J.el("span", "item-text", x.cat + (x.memo ? " · " + x.memo : "")));
      li.appendChild(J.el("span", "amount " + x.type, (x.type === "in" ? "+" : "-") + JX.won(x.amount)));
      var del = J.el("button", "btn small", "삭제");
      del.type = "button";
      del.addEventListener("click", function () {
        J.data.money = J.data.money.filter(function (y) { return y.id !== x.id; });
        J.save(); draw();
        if (J.cal) J.cal.redraw();
      });
      li.appendChild(del);
      ul.appendChild(li);
    });
  }

  J.money = {
    guessCat: guessCat,
    add: function (o) {
      J.data.money.push({ id: J.nextId(), date: o.date || JX.key(new Date()), type: o.type === "in" ? "in" : "out", amount: Math.round(o.amount), cat: o.cat || guessCat(o.memo || "", o.type), memo: o.memo || "" });
      J.save();
      draw();
      if (J.cal) J.cal.redraw();
      J.emit("money", o);
    },
    daySpent: function (key) {
      return J.data.money.filter(function (x) { return x.date === key && x.type === "out"; }).reduce(function (a, x) { return a + x.amount; }, 0);
    },
    monthText: function () {
      var mk = monthKey(new Date());
      var list = inMonth(mk);
      var tin = 0, tout = 0;
      list.forEach(function (x) { if (x.type === "in") tin += x.amount; else tout += x.amount; });
      var t = "이번 달 들어온 돈 " + JX.won(tin) + ", 쓴 돈 " + JX.won(tout) + "이야.";
      if (J.data.moneyBudget) t += tout <= J.data.moneyBudget ? " 예산은 " + JX.won(J.data.moneyBudget - tout) + " 남았어." : " 예산을 " + JX.won(tout - J.data.moneyBudget) + " 넘었어!";
      return t;
    }
  };
})();

/* ===== 기록 > 성장: 경험치, 레벨, 배지, 연속 기록 ===== */
(function () {
  var J = window.J;

    { id: "money30", ic: "🧾", name: "꼼꼼한 지갑", desc: "가계부 30번 기록", ok: function (s) { return s.money >= 30; } },
    { id: "backup1", ic: "💾", name: "안전제일", desc: "처음 백업하기", ok: function (s) { return s.backup >= 1; } },
    { id: "streak3", ic: "🔥", name: "3일 연속", desc: "3일 연속 활동", ok: function (s) { return s.streak >= 3; } },
    { id: "streak7", ic: "⚡", name: "일주일 연속", desc: "7일 연속 활동", ok: function (s) { return s.streak >= 7; } },
    { id: "streak30", ic: "👑", name: "한 달 연속", desc: "30일 연속 활동", ok: function (s) { return s.streak >= 30; } },
    { id: "lv5", ic: "⭐", name: "레벨 5", desc: "레벨 5 달성", ok: function (s) { return s.level >= 5; } },
    { id: "lv10", ic: "🌟", name: "레벨 10", desc: "레벨 10 달성", ok: function (s) { return s.level >= 10; } }
  ];

  function stats() {
    var s = {};
    Object.keys(RULES).forEach(function (k) { s[k] = g.count[k] || 0; });
    s.streak = JX.streak(g.days, new Date());
    s.level = JX.levelInfo(g.xp).level;
    return s;
  }

  var toastTimer = null;
  function toast(text) {
    if (J.focus && J.focus.active()) return; // 집중모드에서는 알림을 띄우지 않는다
    var t = J.$("toast");
    if (!t) {
      t = J.el("div", "toast");
      t.id = "toast";
      t.setAttribute("role", "status");
      document.body.appendChild(t);
    }
    t.textContent = text;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }

  function gain(kind) {
    var r = RULES[kind];
    if (!r) return;
    var today = JX.key(new Date());
    if (r.perDay) {
      var dk = today + ":" + kind;
      if ((g.daily[dk] || 0) >= r.perDay) return;
      g.daily[dk] = (g.daily[dk] || 0) + 1;
      // 오래된 하루 기록은 정리
      Object.keys(g.daily).forEach(function (k) { if (k.slice(0, 10) < JX.key(JX.addDays(new Date(), -7))) delete g.daily[k]; });
    }
    var before = JX.levelInfo(g.xp).level;
    g.xp += r.xp;
    var dly = J.data.daily || (J.data.daily = {});
    var dd = dly[today] || (dly[today] = {});
    dd.xp = (dd.xp || 0) + r.xp;
    if (kind === "todo") dd.todo = (dd.todo || 0) + 1;
    g.count[kind] = (g.count[kind] || 0) + 1;
    g.days[today] = 1;
    g.log.unshift({ t: Date.now(), kind: kind, xp: r.xp });
    g.log = g.log.slice(0, 40);
    var after = JX.levelInfo(g.xp).level;
    var newBadges = [];
    var s = stats();
    BADGES.forEach(function (b) {
      if (!g.badges[b.id] && b.ok(s)) { g.badges[b.id] = Date.now(); newBadges.push(b); }
    });
    J.save();
    if (after > before) {
      toast("레벨 업! Lv." + after + " 🎉");
      J.say("레벨 업! 이제 Lv." + after + "이야. 잘하고 있어!");
    } else if (newBadges.length) {
      toast("배지 획득: " + newBadges[0].ic + " " + newBadges[0].name);
    } else {
      toast(r.label + " +" + r.xp + " 경험치");
    }
    newBadges.forEach(function (b) { J.say("배지를 얻었어: " + b.ic + " " + b.name + " (" + b.desc + ")"); });
    J.emit("game");
    draw();
  }

  J.on("todo_done", function () { gain("todo"); });
  J.on("pomo_done", function () { gain("pomo"); });
  J.on("diary", function () { gain("diary"); });
  J.on("money", function () { gain("money"); });
  J.on("backup", function () { gain("backup"); });

  J.tab({

          '<h2 id="h-level">내 레벨 <span id="gStreak"></span></h2>' +
          '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><b id="gLevel" style="font-family:var(--font-mono);font-size:40px;color:var(--accent)">Lv.1</b><span class="muted" id="gXp"></span></div>' +
          '<div class="bar" aria-hidden="true"><i id="gBar"></i></div>' +
          '<p class="muted">할 일 완료 +10 · 뽀모도로 집중 +15 · 일기 +10 · 가계부 +2 (하루 5번까지) · 백업 +5 (하루 1번)</p>' +
        '</section>'
      ));
      var grid = J.el("div", "grid");
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-badges">' +
          '<h2 id="h-badges">배지 <span id="gBadgeCount"></span></h2>' +
          '<div class="badges" id="gBadges"></div>' +
        '</section>'
      ));
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-glog">' +
          '<h2 id="h-glog">최근 경험치</h2>' +
          '<p class="muted" id="gCounts"></p>' +
          '<ul class="items" id="gLog"></ul>' +
        '</section>'
      ));
      root.appendChild(grid);
      draw();
    }
  });

  function draw() {
    if (!J.$("gLevel")) return;
    var info = JX.levelInfo(g.xp);
    var s = stats();
    J.$("gLevel").textContent = "Lv." + info.level;
    J.$("gXp").textContent = "다음 레벨까지 " + (info.need - info.into) + " 경험치 (총 " + g.xp + ")";
    J.$("gBar").style.width = (info.into / info.need) * 100 + "%";
    J.$("gStreak").textContent = s.streak ? "🔥 " + s.streak + "일 연속" : "";
    var box = J.$("gBadges");
    box.textContent = "";
    var got = 0;
    BADGES.forEach(function (b) {
      var have = !!g.badges[b.id];
      if (have) got++;
      var el = J.el("div", "badge" + (have ? "" : " locked"));
      el.appendChild(J.el("span", "ic", b.ic));
      el.appendChild(J.el("b", null, b.name));
      el.appendChild(J.el("span", null, b.desc));
      box.appendChild(el);
    });
    J.$("gBadgeCount").textContent = got + " / " + BADGES.length;
    J.$("gCounts").textContent = "할 일 " + s.todo + " · 뽀모도로 " + s.pomo + " · 일기 " + s.diary + " · 가계부 " + s.money;

    if (!g.log.length) {
      var li0 = J.el("li");
      li0.appendChild(J.el("p", "empty", "할 일을 끝내거나 뽀모도로를 돌리면 경험치가 쌓여."));
      ul.appendChild(li0);

      var d = new Date(x.t);
      var li = J.el("li");
      li.appendChild(J.el("span", "stamp", (d.getMonth() + 1) + "/" + d.getDate() + " " + J.pad2(d.getHours()) + ":" + J.pad2(d.getMinutes())));
      li.appendChild(J.el("span", "item-text", RULES[x.kind] ? RULES[x.kind].label : x.kind));
      li.appendChild(J.el("span", "amount in", "+" + x.xp));
      ul.appendChild(li);
    });
  }

  J.game = {
    summary: function () {
      var info = JX.levelInfo(g.xp);
      var st = JX.streak(g.days, new Date());
      return { level: info.level, into: info.into, need: info.need, streak: st, xp: g.xp };
    },
    text: function () {
      var s = J.game.summary();
      return "지금 Lv." + s.level + "이야. 다음 레벨까지 " + (s.need - s.into) + " 경험치 남았어." + (s.streak ? " 🔥 " + s.streak + "일 연속 활동 중!" : "");

/* ===== 기록 > 그래프: 하루 단위 꺾은선 그래프 ===== */
(function () {
  var J = window.J;
  var DN = ["일", "월", "화", "수", "목", "금", "토"];
  var MOOD = { "😄": 5, "🙂": 4, "😐": 3, "😴": 2.5, "😢": 2, "😡": 1 };
  var METRICS = {
    study: { label: "공부 시간", unit: "분", get: function (k) { return Math.round((J.data.study && J.data.study[k] || 0) / 60); } },

    xp: { label: "경험치", unit: "XP", get: function (k) { return (J.data.daily && J.data.daily[k] && J.data.daily[k].xp) || 0; } },
    mood: { label: "기분", unit: "점", gaps: true, max: 5, get: function (k) { var e = J.data.diary && J.data.diary[k]; return e && MOOD[e.mood] != null ? MOOD[e.mood] : null; } }
  };
  var metric = "study";
  var days = 7;

  J.tab({
    id: "graph",
    group: "rec",
    label: "그래프",
    show: function () { draw(); },
    mount: function (root) {
      root.appendChild(J.el("h1", "view-title", "그래프"));
      root.appendChild(J.html('<div class="opt-row" id="gMetric" role="group" aria-label="무엇을 볼까"></div>'));
      root.appendChild(J.html('<div class="opt-row" id="gRange" role="group" aria-label="기간"></div>'));
      root.appendChild(J.html(
        '<section class="panel" aria-labelledby="gTitle">' +
          '<h2 id="gTitle"></h2>' +
          '<div class="chart" id="gChart"></div>' +
          '<div class="sum-row" id="gSummary"></div>' +
          '<details class="g-table"><summary>숫자로 보기</summary><ul class="items" id="gTable"></ul></details>' +
        '</section>'
      ));
      window.addEventListener("resize", function () { if (J.current === "graph") draw(); });
      J.on("study", function () { if (J.current === "graph") draw(); });
      draw();
    }
  });

  function opts(boxId, list, cur, set) {
    var box = J.$(boxId);
    box.textContent = "";
    list.forEach(function (o) {
      var b = J.el("button", null, o[1]);
      b.type = "button";
      b.setAttribute("aria-pressed", cur === o[0] ? "true" : "false");
      b.addEventListener("click", function () { set(o[0]); draw(); });
      box.appendChild(b);
    });
  }
  function niceMax(v) {
    if (v <= 0) return 1;
    var p = Math.pow(10, Math.floor(Math.log10(v)));
    var n = v / p;
    var step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return step * p;
  }
  function fmt(v, m) {
    if (v == null) return "기록 없음";
    if (m.unit === "원") return JX.won(v);
    if (m.unit === "분" && v >= 60) return Math.floor(v / 60) + "시간 " + (v % 60) + "분";
    return (Math.round(v * 10) / 10) + m.unit;
  }
  function short(v, m) {
    if (m.unit === "원") return v >= 10000 ? (v / 10000) + "만" : v >= 1000 ? (v / 1000) + "천" : String(v);
    return String(v);
  }

  function draw() {
    var box = J.$("gChart");
    if (!box) return;
    opts("gMetric", Object.keys(METRICS).map(function (k) { return [k, METRICS[k].label]; }), metric, function (v) { metric = v; });
    opts("gRange", [[7, "7일"], [14, "14일"], [30, "30일"]], days, function (v) { days = v; });
    var m = METRICS[metric];
    J.$("gTitle").textContent = m.label + " (" + m.unit + ") · 최근 " + days + "일";
    var today = new Date();
    var pts = [];
    for (var i = days - 1; i >= 0; i--) {
      var d = JX.addDays(today, -i);
      var k = JX.key(d);
      pts.push({ d: d, k: k, v: m.get(k) });
    }
    var vals = pts.map(function (p) { return p.v; }).filter(function (v) { return v != null; });
    var maxV = m.max || niceMax(Math.max.apply(null, vals.concat([0])));

    // 크기
    var W = Math.max(280, box.clientWidth || 600);
    var H = 240, L = 46, R = 14, T = 14, B = 30;
    var pw = W - L - R, ph = H - T - B;
    var x = function (i) { return L + (pts.length === 1 ? pw / 2 : (i * pw) / (pts.length - 1)); };
    var y = function (v) { return T + ph - (v / maxV) * ph; };
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    svg.setAttribute("height", H);

    function add(tag, attrs, text) {
      var e = document.createElementNS(ns, tag);
      Object.keys(attrs).forEach(function (a) { e.setAttribute(a, attrs[a]); });
      if (text != null) e.textContent = text;
      svg.appendChild(e);
      return e;
    }

    for (var t = 0; t <= 4; t++) {
      var tv = (maxV * t) / 4;

      add("line", { x1: L, x2: W - R, y1: yy, y2: yy, "class": t === 0 ? "g-base" : "g-grid" });
      add("text", { x: L - 6, y: yy + 4, "text-anchor": "end", "class": "g-label" }, short(Math.round(tv * 10) / 10, m));
    }
    // x축 날짜 (너무 많으면 건너뛰기)
    var every = days <= 7 ? 1 : days <= 14 ? 2 : 5;
    pts.forEach(function (p, i) {
      if (i % every !== 0 && i !== pts.length - 1) return;
      add("text", { x: x(i), y: H - 8, "text-anchor": "middle", "class": "g-label" }, days <= 7 ? DN[p.d.getDay()] : (p.d.getMonth() + 1) + "/" + p.d.getDate());
    });
    // 선 (기분처럼 기록 없는 날은 끊는다)
    var dPath = "";
    var pen = false;
    pts.forEach(function (p, i) {
      if (p.v == null) { pen = false; return; }
      dPath += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1) + " ";
      pen = true;
    });
    if (dPath) add("path", { d: dPath, "class": "g-line" });
    // 점과 마지막 값 강조
    var lastIdx = -1;
    pts.forEach(function (p, i) {
      if (p.v == null) return;
      lastIdx = i;
      add("circle", { cx: x(i), cy: y(p.v), r: days > 14 ? 3 : 4, "class": "g-dot" });
    });
    if (lastIdx >= 0) {
      var lp = pts[lastIdx];
      add("circle", { cx: x(lastIdx), cy: y(lp.v), r: 6, "class": "g-dot-end" });
      add("text", { x: Math.min(x(lastIdx), W - R - 2), y: Math.max(T + 10, y(lp.v) - 10), "text-anchor": "end", "class": "g-value" }, fmt(lp.v, m));
    }
    // 가리키면 보이는 십자선과 말풍선
    var cross = add("line", { x1: 0, x2: 0, y1: T, y2: T + ph, "class": "g-cross", visibility: "hidden" });
    box.textContent = "";
    box.appendChild(svg);
    var tip = J.el("div", "g-tip");
    tip.hidden = true;
    box.appendChild(tip);
    var hit = add("rect", { x: L, y: T, width: pw, height: ph, fill: "transparent" });
    function show(evt) {
      var rect = svg.getBoundingClientRect();
      var px = ((evt.clientX - rect.left) / rect.width) * W;
      var i = Math.round(((px - L) / pw) * (pts.length - 1));
      i = Math.max(0, Math.min(pts.length - 1, i));
      var p = pts[i];
      cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
      tip.hidden = false;
      tip.textContent = (p.d.getMonth() + 1) + "/" + p.d.getDate() + " (" + DN[p.d.getDay()] + ") · " + fmt(p.v, m);
      var left = (x(i) / W) * rect.width;
      tip.style.left = Math.max(0, Math.min(rect.width - 150, left - 75)) + "px";
    }
    hit.addEventListener("pointermove", show);
    hit.addEventListener("pointerdown", show);
    hit.addEventListener("pointerleave", function () { cross.setAttribute("visibility", "hidden"); tip.hidden = true; });

    // 요약
    var sum = vals.reduce(function (a, b) { return a + b; }, 0);
    var sumBox = J.$("gSummary");
    sumBox.textContent = "";
    var cards = m.unit === "점"
      ? [["기록한 날", vals.length + "일"], ["평균", vals.length ? fmt(Math.round((sum / vals.length) * 10) / 10, m) : "-"], ["최고", vals.length ? fmt(Math.max.apply(null, vals), m) : "-"]]
      : [["합계", fmt(sum, m)], ["하루 평균", fmt(Math.round(sum / days), m)], ["최고", fmt(Math.max.apply(null, vals.concat([0])), m)]];
    cards.forEach(function (c) {
      var d = J.el("div", "sum");
      d.appendChild(J.el("span", null, c[0]));
      d.appendChild(J.el("b", null, c[1]));
      sumBox.appendChild(d);
    });
    // 숫자 표
    var ul = J.$("gTable");
    ul.textContent = "";
    pts.slice().reverse().forEach(function (p) {
      var li = J.el("li");
      li.appendChild(J.el("span", "stamp", (p.d.getMonth() + 1) + "/" + p.d.getDate() + " " + DN[p.d.getDay()]));
      li.appendChild(J.el("span", "item-text", fmt(p.v, m)));
      ul.appendChild(li);
    });
    if (!vals.length || (m.unit !== "점" && sum === 0)) {
      var empty = J.el("p", "empty", "아직 이 기간 기록이 없어. " + ({ study: "공부 집중모드를 써봐.", pomo: "뽀모도로를 돌려봐.", todo: "할 일을 끝내봐.", money: "가계부에 기록해봐.", xp: "할 일, 뽀모도로, 일기로 경험치를 모아봐.", mood: "일기에서 기분을 골라봐." }[metric]));
      box.appendChild(empty);
    }
  }
})();

  /* ---------- 뽀모도로 ----------

  var PHASE = { focus: "집중", short: "짧은 휴식", long: "긴 휴식" };

  function drawPomo() {

    if (pomo.endAt === null) togglePomo();
    J.say("뽀모도로 " + PHASE[pomo.phase] + " 시작할게.");
  });
  J.command("뽀모도로 멈춤", function () {
    if (pomo.endAt !== null) togglePomo();
    J.say("뽀모도로 멈췄어.");
  });

  /* ---------- 스톱워치 ---------- */
  var sw = { elapsed: 0, startAt: null, iv: null, laps: [] };

  function swNow() { return sw.elapsed + (sw.startAt !== null ? Date.now() - sw.startAt : 0); }
  function fmtMs(ms) {
    var cs = Math.floor(ms / 10) % 100;
    var s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600);
    var rest = J.pad2(Math.floor((s % 3600) / 60)) + ":" + J.pad2(s % 60) + "." + J.pad2(cs);
    return h > 0 ? h + ":" + rest : rest;
  }
  function swPanel() {
    var p = J.html(
      '<section class="panel" id="swPanel" aria-labelledby="h-sw">' +
        '<h2 id="h-sw">스톱워치</h2>' +
        '<div class="big-time" id="swTime">00:00.00</div>' +
        '<div class="row">' +
          '<button class="btn primary grow" type="button" id="swStart">시작</button>' +
          '<button class="btn grow" type="button" id="swLap" disabled>구간 기록</button>' +
          '<button class="btn grow" type="button" id="swReset">초기화</button>' +
        '</div>' +
        '<ul class="items laps" id="swLaps"></ul>' +
      '</section>'
    );
    p.querySelector("#swStart").addEventListener("click", toggleSw);
    p.querySelector("#swLap").addEventListener("click", lapSw);
    p.querySelector("#swReset").addEventListener("click", resetSw);
    return p;
  }
  function drawSw() {
    if (!J.$("swTime")) return;
    J.$("swTime").textContent = fmtMs(swNow());
    J.$("swStart").textContent = sw.startAt !== null ? "멈춤" : (sw.elapsed > 0 ? "계속" : "시작");
    J.$("swLap").disabled = sw.startAt === null;
  }
  function drawLaps() {
    var ul = J.$("swLaps");
    ul.textContent = "";
    sw.laps.slice().reverse().forEach(function (lap, i) {
      var li = J.el("li");
      li.appendChild(J.el("span", "num", (sw.laps.length - i) + "."));
      li.appendChild(J.el("span", "item-text stamp", "구간 " + fmtMs(lap.split)));
      li.appendChild(J.el("span", "stamp", "전체 " + fmtMs(lap.total)));
      ul.appendChild(li);
    });
  }
  function toggleSw() {
    if (sw.startAt !== null) {
      sw.elapsed = swNow();
      sw.startAt = null;
      clearInterval(sw.iv);
      sw.iv = null;
    } else {
      sw.startAt = Date.now();
      sw.iv = setInterval(drawSw, 50);
    }
    drawSw();
  }
  function lapSw() {
    var total = swNow();
    var prev = sw.laps.length ? sw.laps[sw.laps.length - 1].total : 0;
    sw.laps.push({ total: total, split: total - prev });
    drawLaps();
  }
  function resetSw() {
    if (sw.iv) clearInterval(sw.iv);
    sw = { elapsed: 0, startAt: null, iv: null, laps: [] };
    drawSw();
    drawLaps();
  }
  J.sw = {
    state: function () { return { ms: swNow(), running: sw.startAt !== null }; },
    fmt: fmtMs,
    start: function () { if (sw.startAt === null) toggleSw(); },
    stop: function () { if (sw.startAt !== null) toggleSw(); return fmtMs(swNow()); },
    reset: resetSw,
    lap: function () { if (sw.startAt === null) return false; lapSw(); return fmtMs(sw.laps[sw.laps.length - 1].total); },
    status: function () {
      var t = swNow();
      if (t === 0) return "";
      return "스톱워치 " + fmtMs(t).replace(/\.\d\d$/, "") + (sw.startAt === null ? " (멈춤)" : "");
    }
  };
  J.command("스톱워치 시작", function () {
    if (sw.startAt === null) toggleSw();
    J.say("스톱워치 시작했어.");
  });
  J.command("스톱워치 멈춤", function () {
    if (sw.startAt !== null) toggleSw();
    J.say("스톱워치 멈췄어. " + fmtMs(swNow()));
  });
})();

/* ===== 계산기 탭 ===== */
(function () {
  var J = window.J;
  var expr = "";
  var deg = true;
  var justEvaluated = false;

  var BASIC = [
    ["C", "clear", ""], ["⌫", "back", ""], ["(", "ins", "("], [")", "ins", ")"],
    ["7", "ins", "7"], ["8", "ins", "8"], ["9", "ins", "9"], ["÷", "ins", "÷", "op"],
    ["4", "ins", "4"], ["5", "ins", "5"], ["6", "ins", "6"], ["×", "ins", "×", "op"],
    ["1", "ins", "1"], ["2", "ins", "2"], ["3", "ins", "3"], ["−", "ins", "−", "op"],
    ["0", "ins", "0"], [".", "ins", "."], ["%", "ins", "%", "op"], ["+", "ins", "+", "op"]
  ];
  var SCI = [
    ["sin", "ins", "sin("], ["cos", "ins", "cos("], ["tan", "ins", "tan("], ["π", "ins", "π"],
    ["sin⁻¹", "ins", "asin("], ["cos⁻¹", "ins", "acos("], ["tan⁻¹", "ins", "atan("], ["e", "ins", "e"],
    ["√", "ins", "√("], ["x²", "ins", "^2"], ["xʸ", "ins", "^"], ["n!", "ins", "!"],
    ["log", "ins", "log("], ["ln", "ins", "ln("], ["|x|", "ins", "abs("], ["DEG", "deg", ""]
  ];

  J.tab({
    id: "calc",
    group: "tools",
    label: "계산기",
    mount: function (root) {
      root.appendChild(J.el("h1", "view-title", "계산기"));
      var wrap = J.el("div", "calc");
      wrap.style.display = "flex";
      wrap.style.flexDirection = "column";
      wrap.style.gap = "12px";
      wrap.appendChild(J.html(
        '<div class="calc-screen" aria-live="polite">' +
          '<div class="calc-expr" id="calcExpr"></div>' +
          '<div class="calc-prev" id="calcPrev"></div>' +
        '</div>'
      ));
      wrap.appendChild(J.html(
        '<label class="toggle"><input type="checkbox" id="sciToggle"> 공학용 버튼 보기</label>'
      ));
      var sci = J.el("div", "keys sci");
      sci.id = "sciKeys";
      sci.hidden = true;
      SCI.forEach(function (k) { sci.appendChild(key(k)); });
      wrap.appendChild(sci);
      var keys = J.el("div", "keys");
      BASIC.forEach(function (k) { keys.appendChild(key(k)); });
      var eq = J.el("button", "btn primary wide", "=");
      eq.type = "button";
      eq.id = "calcEq";
      eq.addEventListener("click", evaluateNow);
      keys.appendChild(eq);
      wrap.appendChild(keys);

      var hist = J.html(
        '<section class="panel" aria-labelledby="h-hist">' +
          '<h2 id="h-hist">최근 계산 <button class="btn small" type="button" id="histClear">지우기</button></h2>' +
          '<ul class="items history" id="calcHist"></ul>' +
        '</section>'
      );
      wrap.appendChild(hist);
      root.appendChild(wrap);

      J.$("sciToggle").addEventListener("change", function (e) { J.$("sciKeys").hidden = !e.target.checked; });
      J.$("histClear").addEventListener("click", function () { J.data.calcHistory = []; J.save(); drawHistory(); });
      document.addEventListener("keydown", onKey);
      draw();
      drawHistory();
    }
  });

  function key(k) {
    var b = J.el("button", "btn" + (k[3] ? " " + k[3] : ""), k[0]);
    b.type = "button";
    if (k[1] === "deg") b.id = "degKey";
    b.addEventListener("click", function () { press(k[1], k[2]); });
    return b;
  }

  function press(action, text) {
    if (action === "clear") { expr = ""; justEvaluated = false; }
    else if (action === "back") { expr = expr.slice(0, -1); justEvaluated = false; }
    else if (action === "deg") { deg = !deg; }
    else if (action === "ins") {
      // 결과가 나온 직후 숫자를 누르면 새 계산, 연산자를 누르면 결과에 이어서 계산
      if (justEvaluated && /^[\d.(]|^[a-z√π]/i.test(text)) expr = "";
      justEvaluated = false;
      if (expr.length < 200) expr += text;
    }
    draw();
  }

  function preview() {
    if (!expr) return { text: "", err: false };
    try { return { text: "= " + JCalc.format(JCalc.evaluate(expr, { deg: deg })), err: false }; }
    catch (e) { return { text: "", err: false }; }
  }

  function draw() {
    J.$("calcExpr").textContent = expr || "0";
    var prev = J.$("calcPrev");
    if (!justEvaluated) {
      prev.className = "calc-prev";
      prev.textContent = preview().text;
    }
    J.$("degKey").textContent = deg ? "DEG" : "RAD";
    J.$("degKey").title = deg ? "각도: 도(°) 단위" : "각도: 라디안 단위";
  }

  function evaluateNow() {
    if (!expr) return;
    var prev = J.$("calcPrev");
    try {
      var r = JCalc.format(JCalc.evaluate(expr, { deg: deg }));
      J.data.calcHistory.unshift({ e: expr, r: r });
      J.data.calcHistory = J.data.calcHistory.slice(0, 20);
      J.save();
      prev.className = "calc-prev";
      prev.textContent = expr + " =";
      expr = r;
      justEvaluated = true;
      J.$("calcExpr").textContent = expr;
      drawHistory();
    } catch (e) {
      prev.className = "calc-prev err";
      prev.textContent = e.message;
    }
  }

  function drawHistory() {
    var ul = J.$("calcHist");
    ul.textContent = "";
    if (!J.data.calcHistory.length) {
      var li0 = J.el("li");
      li0.appendChild(J.el("p", "empty", "아직 계산 기록이 없어."));
      ul.appendChild(li0);
      return;
    }
    J.data.calcHistory.forEach(function (h) {
      var li = J.el("li");
      li.appendChild(J.el("span", "item-text", h.e + " = " + h.r));
      li.title = "누르면 결과를 다시 써";
      li.addEventListener("click", function () { expr = h.r; justEvaluated = true; draw(); });
      ul.appendChild(li);
    });
  }

  function onKey(e) {
    if (J.current !== "calc") return;
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    var k = e.key;
    var map = { "*": "×", "/": "÷", "-": "−" };
    if (/^[\d.+%()^!]$/.test(k)) { press("ins", k); e.preventDefault(); }
    else if (map[k]) { press("ins", map[k]); e.preventDefault(); }
    else if (k === "Enter" || k === "=") { evaluateNow(); e.preventDefault(); }
    else if (k === "Backspace") { press("back"); e.preventDefault(); }
    else if (k === "Escape" || k === "Delete") { press("clear"); e.preventDefault(); }
  }

  J.command("계산", function (arg) {
    if (!arg) { J.say("계산할 식을 적어줘. 예) 계산 3*(2+5)"); return; }
    try { J.say(arg + " = " + JCalc.format(JCalc.evaluate(arg, { deg: true }))); }
    catch (e) { J.say("계산 못 했어: " + e.message); }
  });
})();

/* ===== 도구 > 영어사전 ===== */
(function () {
  var J = window.J;
  var POS = { n: "명사", v: "동사", a: "형용사", ad: "부사", prep: "전치사", conj: "접속사", pron: "대명사", "int": "감탄사", aux: "조동사", "관": "관사", pv: "구동사", idiom: "숙어" };
  var LV = { m: "중등", h: "고등", i: "숙어" };
  var only = "all"; // all | word | idiom
  var WORDS = (window.J_DICT || []).map(function (r) { return { w: r[0], p: r[1], m: r[2], lv: r[3] }; });
  WORDS.sort(function (a, b) { return a.w.toLowerCase() < b.w.toLowerCase() ? -1 : 1; });
  var INDEX = {};
  WORDS.forEach(function (x) { INDEX[x.w.toLowerCase()] = x; });
  if (!J.data.wordbook || typeof J.data.wordbook !== "object") J.data.wordbook = {};
  var current = null;
  var quiz = null;

  function posText(p) { return String(p || "").split(/[,/]/).map(function (x) { return POS[x.trim()] || x.trim(); }).join(", "); }
  function okKind(x) { return only === "all" || (only === "idiom" ? x.lv === "i" : x.lv !== "i"); }
  var IDIOMS = WORDS.filter(function (x) { return x.lv === "i"; });
  function search(q, limit) {
    q = String(q || "").trim();
    limit = limit || 60;
    var out = [];
    if (!q) {
      if (only === "idiom") return IDIOMS.slice(0, limit);
      return [];
    }
    if (/[가-힣]/.test(q)) {
      WORDS.forEach(function (x) { if (out.length < limit && okKind(x) && x.m.indexOf(q) >= 0) out.push(x); });
      return out;
    }
    var l = q.toLowerCase();
    WORDS.forEach(function (x) { if (out.length < limit && okKind(x) && x.w.toLowerCase().indexOf(l) === 0) out.push(x); });
    // 숙어 안의 단어로도 찾는다 (예: look → look after, take a look ...)
    WORDS.forEach(function (x) { if (out.length < limit && okKind(x) && x.w.toLowerCase().indexOf(l) > 0 && out.indexOf(x) < 0) out.push(x); });
    return out;
  }
  function dayIdiom() {
    if (!IDIOMS.length) return null;
    var d = new Date();
    var n = d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate();
    return IDIOMS[(n * 104729) % IDIOMS.length];
  }
  function dayWord() {
    if (!WORDS.length) return null;

    return WORDS[(n * 7919) % WORDS.length];
  }
  function speak(word) {
    try {
      if (!window.speechSynthesis) return false;
      var u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.9;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }

  J.tab({
    id: "dict",
    group: "tools",
    label: "영어사전",
    show: function () { drawStars(); },
    mount: function (root) {
      root.appendChild(J.el("h1", "view-title", "영어사전"));
      root.appendChild(J.html(
        '<form class="add" id="dictForm" autocomplete="off" role="search">' +
          '<input class="field" id="dictInput" type="search" placeholder="영어 단어나 한글 뜻으로 찾기 (예: happy, 행복)" aria-label="단어 찾기" autocapitalize="off" spellcheck="false">' +
          '<button class="btn primary" type="submit">찾기</button>' +
        '</form>'
      ));
      root.appendChild(J.el("p", "muted", "")).id = "dictInfo";
      root.appendChild(J.html('<div class="opt-row" id="dictKind" role="group" aria-label="무엇을 찾을까"></div>'));
      root.appendChild(J.html('<button class="quote-box dict-today" type="button" id="dictIdiomToday"></button>'));
      var grid = J.el("div", "grid");
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-dictres">' +
          '<h2 id="h-dictres">찾은 단어 <span id="dictCount"></span></h2>' +
          '<ul class="items" id="dictResults"></ul>' +
        '</section>'
      ));
      grid.appendChild(J.html(
        '<section class="panel" id="dictCard" aria-labelledby="dictWord">' +
          '<h2>단어 <span id="dictLv"></span></h2>' +
          '<div class="dict-head"><b id="dictWord"></b><span class="muted" id="dictPos"></span></div>' +
          '<p class="dict-mean" id="dictMean"></p>' +
          '<div class="row">' +
            '<button class="btn" type="button" id="dictSpeak">🔊 발음</button>' +
            '<button class="btn" type="button" id="dictStar">☆ 단어장에 넣기</button>' +
          '</div>' +
        '</section>'
      ));
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-wordbook">' +
          '<h2 id="h-wordbook">내 단어장 <span id="dictStarCount"></span></h2>' +
          '<ul class="items" id="dictStars"></ul>' +
          '<div class="row"><button class="btn primary grow" type="button" id="quizStart">뜻 맞히기 퀴즈</button></div>' +
          '<div id="quizBox" hidden style="display:flex;flex-direction:column;gap:8px">' +
            '<p class="muted" id="quizInfo"></p>' +
            '<b class="dict-quizword" id="quizWord"></b>' +
            '<div class="quiz-opts" id="quizOpts"></div>' +
            '<p id="quizResult"></p>' +
            '<div class="row"><button class="btn grow" type="button" id="quizNext">다음 문제</button><button class="btn grow" type="button" id="quizStop">그만</button></div>' +

        '</section>'

      root.appendChild(grid);

      J.$("dictInfo").textContent = "지금 단어 " + (WORDS.length - IDIOMS.length) + "개, 숙어 " + IDIOMS.length + "개가 들어 있어. 단어로 찾으면 그 단어가 들어간 숙어도 같이 나와.";
      drawKind();
      var di = dayIdiom();
      if (di) {
        J.$("dictIdiomToday").textContent = "";
        J.$("dictIdiomToday").appendChild(J.el("span", null, "오늘의 숙어 · " + di.w));
        J.$("dictIdiomToday").appendChild(J.el("b", null, di.m));
        J.$("dictIdiomToday").addEventListener("click", function () { showWord(di, "오늘의 숙어"); });

  function drawKind() {
    var box = J.$("dictKind");

  function doSearch(q, pickFirst) {

    if (!q && !res.length) {
      var li0 = J.el("li");
      li0.appendChild(J.el("p", "empty", "위에 단어를 쳐봐. 한글 뜻으로도 찾을 수 있어."));
      ul.appendChild(li0);

    }
    if (!res.length) {

    res.forEach(function (x) {

  function showWord(x, tag) {

    J.$("dictMean").textContent = x.m;

    J.$("dictStar").textContent = J.data.wordbook[x.w] ? "★ 단어장에서 빼기" : "☆ 단어장에 넣기";
  }

  function starredList() {

  /* ---------- 퀴즈: 단어장 단어(4개 미만이면 전체에서)로 뜻 고르기 ---------- */

  function startQuiz() {

    var base = only === "idiom" ? IDIOMS : only === "word" ? WORDS.filter(function (x) { return x.lv !== "i"; }) : WORDS;
    quiz = { pool: pool.length >= 4 ? pool : base, score: 0, total: 0, fromBook: pool.length >= 4 };
    J.$("quizBox").hidden = false;
    nextQuestion();
  }
  function nextQuestion() {
    if (!quiz) return;
    var q = pick(quiz.pool);
    var opts = [q];
    var guard = 0;
    while (opts.length < 4 && guard++ < 100) {
      var o = pick(q.lv === "i" ? IDIOMS : WORDS);
      if (opts.indexOf(o) < 0 && o.m !== q.m) opts.push(o);
    }
    opts.sort(function () { return Math.random() - 0.5; });
    J.$("quizInfo").textContent = (quiz.fromBook ? "내 단어장" : only === "idiom" ? "숙어" : "전체 단어") + "에서 · 맞힌 개수 " + quiz.score + " / " + quiz.total;
    J.$("quizWord").textContent = q.w;
    J.$("quizResult").textContent = "";
    var box = J.$("quizOpts");
    box.textContent = "";
    opts.forEach(function (o) {
      var b = J.el("button", "btn", o.m);
      b.type = "button";
      b.addEventListener("click", function () {
        if (box.getAttribute("data-done") === "1") return;
        box.setAttribute("data-done", "1");
        quiz.total++;
        if (o === q) { quiz.score++; J.$("quizResult").textContent = "정답! 👍"; b.classList.add("primary"); }
        else { J.$("quizResult").textContent = "아쉬워. 정답: " + q.m; b.classList.add("danger"); }
        J.$("quizInfo").textContent = (quiz.fromBook ? "내 단어장" : only === "idiom" ? "숙어" : "전체 단어") + "에서 · 맞힌 개수 " + quiz.score + " / " + quiz.total;
      });
      box.appendChild(b);
    });
    box.removeAttribute("data-done");
  }

  J.dict = {
    count: function () { return WORDS.length; },
    lookup: function (w) { return INDEX[String(w || "").toLowerCase().trim()] || null; },
    search: search,
    dayWord: dayWord,
    dayIdiom: dayIdiom,
    idiomCount: function () { return IDIOMS.length; },
    speak: speak,
    toggleStar: toggleStar,
    starred: starredList,
    letters: function () {
      var set = {};
      WORDS.forEach(function (x) { var c = x.w[0].toLowerCase(); if (/[a-z]/.test(c)) set[c] = (set[c] || 0) + 1; });
      return Object.keys(set).sort().map(function (c) { return [c, set[c]]; });
    },
    prefixes: function (letter) {
      var set = {};
      WORDS.forEach(function (x) {
        var w = x.w.toLowerCase();
        if (w[0] === letter) { var p = w.slice(0, 2); set[p] = (set[p] || 0) + 1; }
      });
      return Object.keys(set).sort().map(function (p) { return [p, set[p]]; });
    },
    withPrefix: function (p) { return WORDS.filter(function (x) { return x.w.toLowerCase().indexOf(p) === 0; }); },
    open: function (word) {
      J.go("dict");
      var x = INDEX[String(word || "").toLowerCase()];
      if (x) { showWord(x); J.$("dictInput").value = x.w; doSearch(x.w, false); }
      else if (word) { J.$("dictInput").value = word; doSearch(word, true); }
    },
    text: function (x) { return x.w + " (" + posText(x.p) + ") " + x.m; }
  };

      img.onload = function () {
        var max = 1600;
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        var url = c.toDataURL("image/jpeg", 0.75);
        if (url.length > 1500000) url = c.toDataURL("image/jpeg", 0.55);
