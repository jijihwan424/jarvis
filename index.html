<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자비스</title>
<meta name="theme-color" content="#0c131a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* 자비스 v2: 탭으로 나뉜 오프라인 개인 앱. 디자인은 다음에 다듬기로 하고 지금은 깔끔한 기본형 */
:root {
  --bg: #eceff3;
  --panel: #ffffff;
  --panel-2: #f4f6f9;
  --ink: #13202c;
  --muted: #5a6a78;
  --line: #d2d9e0;
  --accent: #0b7a8f;
  --accent-ink: #ffffff;
  --accent-soft: #d8eef2;
  --danger: #b4392f;
  --ok: #2b7a4b;
  --warn: #9a6a00;
  --pomo: #e5484d;
  --pomo-rest: #2f9e5b;
  --changed: #fff4b8;
  --sat: #2563c9;
  --font-body: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --tabbar-h: 64px;
  --radius: 10px;
  --veil: rgba(236, 239, 243, 0.45);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c131a;
    --panel: #131c25;
    --panel-2: #0f1820;
    --ink: #e2ebf1;
    --muted: #8b9bab;
    --line: #25323e;
    --accent: #4cc3d9;
    --accent-ink: #06222a;
    --accent-soft: #14343c;
    --danger: #ef7d73;
    --ok: #6bcb94;
    --warn: #e0b04f;
    --pomo: #ff6369;
    --pomo-rest: #5bd38a;
    --changed: #4a4116;
    --sat: #79a8ff;
    --veil: rgba(12, 19, 26, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c131a;
  --panel: #131c25;
  --panel-2: #0f1820;
  --ink: #e2ebf1;
  --muted: #8b9bab;
  --line: #25323e;
  --accent: #4cc3d9;
  --accent-ink: #06222a;
  --accent-soft: #14343c;
  --danger: #ef7d73;
  --ok: #6bcb94;
  --warn: #e0b04f;
  --pomo: #ff6369;
  --pomo-rest: #5bd38a;
  --changed: #4a4116;
  --sat: #79a8ff;
  --veil: rgba(12, 19, 26, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }

.view {
  max-width: 1100px;
  margin-inline: auto;
  padding-block: 24px 32px;
  padding-inline: clamp(16px, 4vw, 32px);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.view-title { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }

/* 탭바 */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  justify-content: center;
  gap: 4px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  z-index: 10;
}
.tabbar button {
  flex: 1;
  max-width: 160px;
  min-height: 52px;
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
  background: none;
  border: 0;
  border-radius: var(--radius);
  cursor: pointer;
}
.tabbar button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

/* 공통 */
.top {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px 24px;
}
.top h1 { margin: 0; font-size: clamp(22px, 4vw, 30px); font-weight: 600; letter-spacing: -0.01em; }
.top .date { color: var(--muted); margin: 4px 0 0; }
.clock {
  font-family: var(--font-clock, var(--font-mono));
  font-size: clamp(46px, 10vw, 76px);
  font-weight: 500;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
.status-line { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit;
  font-size: 13px;
  font-family: var(--font-mono);
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
}
.chip.warn { color: var(--warn); border-color: var(--warn); font-family: var(--font-body); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  gap: 16px;
  align-items: start;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.panel h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.panel h2 span { font-family: var(--font-mono); font-weight: 400; letter-spacing: 0; }
.panel p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; }

button, input, select, textarea { font-family: inherit; }
.btn {
  font: inherit;
  font-weight: 500;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.small { padding: 4px 10px; font-size: 13px; color: var(--muted); }
.btn.small:hover { color: var(--danger); border-color: var(--danger); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row .btn.grow { flex: 1; }

.field {
  font: inherit;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--ink);
  min-width: 0;
}
.add { display: flex; gap: 8px; }
.add .field { flex: 1; }

/* 대화창 */
.log {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  min-height: 84px;
  max-height: 220px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.msg { max-width: min(85%, 640px); padding: 8px 12px; border-radius: var(--radius); overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.me { align-self: flex-end; background: var(--accent-soft); }
.msg.ai { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); }

/* 목록 */
ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ul.items li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
ul.items li:first-child { border-top: 0; }
.num { font-family: var(--font-mono); color: var(--muted); min-width: 1.6em; flex: none; font-variant-numeric: tabular-nums; }
.item-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.done .item-text { text-decoration: line-through; color: var(--muted); }
.stamp { font-family: var(--font-mono); font-size: 12px; color: var(--muted); flex: none; }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.empty { color: var(--muted); margin: 0; font-size: 14px; }

/* 시간 */
.big-time {
  font-family: var(--font-mono);
  font-size: clamp(44px, 9vw, 60px);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  text-align: center;
  padding: 8px 0;
}
.bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s linear; }
.phase { text-align: center; font-weight: 600; color: var(--pomo); }
.phase.rest { color: var(--pomo-rest); }

/* 뽀모도로 빨간 원 */
.ring-wrap { position: relative; width: min(100%, 260px); aspect-ratio: 1; margin-inline: auto; max-width: 100%; }
.ring { width: 100%; height: 100%; display: block; }
.ring-bg { fill: none; stroke: var(--line); stroke-width: 12; }
.ring-fg {
  fill: none;
  stroke: var(--pomo);
  stroke-width: 12;
  stroke-linecap: round;
  /* 12시 방향에서 시작해 시계 방향으로 줄어들도록 좌우를 뒤집는다 */
  transform: rotate(-90deg) scaleY(-1);
  transform-origin: 100px 100px;
  transition: stroke-dashoffset 0.25s linear;
}
.ring-dot { fill: var(--pomo); stroke: var(--panel); stroke-width: 3; }
.ring-wrap.rest .ring-fg { stroke: var(--pomo-rest); }
.ring-wrap.rest .ring-dot { fill: var(--pomo-rest); }
.ring-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.ring-time {
  font-family: var(--font-mono);
  font-size: clamp(38px, 7vw, 50px);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.finished .big-time { color: var(--ok); }
@media (prefers-reduced-motion: no-preference) {
  .finished { animation: pulse 0.9s ease-in-out 3; }
  @keyframes pulse { 50% { border-color: var(--ok); } }
}
.mini-input { width: 4.5em; font-family: var(--font-mono); padding: 6px 8px; }
.settings { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--muted); font-size: 14px; }
.settings label { display: flex; gap: 6px; align-items: center; }
.laps { max-height: 200px; overflow-y: auto; }
.toggle { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }

/* 계산기 */
.calc { max-width: 520px; width: 100%; margin-inline: auto; }
.calc-screen {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px;
  text-align: right;
  min-height: 92px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 4px;
}
.calc-expr { font-family: var(--font-mono); font-size: 26px; overflow-wrap: anywhere; min-height: 1.3em; }
.calc-prev { font-family: var(--font-mono); font-size: 16px; color: var(--muted); min-height: 1.4em; overflow-wrap: anywhere; }
.calc-prev.err { color: var(--danger); font-family: var(--font-body); }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.keys .btn { font-size: 20px; padding: 14px 0; font-family: var(--font-mono); }
.keys .btn.op { color: var(--accent); }
.keys .btn.wide { grid-column: 1 / -1; }
.keys.sci .btn { font-size: 15px; padding: 10px 0; }
.history li { cursor: pointer; font-family: var(--font-mono); font-size: 14px; }

.textarea { width: 100%; min-height: 90px; font-family: var(--font-mono); font-size: 12px; }
.notice { font-size: 14px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
.notice.ok { border-color: var(--ok); color: var(--ok); }
.notice.err { border-color: var(--danger); color: var(--danger); }
.notice.warn { border-color: var(--warn); color: var(--warn); }

/* 시간표 */
.tt-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
table.tt { border-collapse: collapse; width: 100%; min-width: 560px; table-layout: fixed; }
table.tt th, table.tt td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 8px 6px; text-align: center; vertical-align: middle; }
table.tt tr > *:last-child { border-right: 0; }
table.tt tbody tr:last-child > * { border-bottom: 0; }
table.tt thead th { font-size: 14px; font-weight: 600; color: var(--muted); background: var(--panel-2); }
table.tt thead th.today { color: var(--accent); }
table.tt tbody th { width: 76px; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--panel-2); }
.tt-time { font-family: var(--font-mono); font-size: 12px; font-weight: 400; }
.tt-cell { cursor: pointer; min-height: 56px; }
.tt-cell:hover { background: var(--panel-2); }
.tt-cell.today { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.tt-cell.changed { background: var(--changed); }
.tt-cell.now { outline: 3px solid var(--accent); outline-offset: -3px; }
.tt-s { font-weight: 600; }
.tt-t { font-size: 12px; color: var(--muted); }

/* 홈 수업 안내 */
.class-banner {
  display: flex; flex-direction: column; gap: 2px; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
  border-radius: var(--radius); padding: 12px 16px; font: inherit; color: var(--ink); cursor: pointer; width: 100%;
}
.class-banner b { font-size: 18px; }
.class-banner span { color: var(--muted); font-size: 14px; }
.home-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

/* 꾸미기 */
.block-list li { gap: 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--panel) inset; }

/* 하위 탭 */
.subnav { display: flex; gap: 6px; flex-wrap: wrap; }
.subnav button {
  font: inherit; font-size: 14px; font-weight: 500;
  padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer;
}
.subnav button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tabbar button { font-size: 13px; padding-inline: 2px; }
.tt-cell.holiday { background: var(--panel-2); cursor: default; }

/* 캘린더 */
.cal {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px;
}
.cal-h { text-align: center; font-size: 13px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.cal-h.sun, .cal-d.sun .cal-n { color: var(--danger); }
.cal-h.sat, .cal-d.sat .cal-n { color: var(--sat); }
.cal-d {
  font: inherit; text-align: left; color: var(--ink);
  min-height: 78px; padding: 4px 5px; border-radius: 8px;
  border: 1px solid transparent; background: var(--panel-2); cursor: pointer;
  display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: hidden;
}
.cal-d.other { opacity: 0.45; }
.cal-d.today { border-color: var(--accent); }
.cal-d.sel { background: var(--accent-soft); border-color: var(--accent); }
.cal-top { display: flex; justify-content: space-between; align-items: center; gap: 2px; }
.cal-n { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.cal-mood { font-size: 12px; }
.cal-hol { font-size: 10px; color: var(--danger); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-ev {
  font-size: 11px; line-height: 1.3; padding: 1px 4px; border-radius: 4px;
  background: var(--panel); border-left: 3px solid var(--accent);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cal-ev.dday { border-left-color: var(--pomo); }
.cal-more { font-size: 11px; color: var(--muted); }
@media (max-width: 520px) {
  .cal-d { min-height: 58px; padding: 3px; }
  .cal-ev { font-size: 10px; padding: 0 2px; }
  .cal-hol { display: none; }
}

/* 홈 D-day, 급식, 레벨 */
.mini-row { display: flex; flex-wrap: wrap; gap: 8px; }
.dday-chip {
  display: flex; gap: 8px; align-items: baseline;
  font: inherit; color: var(--ink); cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px;
}
.dday-chip b { font-family: var(--font-mono); color: var(--pomo); }
.meal-box { display: flex; flex-direction: column; gap: 4px; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; width: 100%; }
.meal-box b { font-size: 14px; color: var(--muted); font-weight: 600; }
.meal-box span { overflow-wrap: anywhere; }
.level-box { display: flex; align-items: center; gap: 12px; font: inherit; color: var(--ink); cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 16px; width: 100%; text-align: left; }
.level-box .lv { font-family: var(--font-mono); font-weight: 600; font-size: 18px; color: var(--accent); flex: none; }
.level-box .xpbar { flex: 1; min-width: 60px; }
.level-box .streak { flex: none; color: var(--muted); font-size: 14px; }

/* 일기 */
.moods { display: flex; gap: 6px; flex-wrap: wrap; }
.mood { font-size: 26px; width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel-2); cursor: pointer; padding: 0; }
.mood[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.diary-text { width: 100%; min-height: 200px; resize: vertical; line-height: 1.6; font-size: 16px; }
.diary-pager { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; margin-bottom: 14px; -webkit-overflow-scrolling: touch; }
.diary-pager::-webkit-scrollbar { display: none; }
.diary-page { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; box-sizing: border-box; }
.diary-saved { font-size: 13px; font-weight: 400; color: var(--muted); }
.diary-hint { margin: 0 0 8px; font-size: 13px; }

/* 가계부 */
.sum-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sum { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.sum span { display: block; font-size: 12px; color: var(--muted); }
.sum b { font-family: var(--font-mono); font-size: 16px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sum b.in { color: var(--ok); }
.sum b.out { color: var(--danger); }
.catbar { display: grid; grid-template-columns: 4.5em 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.catbar .track { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.catbar .track i { display: block; height: 100%; background: var(--accent); }
.catbar .amt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.amount { font-family: var(--font-mono); font-variant-numeric: tabular-nums; flex: none; }
.amount.in { color: var(--ok); }
.amount.out { color: var(--danger); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; padding: 8px 14px; border: 0; background: var(--panel-2); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* 성장 */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.badge { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; background: var(--panel-2); display: flex; flex-direction: column; gap: 2px; }
.badge .ic { font-size: 24px; }
.badge b { font-size: 14px; }
.badge span { font-size: 12px; color: var(--muted); }
.badge.locked { opacity: 0.45; filter: grayscale(1); }

/* 알림 토스트 */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); z-index: 20;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px;
  font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 32px); text-align: center;
}

/* 배경 사진, 그라데이션 */
body.has-bg { background-attachment: fixed; background-size: cover; background-position: center; }
.clock.big { font-size: clamp(64px, 15vw, 116px); }
.motto { font-size: 18px; font-weight: 600; text-align: center; padding: 14px 16px; border-radius: var(--radius);
  background: var(--panel); border: 1px dashed var(--accent); white-space: pre-wrap; overflow-wrap: anywhere; }
.look-sec { display: flex; flex-direction: column; gap: 8px; }
.look-sec + .look-sec { border-top: 1px solid var(--line); padding-top: 12px; }
.look-sec h3 { margin: 0; font-size: 14px; }
.opt-row { display: flex; flex-wrap: wrap; gap: 6px; }
.opt-row button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); cursor: pointer; }
.opt-row button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.bg-swatch { width: 52px; height: 36px; border-radius: 8px; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.bg-swatch[aria-pressed="true"] { border-color: var(--ink); }
input[type="color"] { width: 52px; height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--panel-2); }
input[type="range"] { accent-color: var(--accent); }

/* 명언 */
.quote-box {
  display: flex; flex-direction: column; gap: 6px; text-align: center; width: 100%;
  font: inherit; color: var(--ink); cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px;
}
.quote-box span { font-size: 17px; line-height: 1.6; text-wrap: balance; }
.quote-box b { font-size: 13px; font-weight: 500; color: var(--muted); }

/* D-day */
.dd-list { display: flex; flex-direction: column; gap: 8px; }
.dd-card { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-2); min-width: 0; }
.dd-card.pinned { border-color: var(--accent); background: var(--accent-soft); }
.dd-card.past { opacity: 0.6; }
.dd-num { font-family: var(--font-mono); font-size: 22px; color: var(--pomo); min-width: 4.6em; font-variant-numeric: tabular-nums; }
.dd-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dd-title { font-weight: 600; overflow-wrap: anywhere; }

/* 영어사전 */
.dict-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dict-head b { font-size: 30px; font-family: var(--font-mono); overflow-wrap: anywhere; }
.dict-mean { font-size: 17px; line-height: 1.6; overflow-wrap: anywhere; }
.dict-w { font-family: var(--font-mono); min-width: 6.5em; flex: none; overflow-wrap: anywhere; }
.dict-quizword { font-size: 28px; font-family: var(--font-mono); text-align: center; }
.quiz-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.quiz-opts .btn { text-align: left; font-size: 14px; }

/* 명령어 가지치기 */
.ctree { display: flex; flex-direction: column; gap: 6px; }
.ctree-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ctree-crumb { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.ctree-path { font-size: 13px; color: var(--accent); font-weight: 600; overflow-wrap: anywhere; }
.ctree-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 172px; overflow-y: auto; padding: 2px; }
.ctree-chip { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.ctree-chip.branch { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.ctree-chip.input { border-style: dashed; }
.ctree-chip.on { background: var(--accent); color: var(--accent-ink); }
.ctree-toggle { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.ctree.open .ctree-toggle { background: var(--accent); color: var(--accent-ink); }
.ctree-chips[hidden] { display: none; }
#cmdInput.asking { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

/* 명령어 영역: 기록, 입력, 버튼을 한 상자로 */
.chat {
  display: flex; flex-direction: column; gap: 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
}
.chat .log { border: 0; border-radius: 0; background: transparent; padding: 0 0 10px; border-bottom: 1px solid var(--line); min-height: 64px; }
.chat .ctree { border-top: 1px solid var(--line); padding-top: 10px; }
.chat .ctree-chip { background: var(--panel-2); }
.chat .ctree-crumb { background: var(--panel-2); }

/* ===== 스타일 테마 ===== */
/* 노트: 따뜻한 종이 느낌 */
:root[data-style="note"] {
  --bg: #f3ecdf; --panel: #fffaf1; --panel-2: #f7efe1; --ink: #3a2e22; --muted: #7b6a55; --line: #e0d2b8;
  --radius: 14px; --veil: rgba(243, 236, 223, 0.45);
}
:root[data-style="note"][data-theme="dark"] {
  --bg: #1d1914; --panel: #28221b; --panel-2: #221d17; --ink: #efe4d0; --muted: #b3a286; --line: #3d3427;
  --veil: rgba(29, 25, 20, 0.5);
}
:root[data-style="note"] .panel, :root[data-style="note"] .chat, :root[data-style="note"] .quote-box,
:root[data-style="note"] .class-banner { box-shadow: 0 3px 0 var(--line); }
:root[data-style="note"] .quote-box span { letter-spacing: 0.01em; }
:root[data-style="note"] .panel h2 { letter-spacing: 0.02em; }
:root[data-style="note"] body { background-image: repeating-linear-gradient(to bottom, transparent 0 31px, color-mix(in srgb, var(--line) 55%, transparent) 31px 32px); }

/* 자비스 HUD: 어두운 화면, 빛나는 선, 각진 모서리 */
:root[data-style="hud"] {
  --bg: #050b12; --panel: rgba(10, 24, 36, 0.86); --panel-2: rgba(14, 33, 48, 0.9); --ink: #d8f6ff; --muted: #7fb0c2;
  --line: rgba(76, 205, 235, 0.35); --radius: 3px; --veil: rgba(5, 11, 18, 0.55);
  color-scheme: dark;
}
:root[data-style="hud"] body {
  background-image:
    linear-gradient(rgba(76, 205, 235, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(76, 205, 235, 0.05) 1px, transparent 1px),
    radial-gradient(circle at 50% 0%, rgba(40, 140, 180, 0.25), transparent 60%);
  background-size: 32px 32px, 32px 32px, 100% 100%;
}
:root[data-style="hud"] .panel, :root[data-style="hud"] .chat, :root[data-style="hud"] .quote-box,
:root[data-style="hud"] .class-banner, :root[data-style="hud"] .meal-box, :root[data-style="hud"] .level-box {
  box-shadow: 0 0 0 1px rgba(76, 205, 235, 0.15), 0 0 18px rgba(76, 205, 235, 0.12), inset 0 0 24px rgba(76, 205, 235, 0.05);
}
:root[data-style="hud"] .clock, :root[data-style="hud"] .ring-time, :root[data-style="hud"] .big-time {
  text-shadow: 0 0 12px color-mix(in srgb, var(--accent) 70%, transparent);
}
:root[data-style="hud"] .panel h2, :root[data-style="hud"] .view-title, :root[data-style="hud"] .top h1 {
  font-family: var(--font-mono); letter-spacing: 0.08em;
}
:root[data-style="hud"] .tabbar { background: rgba(5, 14, 22, 0.92); border-top-color: var(--line); backdrop-filter: blur(6px); }
:root[data-style="hud"] .btn, :root[data-style="hud"] .ctree-chip { box-shadow: 0 0 8px rgba(76, 205, 235, 0.08); }

/* 공부 집중모드 */
.focus {
  position: fixed; inset: 0; z-index: 50;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto; text-align: center;
}
body.focus-on .tabbar, body.focus-on .toast { display: none; }
.focus-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; color: var(--muted); font-size: 14px; }
.focus-badge { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 4px 12px; font-weight: 600; }
.focus-clock { font-family: var(--font-clock, var(--font-mono)); font-size: clamp(64px, 16vw, 150px); line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.focus-ring-wrap { position: relative; width: min(78vw, 320px); aspect-ratio: 1; }
.focus-ring-wrap svg { width: 100%; height: 100%; display: block; }
.fr-bg { fill: none; stroke: var(--line); stroke-width: 10; }
.fr-fg { fill: none; stroke: var(--pomo); stroke-width: 10; stroke-linecap: round; transform: rotate(-90deg) scaleY(-1); transform-origin: 130px 130px; transition: stroke-dashoffset 0.5s linear; }
.focus-ring-wrap.rest .fr-fg { stroke: var(--pomo-rest); }
.focus-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.focus-phase { color: var(--muted); font-weight: 600; }
.focus-time { font-family: var(--font-mono); font-size: clamp(42px, 10vw, 64px); font-variant-numeric: tabular-nums; }
.focus-pick, .focus-ctl { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px; }
.focus-note { color: var(--muted); font-size: 14px; max-width: 520px; min-height: 1.4em; margin: 0; }
.focus-exit { color: var(--muted); }

/* 그래프 */
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; overflow: visible; touch-action: pan-y; }
.g-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.g-base { stroke: var(--muted); stroke-width: 1; opacity: 0.6; }
.g-label { fill: var(--muted); font-size: 11px; font-family: var(--font-mono); }
.g-value { fill: var(--ink); font-size: 12px; font-weight: 600; }
.g-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.g-dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.g-dot-end { fill: var(--accent); stroke: var(--panel); stroke-width: 3; }
.g-cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.g-tip { position: absolute; top: 0; width: 150px; text-align: center; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--ink); color: var(--bg); pointer-events: none; }
.g-table summary { cursor: pointer; color: var(--muted); font-size: 14px; }

/* ===== 홈 배치 ===== */
/* 대시보드: 왼쪽 위젯, 오른쪽 명령창 */
.home-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.home-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.layout-dash .chat .log { max-height: 340px; }
/* 시계 중심 */
.layout-center { max-width: 760px; text-align: center; }
.layout-center .top { flex-direction: column-reverse; align-items: center; gap: 8px; }
.layout-center .top .date { justify-content: center; }
.layout-center .clock { font-size: clamp(72px, 18vw, 150px); }
.layout-center .clock.big { font-size: clamp(88px, 22vw, 180px); }
.layout-center .class-banner { text-align: center; align-items: center; border-left-width: 1px; }
.layout-center .chat { text-align: left; }
/* 타일 */
.home-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; align-items: stretch; }
.home-tiles:empty { display: none; }
.home-tiles > * { height: 100%; min-height: 96px; }
.home-tiles .class-banner, .home-tiles .quote-box, .home-tiles .meal-box { justify-content: center; }
.layout-tiles .clock { font-size: clamp(56px, 12vw, 96px); }
/* 시네마: 풍경을 비워두고 아래쪽에 자막처럼 */
.layout-cinema { min-height: calc(100vh - var(--tabbar-h) - 8px); min-height: calc(100dvh - var(--tabbar-h) - 8px); max-width: 1200px; }
.cine-top .top { align-items: flex-start; }
.layout-cinema .clock { font-size: clamp(64px, 13vw, 128px); font-weight: 300; letter-spacing: 0.02em; }
.cine-gap { flex: 1; min-height: 18vh; }
.cine-strip { display: flex; flex-direction: column; gap: 12px; }
.cine-row { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.cine-row::-webkit-scrollbar { display: none; }
.cine-row > * { flex: 1 0 240px; }
.cine-row:empty { display: none; }
.layout-cinema .chat .log { max-height: 120px; }
/* 코너 HUD: 네 귀퉁이 */
.layout-corner { max-width: none; min-height: calc(100vh - var(--tabbar-h) - 8px); min-height: calc(100dvh - var(--tabbar-h) - 8px); }
.corner-grid { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto 1fr auto; grid-template-areas: "tl tr" "mid mid" "bl br"; gap: 16px; }
.c-tl { grid-area: tl; } .c-tr { grid-area: tr; } .c-mid { grid-area: mid; min-height: 12vh; } .c-bl { grid-area: bl; align-self: end; } .c-br { grid-area: br; align-self: end; }
.c-tl, .c-tr, .c-bl, .c-br { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.c-tr { align-items: stretch; max-width: 440px; justify-self: end; width: 100%; }
.c-bl { max-width: 460px; }
.layout-corner .top { flex-direction: column; align-items: flex-start; gap: 4px; }
.layout-corner .clock { font-size: clamp(54px, 9vw, 104px); order: -1; }
.layout-corner .chat .log { max-height: 160px; }
/* 반반: 왼쪽 큰 시계 */
.layout-split { max-width: none; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.split-l { position: sticky; top: 0; min-height: calc(100vh - var(--tabbar-h) - 56px); display: flex; flex-direction: column; justify-content: center; }
.split-l .top { flex-direction: column-reverse; align-items: flex-start; gap: 10px; }
.layout-split .clock { font-size: clamp(64px, 9vw, 150px); line-height: 0.95; }
.split-r { display: flex; flex-direction: column; gap: 14px; min-width: 0; padding-top: 8px; }
/* 매거진 */
.mag-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 28px; align-items: end; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.mag-head { display: flex; align-items: flex-end; gap: 14px; }
.mag-day { font-family: var(--font-clock, var(--font-body)); font-size: clamp(110px, 20vw, 220px); line-height: 0.8; letter-spacing: -0.04em; color: var(--accent); font-weight: 700; }
.mag-side { display: flex; flex-direction: column; gap: 2px; padding-bottom: 6px; }
.mag-dow { font-size: clamp(20px, 3vw, 30px); font-weight: 800; letter-spacing: 0.12em; }
.mag-mon { font-size: 13px; letter-spacing: 0.3em; color: var(--muted); }
.mag-issue { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); margin-top: 6px; }
.mag-right { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mag-right .top { flex-direction: column-reverse; align-items: flex-end; text-align: right; gap: 2px; }
.layout-magazine .clock { font-size: clamp(40px, 6vw, 64px); }
.mag-quote .quote-box { background: none; border: 0; border-left: 6px solid var(--accent); border-radius: 0; padding: 6px 0 6px 18px; text-align: left; align-items: flex-start; box-shadow: none; }
.mag-quote .quote-box span { font-size: clamp(20px, 3.2vw, 30px); line-height: 1.35; font-weight: 600; }
/* 대화 중심 */
.cf-top .top { align-items: center; }
.layout-chatfirst .clock { font-size: clamp(30px, 5vw, 44px); }
.layout-chatfirst .chat .log { min-height: 34vh; max-height: 52vh; }
@media (max-width: 760px) {
  .home-cols, .split, .corner-grid, .mag-hero { grid-template-columns: minmax(0, 1fr); }
  .corner-grid { grid-template-areas: "tl" "tr" "mid" "bl" "br"; grid-template-rows: auto auto 1fr auto auto; }
  .c-tr { max-width: none; }
  .split-l { position: static; min-height: 0; }
  .mag-right .top { align-items: flex-start; text-align: left; }
}

/* 배치 고르기 */
.layout-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.layout-pick { font: inherit; text-align: left; cursor: pointer; padding: 10px; display: flex; flex-direction: column; gap: 4px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--panel-2); color: var(--ink); }
.layout-pick[aria-pressed="true"] { border-color: var(--accent); }
.layout-pick .lp svg { width: 100%; height: 64px; display: block; }
.layout-pick .muted { font-size: 12px; line-height: 1.35; }
.lp-box { fill: var(--muted); opacity: 0.35; }
.lp-clock { fill: var(--accent); opacity: 0.85; }
.lp-chat { fill: none; stroke: var(--accent); stroke-width: 2; }

/* 테마 고르기 */
.preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.preset {
  font: inherit; text-align: left; cursor: pointer; padding: 0; overflow: hidden;
  border: 2px solid var(--line); border-radius: var(--radius); background: var(--panel-2); color: var(--ink);
  display: flex; flex-direction: column;
}
.preset[aria-pressed="true"] { border-color: var(--accent); }
.preset .pv { height: 70px; display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px; }
.preset .pv i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.7); }
.preset b { padding: 6px 10px 0; font-size: 14px; }
.preset span { padding: 0 10px 8px; font-size: 12px; color: var(--muted); }

/* ===== 풍경 테마 ===== */
.scene { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: var(--bg); }
.scene-art, .scene-art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
:root[data-scene] body { background: var(--bg); }
.scene .tw { animation: tw 4s ease-in-out infinite alternate; }
@keyframes tw { from { opacity: 0.15; } to { opacity: 1; } }
.scene .shim, .scene .glit { animation: shim 3.2s ease-in-out infinite alternate; }
@keyframes shim { 0% { opacity: 0.35; } 100% { opacity: 1; } }
.scene .foam { animation: foam 6s ease-in-out infinite alternate; }
@keyframes foam { from { transform: translateY(0); } to { transform: translateY(8px); } }
.scene .blink { animation: blink 1.6s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0.1; } }
.scene .neon { animation: neon 7s linear infinite; }
@keyframes neon { 0%, 92%, 100% { opacity: 1; } 93% { opacity: 0.55; } 94% { opacity: 1; } 96% { opacity: 0.7; } }
.scene .glitch { animation: glitch 5s steps(1) infinite; }
@keyframes glitch { 0%, 100% { transform: none; } 20% { transform: translateX(18px); } 22% { transform: translateX(-10px); } 24% { transform: none; } 70% { transform: translateX(-24px); } 71% { transform: none; } }
.fx { position: absolute; inset: 0; pointer-events: none; }
.fx-shoot::before { content: ""; position: absolute; top: 12%; left: 70%; width: 160px; height: 2px; background: linear-gradient(90deg, rgba(255,255,255,0.95), transparent); transform: rotate(-35deg); opacity: 0; animation: shoot 11s ease-out infinite 3s; }
@keyframes shoot { 0% { opacity: 0; translate: 0 0; } 2% { opacity: 1; } 8% { opacity: 0; translate: -420px 300px; } 100% { opacity: 0; translate: -420px 300px; } }
.fx-halftone { background-image: radial-gradient(rgba(255,255,255,0.13) 1.1px, transparent 1.7px); background-size: 7px 7px; -webkit-mask-image: linear-gradient(160deg, #000 0%, transparent 55%, #000 100%); mask-image: linear-gradient(160deg, #000 0%, transparent 55%, #000 100%); }
.fx-halftone::after { content: ""; position: absolute; right: -40px; top: -40px; width: 360px; height: 360px; background-image: radial-gradient(#ff3fa4 3.5px, transparent 4.2px); background-size: 16px 16px; -webkit-mask-image: radial-gradient(circle at 70% 30%, #000, transparent 70%); mask-image: radial-gradient(circle at 70% 30%, #000, transparent 70%); opacity: 0.55; }
.fx-rain { inset: -100% 0 0 0; background-image: repeating-linear-gradient(100deg, transparent 0 22px, rgba(170,220,255,0.14) 22px 23px, transparent 23px 61px); background-size: 140px 100%; animation: rain 0.7s linear infinite; }
@keyframes rain { to { transform: translateY(50%); } }
.fx-scan { background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px); box-shadow: inset 0 0 180px rgba(0,0,0,0.75); }
@media (prefers-reduced-motion: reduce) { .scene *, .scene .fx, .scene .fx::before, .scene .fx::after { animation: none !important; } }

/* 유리 느낌 카드 (풍경 테마 공통) */
:root[data-glass] .panel, :root[data-glass] .chat, :root[data-glass] .quote-box, :root[data-glass] .class-banner,
:root[data-glass] .meal-box, :root[data-glass] .level-box, :root[data-glass] .motto, :root[data-glass] .tabbar {
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
}
:root[data-glass] .panel, :root[data-glass] .chat, :root[data-glass] .quote-box, :root[data-glass] .class-banner { box-shadow: 0 10px 40px rgba(0,0,0,0.18); }

/* ===== 수식 계산기 (eval을 쓰지 않는 안전한 파서) =====
   지원: + - × ÷ ^ % ! ( ) , 함수 sin cos tan asin acos atan sqrt(√) log ln abs, 상수 π e
   2π, 3(1+2), (1+2)(3+4) 처럼 곱하기 기호를 생략해도 된다. */

  var MON_EN = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
  var DOW_EN = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
  function renderMag() {
    if (!blockEls._mag || !J.$("magDay")) return;
    var d = new Date();
    J.$("magDay").textContent = (d.getDate() < 10 ? "0" : "") + d.getDate();
    J.$("magDow").textContent = DOW_EN[d.getDay()];
    J.$("magMon").textContent = MON_EN[d.getMonth()] + " " + d.getFullYear();
    var start = new Date(d.getFullYear(), 0, 1);
    J.$("magIssue").textContent = "ISSUE No." + (Math.floor((d - start) / 86400000) + 1) + " · " + (J.data.home.name || "") + " 에디션";

  J.onTick(function () { if (J.data.home.layout === "magazine") renderMag(); });

  J.renderMotto = function () {
    var el = blockEls.motto;
    if (!el) return;
    var t = (J.data.home.motto || "").trim();
    el.textContent = t;
    el.hidden = !t || J.data.home.hidden.indexOf("motto") >= 0;
  };

  /* ---------- 오늘 급식, D-day, 레벨 ---------- */
  function hiddenByUser(id) { return J.data.home.hidden.indexOf(id) >= 0; }
  function renderMeal(force) {
    var el = blockEls.meal;
    if (!el || !J.meal) return;
    var now = new Date();
    // 오후 2시가 넘으면 내일 급식을 보여준다
    var d = now.getHours() >= 14 ? JX.addDays(now, 1) : now;
    var menu = J.meal.menu(JX.key(d));
    var key = JX.key(d) + "|" + (menu ? menu.join(",") : "");
    if (!force && el.getAttribute("data-key") === key) return;
    el.setAttribute("data-key", key);
    el.hidden = hiddenByUser("meal") || !menu;
    if (!menu) return;
    J.$("mealBoxTitle").textContent = (JX.key(d) === JX.key(now) ? "오늘" : "내일") + " 급식";
    J.$("mealBoxText").textContent = menu.join(" · ");
  }
  function renderDday() {
    var el = blockEls.dday;
    if (!el || !J.cal) return;
    var list = J.cal.ddays().slice(0, 4);
    el.textContent = "";
    el.hidden = hiddenByUser("dday") || !list.length;
    list.forEach(function (e) {
      var b = J.el("button", "dday-chip");
      b.type = "button";
      b.appendChild(J.el("b", null, J.cal.ddayLabel(e.date)));
      b.appendChild(J.el("span", null, e.title));
      b.addEventListener("click", function () { J.cal.open(e.date); });
      el.appendChild(b);
    });
  }
  function renderLevel() {
    var el = blockEls.level;
    if (!el || !J.game) return;
    el.hidden = hiddenByUser("level");
    var s = J.game.summary();
    J.$("levelLv").textContent = "Lv." + s.level;
    J.$("levelBar").style.width = (s.into / s.need) * 100 + "%";
    J.$("levelStreak").textContent = s.streak ? "🔥 " + s.streak + "일 연속" : "오늘 첫 활동을 해봐";
  }

  // 기록 > 할 일·메모 화면이 부른다
  J.mountTodoMemo = function (root) {
    var grid = J.el("div", "grid");
    grid.appendChild(J.html(
      '<section class="panel" aria-labelledby="h-todo">' +
        '<h2 id="h-todo">할 일 <span id="todoCount"></span></h2>' +
        '<form class="add" id="todoForm" autocomplete="off">' +
          '<input class="field" id="todoInput" type="text" placeholder="할 일 추가" aria-label="할 일 내용">' +
          '<button class="btn" type="submit">추가</button>' +
        '</form>' +
        '<ul class="items" id="todoList"></ul>' +
        '<div class="row"><button class="btn small" type="button" id="todoClearDone">완료한 것 지우기</button></div>' +
      '</section>'
    ));
    grid.appendChild(J.html(
      '<section class="panel" aria-labelledby="h-memo">' +
        '<h2 id="h-memo">메모 <span id="memoCount"></span></h2>' +
        '<form class="add" id="memoForm" autocomplete="off">' +
          '<input class="field" id="memoInput" type="text" placeholder="메모 남기기" aria-label="메모 내용">' +
          '<button class="btn" type="submit">저장</button>' +
        '</form>' +
        '<ul class="items" id="memoList"></ul>' +
      '</section>'
    ));
    root.appendChild(grid);
    wireTodos();
    wireMemos();
    J.$("todoClearDone").addEventListener("click", function () {
      var n = J.data.todos.filter(function (t) { return t.done; }).length;
      J.data.todos = J.data.todos.filter(function (t) { return !t.done; });
      J.save();
      renderTodos();
      J.say(n ? "완료한 할 일 " + n + "개를 지웠어." : "지울 완료한 할 일이 없어.");
    });
  };
  J.clearDoneTodos = function () {
    var n = J.data.todos.filter(function (t) { return t.done; }).length;
    J.data.todos = J.data.todos.filter(function (t) { return !t.done; });
    J.save();
    renderTodos();
    return n;
  };

  /* ---------- 명언, 대표 D-day ---------- */
  function renderQuote() {
    if (!J.quote || !J.$("quoteText")) return;
    var q = J.quote.current();
    J.$("quoteText").textContent = "“" + q[0] + "”";
    J.$("quoteBy").textContent = q[1] ? "— " + q[1] : "";
  }
  J.renderQuote = renderQuote;
  function renderGreetDday() {
    var b = J.$("greetDday");
    if (!b) return;
    var e = J.dday && J.dday.pinned();
    if (!e || J.data.home.greetDday === false) { b.hidden = true; return; }
    b.hidden = false;
    b.textContent = e.title + " " + J.dday.label(e);
  }
  J.renderGreetDday = renderGreetDday;

  /* ---------- 수업 안내 ---------- */
  function renderClass(force) {
    var el = blockEls["class"];
    if (!el || !J.tt) return;
    var lines = J.tt.banner();
    var userHidden = J.data.home.hidden.indexOf("class") >= 0;
    el.hidden = userHidden || !lines;
    if (!lines) return;
    var key = lines.join("|");
    if (!force && el.getAttribute("data-key") === key) return;
    el.setAttribute("data-key", key);
    J.$("classLine1").textContent = lines[0];
    J.$("classLine2").textContent = lines[1];
    J.$("classLine2").hidden = !lines[1];
  }

  /* ---------- 시계와 인사 ---------- */
  function tickClock() {
    var now = new Date();
    var hh = J.data.home;
    var H = now.getHours();
    var ct = hh.clock24 ? J.pad2(H) : (H < 12 ? "오전 " : "오후 ") + ((H % 12) || 12);
    ct += ":" + J.pad2(now.getMinutes()) + (hh.clockSec ? ":" + J.pad2(now.getSeconds()) : "");
    J.$("clock").textContent = ct;
    J.$("date").textContent = now.getFullYear() + "년 " + (now.getMonth() + 1) + "월 " + now.getDate() + "일 " + DAYS[now.getDay()] + "요일";
    var h = now.getHours();
    var name = J.data.home && J.data.home.name ? ", " + J.data.home.name : "";
    J.$("greeting").textContent = (h < 6 ? "늦은 밤이야" : h < 12 ? "좋은 아침이야" : h < 18 ? "좋은 오후야" : "좋은 저녁이야") + name;
  }

  /* ---------- 상태 줄: 돌고 있는 타이머, 백업 알림 ---------- */
  function renderStatus() {
    var line = J.$("statusLine");
    if (!line) return;
    var parts = [];
    if (J.timer && J.timer.status()) parts.push(J.timer.status());
    if (J.pomo && J.pomo.status()) parts.push(J.pomo.status());
    if (J.sw && J.sw.status()) parts.push(J.sw.status());
    var key = parts.join("|") + "|" + backupHint();
    if (line.getAttribute("data-key") === key) return;
    line.setAttribute("data-key", key);
    line.textContent = "";
    parts.forEach(function (p) {
      var b = J.el("button", "chip", p);
      b.type = "button";
      b.addEventListener("click", function () { J.go("time"); });
      line.appendChild(b);
    });
    var hint = backupHint();
    if (hint) {
      var w = J.el("button", "chip warn", hint);
      w.type = "button";
      w.addEventListener("click", function () { J.go("more"); });
      line.appendChild(w);
    }
  }
  function backupHint() {
    var hasData = J.data.todos.length + J.data.memos.length > 0;
    if (!hasData) return "";
    if (!J.data.lastBackup) return "아직 백업을 안 했어 → 더보기";
    var days = Math.floor((Date.now() - J.data.lastBackup) / 86400000);
    return days >= 7 ? "백업한 지 " + days + "일 지났어 → 더보기" : "";
  }

  /* ---------- 대화창 ---------- */
  function wireChat() {
    var logEl = J.$("log");
    function addMsg(kind, text) {
      var d = J.el("div", "msg " + kind, text);
      logEl.appendChild(d);
      while (logEl.children.length > 40) logEl.removeChild(logEl.firstChild);
      logEl.scrollTop = logEl.scrollHeight;
    }
    J._say = function (msg) { addMsg("ai", msg); };
    J._echo = function (msg) { addMsg("me", msg); };
    J.$("cmdForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var line = J.$("cmdInput").value.trim();
      J.$("cmdInput").value = "";
      if (!line) return;
      addMsg("me", line);
      J.audio.ensure();
      if (J.cmdTreeTakeInput && J.cmdTreeTakeInput(line)) return;
      if (!J.understand(line) && !J.run(line)) {
        J.say("그건 아직 못 알아들어. 이렇게 말해볼래?\n예) 10분 뒤에 알려줘 · 숙제 할일에 넣어줘 · 2번 다 했어 · 준비물 메모해줘 · 3 더하기 5");
      }
    });
  }

  J.command("도움", function () {
    J.say(
      "쓸 수 있는 명령이야.\n" +
      "할일 추가 <내용> · 할일 보기 · 할일 완료 <번호>\n" +
      "메모 <내용> · 메모 보기\n" +
      "타이머 <분> · 스톱워치 시작/멈춤 · 뽀모도로 시작/멈춤\n" +
      "계산 <식>  예) 계산 3*(2+5)"
    );
  });

  /* ---------- 할 일 ---------- */
  function emptyItem(text) {
    var li = J.el("li");
    li.appendChild(J.el("p", "empty", text));
    return li;
  }
  function renderTodos() {
    var ul = J.$("todoList");
    if (!ul) return;
    ul.textContent = "";
    var todos = J.data.todos;
    var left = todos.filter(function (t) { return !t.done; }).length;
    J.$("todoCount").textContent = todos.length ? "남은 " + left + " / 전체 " + todos.length : "";
    if (!todos.length) { ul.appendChild(emptyItem("할 일이 없어. 위에 입력해서 추가해봐.")); return; }
    todos.forEach(function (t, i) {
      var li = J.el("li", t.done ? "done" : "");
      li.appendChild(J.el("span", "num", (i + 1) + "."));
      var cb = J.el("input");
      cb.type = "checkbox";
      cb.checked = !!t.done;
      cb.setAttribute("aria-label", t.text + " 완료 표시");
      cb.addEventListener("change", function () {
        if (cb.checked) J.markTodoDone(t);
        else { t.done = false; J.save(); renderTodos(); }
      });
      li.appendChild(cb);
      li.appendChild(J.el("span", "item-text", t.text));
      var del = J.el("button", "btn small", "삭제");
      del.type = "button";
      del.addEventListener("click", function () {
        J.data.todos = J.data.todos.filter(function (x) { return x.id !== t.id; });
        J.save();
        renderTodos();
      });
      li.appendChild(del);
      ul.appendChild(li);
    });
  }
  J.addTodo = function (t) { return addTodo(t); };
  function addTodo(text) {
    text = String(text || "").trim();
    if (!text) return false;
    J.data.todos.push({ id: J.nextId(), text: text, done: false });
    J.save();
    renderTodos();
    return true;
  }
  function wireTodos() {
    J.$("todoForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = J.$("todoInput").value;
      if (addTodo(v)) { J.say("할 일에 추가했어 → " + v.trim()); J.$("todoInput").value = ""; }
    });
    renderTodos();
  }
  J.renderTodos = renderTodos;
  // 할 일 완료는 모두 여기를 거친다 (경험치는 할 일마다 한 번만)
  J.markTodoDone = function (t) {
    if (!t) return;
    t.done = true;
    var first = !t.xp;
    t.xp = true;
    J.save();
    renderTodos();
    if (first) J.emit("todo_done", t);
  };

  J.command("할일 추가", function (arg) {
    if (!arg) { J.say("내용을 같이 적어줘. 예) 할일 추가 책 반납"); return; }
    addTodo(arg);
    J.say("할 일에 추가했어 → " + arg);
  });
  J.command("할일 보기", function () {
    var left = J.data.todos.filter(function (t) { return !t.done; }).length;
    J.say(J.data.todos.length ? "남은 할 일이 " + left + "개야. 아래 목록을 봐." : "할 일이 하나도 없어.");
  });
  J.command("할일 완료", function (arg) {
    var n = parseInt(arg, 10);
    if (!/^\d+$/.test(arg) || n < 1 || n > J.data.todos.length) { J.say("번호를 정확히 알려줘. 예) 할일 완료 1"); return; }
    J.markTodoDone(J.data.todos[n - 1]);
    J.say("완료 처리했어 → " + J.data.todos[n - 1].text);
  });

  /* ---------- 메모 ---------- */
  function stamp() {
    var n = new Date();
    return J.pad2(n.getMonth() + 1) + "/" + J.pad2(n.getDate()) + " " + J.pad2(n.getHours()) + ":" + J.pad2(n.getMinutes());
  }
  function renderMemos() {
    var ul = J.$("memoList");
    if (!ul) return;
    ul.textContent = "";
    var memos = J.data.memos;
    J.$("memoCount").textContent = memos.length ? memos.length + "개" : "";
    if (!memos.length) { ul.appendChild(emptyItem("저장된 메모가 없어.")); return; }
    memos.slice().reverse().forEach(function (memo) {
      var li = J.el("li");
      li.appendChild(J.el("span", "stamp", memo.time));
      li.appendChild(J.el("span", "item-text", memo.text));
      var del = J.el("button", "btn small", "삭제");
      del.type = "button";
      del.addEventListener("click", function () {
        J.data.memos = J.data.memos.filter(function (x) { return x.id !== memo.id; });
        J.save();
        renderMemos();
      });
      li.appendChild(del);
      ul.appendChild(li);
    });
  }
  J.addMemo = function (t) { return addMemo(t); };
  function addMemo(text) {
    text = String(text || "").trim();
    if (!text) return false;
    J.data.memos.push({ id: J.nextId(), time: stamp(), text: text });
    J.save();
    renderMemos();
    return true;
  }
  function wireMemos() {
    J.$("memoForm").addEventListener("submit", function (e) {
      e.preventDefault();
      if (addMemo(J.$("memoInput").value)) { J.say("메모해뒀어."); J.$("memoInput").value = ""; }
    });
    renderMemos();
  }
  J.renderMemos = renderMemos;

  J.command("메모 보기", function () {
    J.say(J.data.memos.length ? "메모가 " + J.data.memos.length + "개 있어. 아래 목록을 봐." : "저장된 메모가 없어.");
  });
  J.command("메모", function (arg) {
    if (!arg) { J.say("메모할 내용을 적어줘. 예) 메모 내일 준비물 확인"); return; }
    addMemo(arg);
    J.say("메모해뒀어.");
  });
})();

/* ===== 시간표 탭 ===== */
(function () {
  var J = window.J;
  var DN = ["일", "월", "화", "수", "목", "금", "토"];
  if (!J.data.timetable) { J.data.timetable = JTT.defaultTT(); J.save(); }
  var tt = function () { return J.data.timetable; };
  var weekOffset = 0;
  var sel = null; // { dow, p, date }

  function monday(offset) {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    var dow = d.getDay();
    // 주말이면 다음 주를 '이번 주'로 보여준다
    var diff = dow === 0 ? 1 : dow === 6 ? 2 : 1 - dow;
    d.setDate(d.getDate() + diff + offset * 7);
    return d;
  }

  J.tab({
    id: "tt",
    group: "school",
    groupLabel: "학교",
    label: "시간표",

          '<button class="btn small" type="button" id="ttThis">이번 주</button>' +
          '<button class="btn small" type="button" id="ttNext" aria-label="다음 주">▶</button></div>' +
        '</div>'
      ));
      root.appendChild(J.el("p", "muted", "")).id = "ttWeek";
      var scroller = J.el("div", "tt-scroll");
      scroller.appendChild(J.el("table", "tt")).id = "ttTable";
      root.appendChild(scroller);
      root.appendChild(J.el("p", "muted", "칸을 누르면 그 수업을 고칠 수 있어. 노란 칸은 그날만 바뀐 수업이야."));

      var grid = J.el("div", "grid");
      grid.appendChild(J.html(
        '<section class="panel" id="ttEdit" aria-labelledby="h-ttedit" hidden>' +
          '<h2 id="h-ttedit">수업 고치기 <span id="ttEditWhere"></span></h2>' +
          '<label class="muted" for="ttS">과목</label><input class="field" id="ttS" type="text" autocomplete="off">' +
          '<label class="muted" for="ttT">선생님</label><input class="field" id="ttT" type="text" autocomplete="off">' +
          '<label class="muted" for="ttR">장소</label><input class="field" id="ttR" type="text" autocomplete="off" placeholder="교실이면 비워둬">' +
          '<div class="row">' +
            '<button class="btn primary grow" type="button" id="ttSaveDay">이 날만 바꾸기</button>' +
            '<button class="btn grow" type="button" id="ttSaveBase">정식 시간표로 저장</button>' +
          '</div>' +
          '<div class="row">' +
            '<button class="btn grow" type="button" id="ttUndoDay" hidden>이 날 변경 취소</button>' +
            '<button class="btn grow" type="button" id="ttEmptyDay">이 날 수업 없음</button>' +
            '<button class="btn grow" type="button" id="ttCancel">닫기</button>' +
          '</div>' +
          '<div id="ttEditNote"></div>' +
        '</section>'
      ));
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-ttchg">' +
          '<h2 id="h-ttchg">바뀐 시간표 <span id="ttChgCount"></span></h2>' +
          '<ul class="items" id="ttChgList"></ul>' +
        '</section>'
      ));
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-ttset">' +
          '<h2 id="h-ttset">시간 설정</h2>' +
          '<label class="toggle"><input type="checkbox" id="ttShowT"> 선생님 이름 보이기</label>' +
          '<div class="settings"><label>수업 시간 <input class="field mini-input" id="ttMin" type="number" min="20" max="120">분</label>' +
          '<label>교시 수 <input class="field mini-input" id="ttCount" type="number" min="4" max="10">개</label></div>' +
          '<div class="settings" id="ttStarts"></div>' +
          '<div class="row"><button class="btn small" type="button" id="ttResetAll">처음 시간표로 되돌리기</button></div>' +
          '<div id="ttSetNote"></div>' +
        '</section>'
      ));
      root.appendChild(grid);

      J.$("ttPrev").addEventListener("click", function () { weekOffset--; closeEdit(); draw(); });
      J.$("ttNext").addEventListener("click", function () { weekOffset++; closeEdit(); draw(); });
      J.$("ttThis").addEventListener("click", function () { weekOffset = 0; closeEdit(); draw(); });
      J.$("ttSaveDay").addEventListener("click", saveDay);
      J.$("ttSaveBase").addEventListener("click", saveBase);
      J.$("ttUndoDay").addEventListener("click", undoDay);
      J.$("ttEmptyDay").addEventListener("click", emptyDay);
      J.$("ttCancel").addEventListener("click", closeEdit);
      wireSettings();
      draw();
      J.onTick(function () { if (J.current === "tt") markNow(); });
    }
  });

  /* ---------- 표 그리기 ---------- */
  function draw() {
    var t = tt();
    var mon = monday(weekOffset);
    var fri = new Date(mon); fri.setDate(mon.getDate() + 4);
    J.$("ttWeek").textContent = (mon.getMonth() + 1) + "월 " + mon.getDate() + "일 ~ " + (fri.getMonth() + 1) + "월 " + fri.getDate() + "일" + (weekOffset === 0 ? " (이번 주)" : "");
    var table = J.$("ttTable");
    table.textContent = "";
    var thead = J.el("thead");
    var hr = J.el("tr");
    hr.appendChild(J.el("th", null, "교시"));
    var days = [];
    var todayKey = J.dateKey();
    for (var d = 0; d < 5; d++) {
      var date = new Date(mon); date.setDate(mon.getDate() + d);
      days.push({ date: date, list: JTT.dayClasses(t, date) });
      var hol = JX.holiday(date);
      var th = J.el("th", JTT.dateKey(date) === todayKey ? "today" : null, DN[date.getDay()] + " " + date.getDate());
      if (hol) { th.appendChild(J.el("div", "tt-t", hol.replace(/^대체공휴일.*/, "대체공휴일"))); }
      hr.appendChild(th);
    }
    thead.appendChild(hr);
    table.appendChild(thead);
    var tb = J.el("tbody");
    for (var i = 0; i < t.starts.length; i++) {
      var tr = J.el("tr");
      var ph = J.el("th");
      ph.appendChild(J.el("div", null, (i + 1) + "교시"));
      ph.appendChild(J.el("div", "tt-time", t.starts[i] || ""));
      tr.appendChild(ph);
      days.forEach(function (day) {
        var slot = day.list[i];
        var p = i + 1;
        var td = J.el("td");
        var key = JTT.dateKey(day.date);
        td.setAttribute("data-date", key);
        td.setAttribute("data-p", String(i + 1));
        var cls = ["tt-cell"];
        if (key === todayKey) cls.push("today");
        if (slot.changed) cls.push("changed");
        if (day.list.holiday) cls.push("holiday");
        td.className = cls.join(" ");
        if (slot.cls) {
          td.appendChild(J.el("div", "tt-s", slot.cls.s));
          if (t.showTeacher && slot.cls.t) td.appendChild(J.el("div", "tt-t", slot.cls.t));
          if (slot.cls.r) td.appendChild(J.el("div", "tt-t", slot.cls.r));
        } else if (slot.changed) {
          td.appendChild(J.el("div", "tt-t", "수업 없음"));
        }
        td.tabIndex = 0;
        td.setAttribute("role", "button");
        td.setAttribute("aria-label", DN[day.date.getDay()] + "요일 " + (i + 1) + "교시 " + (slot.cls ? slot.cls.s : "비어 있음") + " 고치기");
        var open = function () { openEdit(day.date, p, slot); };
        td.addEventListener("click", open);
        td.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    }
    table.appendChild(tb);
    markNow();
    drawChanges();
    drawSettings();
  }
  function markNow() {
    var st = JTT.status(tt(), new Date());
    var key = J.dateKey();
    Array.prototype.forEach.call(document.querySelectorAll("#ttTable td.now"), function (x) { x.classList.remove("now"); });
    if (st.kind === "class") {
      var cell = document.querySelector('#ttTable td[data-date="' + key + '"][data-p="' + st.cur.p + '"]');
      if (cell) cell.classList.add("now");
    }
  }

  /* ---------- 고치기 ---------- */
  function openEdit(date, p, slot) {
    sel = { date: date, p: p };
    var dow = date.getDay();
    var base = (tt().days[String(dow)] || [])[p - 1];
    var cur = slot.cls || base || { s: "", t: "", r: "" };
    J.$("ttEditWhere").textContent = (date.getMonth() + 1) + "/" + date.getDate() + " " + DN[dow] + " " + p + "교시";
    J.$("ttS").value = cur.s || "";
    J.$("ttT").value = cur.t || "";
    J.$("ttR").value = cur.r || "";
    J.$("ttUndoDay").hidden = !slot.changed;
    note("ttEditNote", "", "");
    J.$("ttEdit").hidden = false;
    J.$("ttEdit").scrollIntoView({ block: "nearest", behavior: "smooth" });
    J.$("ttS").focus();
  }
  function closeEdit() { sel = null; if (J.$("ttEdit")) J.$("ttEdit").hidden = true; }
  function fields() {
    return { s: J.$("ttS").value.trim(), t: J.$("ttT").value.trim(), r: J.$("ttR").value.trim() };
  }
  function removeOverride(key, p) {
    tt().overrides = tt().overrides.filter(function (o) { return !(o.date === key && o.p === p); });
  }
  function saveDay() {
    if (!sel) return;
    var f = fields();
    if (!f.s) { note("ttEditNote", "err", "과목을 적어줘. 수업이 없으면 '이 날 수업 없음'을 눌러."); return; }
    var key = JTT.dateKey(sel.date);
    removeOverride(key, sel.p);
    tt().overrides.push({ id: J.nextId(), date: key, p: sel.p, s: f.s, t: f.t, r: f.r });
    J.save(); closeEdit(); draw();
  }
  function emptyDay() {
    if (!sel) return;
    var key = JTT.dateKey(sel.date);
    removeOverride(key, sel.p);
    tt().overrides.push({ id: J.nextId(), date: key, p: sel.p, s: "", t: "", r: "" });
    J.save(); closeEdit(); draw();
  }
  function undoDay() {
    if (!sel) return;
    removeOverride(JTT.dateKey(sel.date), sel.p);
    J.save(); closeEdit(); draw();
  }
  function saveBase() {
    if (!sel) return;
    var f = fields();
    var dow = String(sel.date.getDay());
    var arr = tt().days[dow] || (tt().days[dow] = []);
    while (arr.length < tt().starts.length) arr.push(null);
    arr[sel.p - 1] = f.s ? { s: f.s, t: f.t, r: f.r } : null;
    removeOverride(JTT.dateKey(sel.date), sel.p);
    J.save(); closeEdit(); draw();
  }

  /* ---------- 바뀐 시간표 목록 ---------- */
  function drawChanges() {
    var ul = J.$("ttChgList");
    ul.textContent = "";
    var todayKey = J.dateKey();
    // 지난 변경은 30일 뒤 자동 정리
    var cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
    var before = tt().overrides.length;
    tt().overrides = tt().overrides.filter(function (o) { return o.date >= JTT.dateKey(cutoff); });
    if (tt().overrides.length !== before) J.save();
    var list = tt().overrides.filter(function (o) { return o.date >= todayKey; })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.p - b.p; });
    J.$("ttChgCount").textContent = list.length ? list.length + "개" : "";
    if (!list.length) {
      var li0 = J.el("li");
      li0.appendChild(J.el("p", "empty", "앞으로 바뀌는 수업이 없어. 표에서 칸을 눌러 넣을 수 있어."));
      ul.appendChild(li0);
      return;
    }
    list.forEach(function (o) {
      var d = new Date(o.date + "T00:00:00");
      var li = J.el("li");
      li.appendChild(J.el("span", "stamp", (d.getMonth() + 1) + "/" + d.getDate() + " " + DN[d.getDay()] + " " + o.p + "교시"));
      li.appendChild(J.el("span", "item-text", o.s ? o.s + (o.r ? " · " + o.r : "") : "수업 없음"));
      var del = J.el("button", "btn small", "취소");
      del.type = "button";
      del.addEventListener("click", function () {
        tt().overrides = tt().overrides.filter(function (x) { return x.id !== o.id; });
        J.save(); draw();
      });
      li.appendChild(del);
      ul.appendChild(li);
    });
  }

  /* ---------- 설정 ---------- */
  function wireSettings() {
    J.$("ttShowT").addEventListener("change", function (e) { tt().showTeacher = e.target.checked; J.save(); draw(); });
    J.$("ttMin").addEventListener("change", function (e) {
      var v = parseInt(e.target.value, 10);
      if (!(v >= 20 && v <= 120)) { e.target.value = tt().minutes; return; }
      tt().minutes = v; J.save(); draw();
    });
    J.$("ttCount").addEventListener("change", function (e) {
      var v = parseInt(e.target.value, 10);
      if (!(v >= 4 && v <= 10)) { e.target.value = tt().starts.length; return; }
      var s = tt().starts;
      while (s.length < v) {
        var last = JTT.hm(s[s.length - 1]) || 480;
        s.push(JTT.hmText(Math.min(last + 60, 23 * 60)));
      }
      s.length = v;
      J.save(); draw();
    });
    J.$("ttResetAll").addEventListener("click", function () {
      var b = J.$("ttResetAll");
      if (b.getAttribute("data-armed") !== "1") {
        b.setAttribute("data-armed", "1");
        b.textContent = "정말 되돌릴까? 한 번 더 누르면 되돌려";
        setTimeout(function () { b.removeAttribute("data-armed"); b.textContent = "처음 시간표로 되돌리기"; }, 4000);
        return;
      }
      J.data.timetable = JTT.defaultTT();
      J.save(); closeEdit(); draw();
      note("ttSetNote", "ok", "처음 시간표로 되돌렸어.");
    });
  }
  function drawSettings() {
    var t = tt();
    J.$("ttShowT").checked = !!t.showTeacher;
    J.$("ttMin").value = t.minutes;
    J.$("ttCount").value = t.starts.length;
    var box = J.$("ttStarts");
    box.textContent = "";
    t.starts.forEach(function (st, i) {
      var lab = J.el("label", null, (i + 1) + "교시 ");
      var inp = J.el("input", "field mini-input");
      inp.type = "time";
      inp.value = st;
      inp.style.width = "9em";
      inp.addEventListener("change", function () {
        if (JTT.hm(inp.value) == null) { inp.value = t.starts[i]; return; }
        t.starts[i] = inp.value; J.save(); draw();
      });
      lab.appendChild(inp);
      box.appendChild(lab);
    });
  }
  function note(id, kind, text) {
    var el = J.$(id);
    el.textContent = "";
    if (text) el.appendChild(J.el("div", "notice" + (kind ? " " + kind : ""), text));
  }

  /* ---------- 다른 곳에서 쓰는 도우미 ---------- */
  J.tt = {
    banner: function () { return JTT.bannerLines(tt(), new Date()); },
    dayText: function (date) {
      var list = JTT.dayClasses(tt(), date);
      var title = (date.getMonth() + 1) + "/" + date.getDate() + " " + DN[date.getDay()] + "요일";
      if (!list) return title + "은 수업이 없는 날이야.";
      var lines = list.filter(function (x) { return x.cls; }).map(function (x) {
        return x.p + "교시 " + x.cls.s + (x.changed ? " (바뀜)" : "");
      });
      if (list.holiday) return title + "은 " + list.holiday + "이라 수업이 없어.";
      return lines.length ? title + " 시간표야.\n" + lines.join("\n") : title + "은 수업이 없어.";
    },
    nowText: function () {
      var b = JTT.bannerLines(tt(), new Date());
      return b ? b.filter(Boolean).join("\n") : "오늘은 주말이라 수업이 없어.";
    },
    nextText: function () {
      var st = JTT.status(tt(), new Date());
      if (st.kind === "weekend") return "오늘은 주말이라 수업이 없어.";
      if (st.kind === "holiday") return "오늘은 " + st.name + "이라 수업이 없어.";
      if (st.next) return "다음은 " + st.next.p + "교시 " + st.next.cls.s + (st.next.cls.r ? " (" + st.next.cls.r + ")" : "") + ", " + JTT.hmText(st.next.start) + " 시작이야.";
      if (st.kind === "class") return "지금 " + st.cur.cls.s + "이 오늘 마지막 수업이야.";
      return JTT.bannerLines(tt(), new Date()).filter(Boolean).join("\n");
    }
  };
})();
