/* ===== 더보기 탭: 백업, 복원, 정보 ===== */
(function () {
  var J = window.J;
  var pendingImport = null;

  J.tab({
    id: "more",
    group: "etc",
    groupLabel: "더보기",
    label: "백업·정보",
    show: drawInfo,
    mount: function (root) {
      root.appendChild(J.el("h1", "view-title", "백업과 정보"));
      var grid = J.el("div", "grid");
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-backup">' +
          '<h2 id="h-backup">백업</h2>' +
          '<p class="muted">할 일, 메모, 기록은 이 기기에만 저장돼. 브라우저 데이터를 지우거나 기기를 바꾸면 사라지니까 가끔 백업 파일을 받아둬.</p>' +
          '<p id="lastBackup" class="muted"></p>' +
          '<div class="row">' +
            '<button class="btn primary grow" type="button" id="exportBtn">백업 파일 받기</button>' +
            '<button class="btn grow" type="button" id="copyBtn">백업 글자 복사</button>' +
          '</div>' +
          '<div id="exportNote"></div>' +
        '</section>'
      ));
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-restore">' +
          '<h2 id="h-restore">복원</h2>' +
          '<p class="muted">백업 파일을 고르거나, 복사해둔 백업 글자를 붙여넣어. 지금 데이터는 백업 내용으로 바뀌어.</p>' +
          '<input type="file" id="importFile" accept=".json,application/json,text/plain">' +
          '<textarea class="field textarea" id="importText" placeholder="백업 글자를 여기에 붙여넣기"></textarea>' +
          '<div class="row"><button class="btn grow" type="button" id="importTextBtn">붙여넣은 글자로 복원</button></div>' +
          '<div id="importNote"></div>' +
          '<div class="row" id="importConfirm" hidden>' +
            '<button class="btn danger grow" type="button" id="importYes">바꾸기</button>' +
            '<button class="btn grow" type="button" id="importNo">취소</button>' +
          '</div>' +
        '</section>'
      ));
      grid.appendChild(J.html(
        '<section class="panel" aria-labelledby="h-info">' +
          '<h2 id="h-info">정보</h2>' +
          '<p>자비스 v7.1 · 단어 추가, 명언 217개 · 풍경 테마, 엣지러너, 배치 9종, 시계 모드, 음악, 숙어</p>' +
          '<p class="muted" id="infoCounts"></p>' +
          '<p class="muted" id="infoStorage"></p>' +
        '</section>'
      ));
      root.appendChild(grid);

      J.$("exportBtn").addEventListener("click", exportFile);
      J.$("copyBtn").addEventListener("click", copyText);
      J.$("importFile").addEventListener("change", function (e) {
        var f = e.target.files && e.target.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () { prepareImport(String(reader.result || "")); };
        reader.onerror = function () { note("importNote", "err", "파일을 읽지 못했어."); };
        reader.readAsText(f);
        e.target.value = "";
      });
      J.$("importTextBtn").addEventListener("click", function () { prepareImport(J.$("importText").value); });
      J.$("importYes").addEventListener("click", doImport);
      J.$("importNo").addEventListener("click", function () {
        pendingImport = null;
        J.$("importConfirm").hidden = true;
        note("importNote", "", "취소했어.");
      });
      drawInfo();
    }
  });

  function note(id, kind, text) {
    var el = J.$(id);
    el.textContent = "";
    if (!text) return;
    el.appendChild(J.el("div", "notice" + (kind ? " " + kind : ""), text));
  }

  function backupText() {
    return JSON.stringify({ app: "jarvis", version: 2, exportedAt: new Date().toISOString(), data: J.data }, null, 2);
  }
  function markBackedUp() {
    J.data.lastBackup = Date.now();
    J.save();
    drawInfo();
    J.emit("backup");
  }
  function exportFile() {
    try {
      var blob = new Blob([backupText()], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = J.el("a");
      a.href = url;
      a.download = "jarvis-backup-" + J.dateKey() + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      markBackedUp();
      note("exportNote", "ok", "백업 파일을 내려받았어. 다운로드 폴더를 확인해봐. 안 보이면 '백업 글자 복사'를 써줘.");
    } catch (e) {
      note("exportNote", "err", "파일을 만들지 못했어. '백업 글자 복사'를 써줘.");
    }
  }
  function copyText() {
    var text = backupText();
    var done = function () {
      markBackedUp();
      note("exportNote", "ok", "백업 글자를 복사했어. 메모 앱이나 카톡 나와의 채팅에 붙여넣어 보관해.");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    var ta = J.$("importText");
    ta.value = text;
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    if (ok) { ta.value = ""; done(); }
    else note("exportNote", "warn", "자동 복사가 안 돼서 복원 칸에 백업 글자를 넣어뒀어. 길게 눌러서 전체 선택 후 복사해줘.");
  }

  function prepareImport(text) {
    var parsed;
    try { parsed = JSON.parse(text); } catch (e) {
      note("importNote", "err", "백업 내용을 읽을 수 없어. 파일이나 글자가 잘리지 않았는지 확인해줘.");
      return;
    }
    var d = parsed && parsed.app === "jarvis" ? parsed.data : parsed;
    if (!d || !Array.isArray(d.todos) || !Array.isArray(d.memos)) {
      note("importNote", "err", "자비스 백업이 아닌 것 같아.");
      return;
    }
    pendingImport = d;
    var when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString("ko-KR") : "날짜 모름";
    note("importNote", "warn",
      "백업(" + when + "): 할 일 " + d.todos.length + "개, 메모 " + d.memos.length + "개. " +
      "지금 데이터(할 일 " + J.data.todos.length + "개, 메모 " + J.data.memos.length + "개)를 이걸로 바꿀까?");
    J.$("importConfirm").hidden = false;
  }
  function doImport() {
    if (!pendingImport) return;
    try { localStorage.setItem(J.STORE_KEY + ".before-import", JSON.stringify(J.data)); } catch (e) {}
    var keepBackupTime = J.data.lastBackup;
    J.data = J.normalize(pendingImport);
    J.data.lastBackup = Math.max(keepBackupTime || 0, J.data.lastBackup || 0);
    J.save();
    pendingImport = null;
    J.$("importConfirm").hidden = true;
    J.$("importText").value = "";
    note("importNote", "ok", "복원했어. 화면을 새로 고칠게.");
    setTimeout(function () { location.reload(); }, 900);
  }

  function drawInfo() {
    if (!J.$("lastBackup")) return;
    J.$("lastBackup").textContent = J.data.lastBackup
      ? "마지막 백업: " + new Date(J.data.lastBackup).toLocaleString("ko-KR")
      : "아직 백업한 적이 없어.";
    J.$("infoCounts").textContent = "할 일 " + J.data.todos.length + "개 · 메모 " + J.data.memos.length + "개 · 계산 기록 " + J.data.calcHistory.length + "개";
    var size = 0;
    try { size = (localStorage.getItem(J.STORE_KEY) || "").length; } catch (e) {}
    J.$("infoStorage").textContent = "저장 용량 약 " + Math.max(1, Math.round(size / 1024)) + "KB 사용 중" + (J.storageOk ? "" : " · 저장에 실패했어! 백업부터 해줘.");
  }

})();

/* ===== 자유 문장을 실제 동작으로 연결 ===== */
(function () {
  var J = window.J;
  var DAYS = ["일", "월", "화", "수", "목", "금", "토"];

  function listTodos() {
    var todos = J.data.todos;
    if (!todos.length) return "할 일이 하나도 없어.";
    var left = todos.filter(function (t) { return !t.done; });
    if (!left.length) return "할 일을 전부 끝냈어! 👏";
    var lines = [];
    todos.forEach(function (t, i) { if (!t.done) lines.push((i + 1) + ". " + t.text); });
    return "남은 할 일 " + left.length + "개야.\n" + lines.slice(0, 8).join("\n") + (lines.length > 8 ? "\n…" : "");
  }

  J.understand = function (line) {
    var it = window.JIntent && JIntent.parse(line);
    if (!it) return false;
    var now = new Date();
    var n, t, found;
    switch (it.type) {
      case "greet":
        var h = now.getHours();
        J.say((h < 6 ? "늦은 시간이네." : h < 12 ? "좋은 아침이야!" : h < 18 ? "안녕! 좋은 오후야." : "안녕! 좋은 저녁이야.") + " 뭘 도와줄까?");
        break;
      case "thanks":
        J.say("천만에! 또 필요하면 불러줘.");
        break;
      case "help":
        J.run("도움");
        J.say("그냥 말하듯이 써도 돼. 예)\n다음 시간 뭐야? · 내일 시간표 · 오늘 급식 뭐야?\n10월 20일 중간고사 일정 추가 · 일정 뭐 있어?\n떡볶이 4000원 썼어 · 이번 달 얼마 썼어?\n10분 뒤에 알려줘 · 숙제 할일에 넣어줘 · 2번 다 했어\n준비물 메모해줘 · 3 더하기 5 · 일기 쓸래 · 내 레벨");
        break;
      case "go":
        J.go(it.tab);
        break;
      case "tt_next":
        J.say(J.tt.nextText());
        break;
      case "tt_now":
        J.say(J.tt.nowText());
        break;
      case "tt_day":
        var WD = { "일요일": 0, "월요일": 1, "화요일": 2, "수요일": 3, "목요일": 4, "금요일": 5, "토요일": 6 };
        var off = it.when === "오늘" ? 0 : it.when === "내일" ? 1 : it.when === "모레" ? 2 : (WD[it.when] - now.getDay() + 7) % 7;
        J.say(J.tt.dayText(new Date(now.getFullYear(), now.getMonth(), now.getDate() + off)));
        break;
      case "money_add":
        J.money.add({ type: it.kind, amount: it.amount, memo: it.memo, date: it.date });
        var cat = J.data.money[J.data.money.length - 1].cat;
        J.say((it.kind === "in" ? "들어온 돈 " : "쓴 돈 ") + JX.won(it.amount) + (it.memo ? " (" + it.memo + (it.kind === "out" ? ", " + cat : "") + ")" : "") + " 기록했어.\n" + J.money.monthText());
        break;
      case "money_summary":
        J.say(J.money.monthText());
        break;
      case "event_add":
        J.cal.add(it.date, it.title, { time: it.time, dday: it.dday });
        var ed = JX.fromKey(it.date);
        J.say((ed.getMonth() + 1) + "/" + ed.getDate() + "(" + DAYS[ed.getDay()] + ")" + (it.time ? " " + it.time : "") + " '" + it.title + "' 일정 넣었어" + (it.dday ? " · " + J.cal.ddayLabel(it.date) : "") + ".");
        break;
      case "event_list":
        var evs = it.date ? J.data.events.filter(function (e) { return e.date === it.date; }) : J.cal.upcoming(30);
        if (!evs.length) { J.say(it.date ? "그 날은 일정이 없어." : "앞으로 30일 안에 일정이 없어."); break; }
        J.say((it.date ? "그 날 일정이야." : "다가오는 일정이야.") + "\n" + evs.slice(0, 8).map(function (e) {
          var d = JX.fromKey(e.date);
          return (d.getMonth() + 1) + "/" + d.getDate() + "(" + DAYS[d.getDay()] + ") " + (e.time ? e.time + " " : "") + e.title + (e.dday ? " · " + J.cal.ddayLabel(e.date) : "");
        }).join("\n"));
        break;
      case "meal_day":
        J.say(J.meal.text(JX.fromKey(it.date)));
        break;
      case "diary_open":
        J.diary.open(it.date);
        break;
      case "level":
        J.say(J.game.text());
        break;
      case "dict_word":
        var dx = J.dict.lookup(it.word);
        if (dx) { J.say(J.dict.text(dx)); J.dict.speak(dx.w); }
        else {
          var ds = J.dict.search(it.word, 5);
          J.say(ds.length ? "'" + it.word + "'는 없고 비슷한 단어야.\n" + ds.map(J.dict.text).join("\n") : "'" + it.word + "'는 아직 사전에 없어.");
        }
        break;
      case "dict_ko":
        var dk = J.dict.search(it.text, 6);
        J.say(dk.length ? "'" + it.text + "' 뜻이 있는 단어야.\n" + dk.map(J.dict.text).join("\n") : "'" + it.text + "'에 맞는 단어를 못 찾았어.");
        break;
      case "quote":
        J.quote.next(); if (J.renderQuote) J.renderQuote();
        J.say(J.quote.text());
        break;
      case "focus_on":
        J.focus.start();
        break;
      case "focus_off":
        if (J.focus.active()) J.focus.stop(); else J.say("집중모드가 켜져 있지 않아.");
        break;
      case "time_now":
        J.say("지금은 " + (now.getHours() < 12 ? "오전 " : "오후 ") + ((now.getHours() % 12) || 12) + "시 " + now.getMinutes() + "분이야.");
        break;
      case "date_now":
        J.say("오늘은 " + now.getFullYear() + "년 " + (now.getMonth() + 1) + "월 " + now.getDate() + "일 " + DAYS[now.getDay()] + "요일이야.");
        break;
      case "timer":
        J.timer.start(it.seconds);
        break;
      case "timer_too_long":
        J.say("타이머는 10시간까지만 돼. 그보다 길면 패드 알람을 써줘.");
        break;
      case "timer_stop":
        if (J.timer.isRunning()) { J.timer.pause(); J.say("타이머 멈췄어. '타이머 계속'이라고 하면 이어서 돌릴게."); }
        else if (J.timer.isPaused()) { J.timer.reset(); J.say("타이머를 껐어."); }
        else J.say("돌고 있는 타이머가 없어.");
        break;
      case "timer_resume":
        if (J.timer.isPaused()) { J.timer.resume(); J.say("타이머 이어서 돌릴게."); }
        else J.say("멈춰 있는 타이머가 없어.");
        break;
      case "pomo_start":
        J.say("뽀모도로 " + J.pomo.start() + " 시작할게.");
        break;
      case "pomo_stop":
        J.pomo.stop();
        J.say("뽀모도로 멈췄어.");
        break;
      case "sw_start":
        J.sw.start();
        J.say("스톱워치 시작했어.");
        break;
      case "sw_stop":
        J.say("스톱워치 멈췄어. " + J.sw.stop());
        break;
      case "sw_reset":
        J.sw.reset();
        J.say("스톱워치를 처음으로 돌렸어.");
        break;
      case "sw_lap":
        t = J.sw.lap();
        J.say(t ? "구간 기록했어. " + t : "스톱워치가 돌고 있을 때만 기록할 수 있어.");
        break;
      case "calc":
        try { J.say(it.expr.replace(/\*/g, "×").replace(/\//g, "÷") + " = " + JCalc.format(JCalc.evaluate(it.expr, { deg: true }))); }
        catch (e) { J.say("계산 못 했어: " + e.message); }
        break;
      case "todo_add":
        J.addTodo(it.text);
        J.say("할 일에 넣었어 → " + it.text);
        break;
      case "todo_list":
        J.say(listTodos());
        break;
      case "todo_done":
        n = it.n;
        if (n < 1 || n > J.data.todos.length) { J.say(n + "번 할 일은 없어. 지금 " + J.data.todos.length + "번까지 있어."); break; }
        J.markTodoDone(J.data.todos[n - 1]);
        J.say("잘했어! 완료 처리했어 → " + J.data.todos[n - 1].text);
        break;
      case "todo_delete":
        n = it.n;
        if (n < 1 || n > J.data.todos.length) { J.say(n + "번 할 일은 없어."); break; }
        t = J.data.todos.splice(n - 1, 1)[0];
        J.save();
        J.renderTodos();
        J.say("지웠어 → " + t.text);
        break;
      case "todo_done_text":
        var q = it.text.replace(/\s+/g, "");
        found = J.data.todos.filter(function (x) {
          var a = x.text.replace(/\s+/g, "");
          return !x.done && q.length >= 1 && (a.indexOf(q) >= 0 || q.indexOf(a) >= 0);
        });
        if (found.length === 1) {
          J.markTodoDone(found[0]);
          J.say("잘했어! 완료 처리했어 → " + found[0].text);
        } else if (found.length > 1) {
          J.say("비슷한 할 일이 여러 개야. 번호로 알려줘. 예) 2번 다 했어\n" + listTodos());
        } else {
          return false; // 할 일과 상관없는 말이면 모른다고 답한다
        }
        break;
      case "memo_add":
        J.addMemo(it.text);
        J.say("메모해뒀어 → " + it.text);
        break;
      case "memo_list":
        if (!J.data.memos.length) { J.say("저장된 메모가 없어."); break; }
        J.say("최근 메모야.\n" + J.data.memos.slice(-5).reverse().map(function (m) { return "· " + m.text; }).join("\n"));
        break;
      default:
        return false;
    }
    return true;
  };
})();

          '<button class="btn primary" type="button" data-f="pomo">뽀모도로 (25분 + 휴식)</button>' +
          '<button class="btn" type="button" data-f="t25">타이머 25분</button>' +
          '<button class="btn" type="button" data-f="t50">타이머 50분</button>' +
          '<button class="btn" type="button" data-f="sw">시간 재기</button>' +
        '</div>' +
        '<div class="focus-ctl" id="focusCtl" hidden>' +
          '<button class="btn" type="button" id="focusPause">일시정지</button>' +
          '<button class="btn" type="button" id="focusChange">다른 방식</button>' +
        '</div>' +
        '<p class="focus-note" id="focusNote"></p>' +
        '<button class="btn focus-exit" type="button" id="focusExit">집중 끝내기</button>' +
      '</div>'
    );
    document.body.appendChild(ov);
    Array.prototype.forEach.call(ov.querySelectorAll("[data-f]"), function (b) {
      b.addEventListener("click", function () { choose(b.getAttribute("data-f")); });
    });
    J.$("focusPause").addEventListener("click", togglePause);
    J.$("focusChange").addEventListener("click", function () { stopAll(); mode = null; draw(); });
    J.$("focusExit").addEventListener("click", function () {
      var b = J.$("focusExit");
      if (b.getAttribute("data-armed") !== "1") {
        b.setAttribute("data-armed", "1");
        b.textContent = "정말 끝낼까? 한 번 더 누르면 끝나";
        setTimeout(function () { if (b) { b.removeAttribute("data-armed"); b.textContent = "집중 끝내기"; } }, 4000);
        return;
      }
      b.removeAttribute("data-armed");
      b.textContent = "집중 끝내기";
      J.focus.stop();
    });
    document.addEventListener("keydown", function (e) { if (active && e.key === "Escape") e.preventDefault(); });
  }

  var mode = null; // "pomo" | "timer" | "sw"
  function stopAll() {
    if (J.pomo.state().running) J.pomo.stop();
    if (J.timer.state().running) J.timer.pause();
    if (J.sw.state().running) J.sw.stop();
  }
  function choose(f) {
    J.audio.ensure();
    stopAll();
    if (f === "pomo") { J.pomo.reset(); J.pomo.start(); mode = "pomo"; }
    else if (f === "t25") { J.timer.start(25 * 60); mode = "timer"; }
    else if (f === "t50") { J.timer.start(50 * 60); mode = "timer"; }
    else { J.sw.reset(); J.sw.start(); mode = "sw"; }
    draw();
  }
  function togglePause() {
    if (mode === "pomo") { if (J.pomo.state().running) J.pomo.stop(); else J.pomo.start(); }
    else if (mode === "timer") { if (J.timer.state().running) J.timer.pause(); else J.timer.resume(); }
    else if (mode === "sw") { if (J.sw.state().running) J.sw.stop(); else J.sw.start(); }
    draw();
  }
  function running() {
    if (mode === "pomo") { var p = J.pomo.state(); return p.running && p.phase === "focus"; }
    if (mode === "timer") return J.timer.state().running;
    if (mode === "sw") return J.sw.state().running;
    return false;
  }
  function draw() {
    if (!ov || !active) return;
    var now = new Date();
    J.$("focusClock").textContent = J.pad2(now.getHours()) + ":" + J.pad2(now.getMinutes());
    J.$("focusToday").textContent = "오늘 공부 " + hm(studyToday()) + (sessionSec >= 60 ? " · 이번 " + hm(sessionSec) : "");
    J.$("focusPick").hidden = !!mode;
    J.$("focusCtl").hidden = !mode;
    var frac = 1, label = "무엇으로 집중할까?", text = "--:--", isRunning = false, rest = false;
    if (mode === "pomo") {
      var p = J.pomo.state();
      frac = p.total ? p.remaining / p.total : 1; label = p.label; text = J.fmtMMSS(p.remaining); isRunning = p.running; rest = p.phase !== "focus";
    } else if (mode === "timer") {
      var t = J.timer.state();
      frac = t.total ? t.remaining / t.total : 0; label = t.remaining > 0 ? "타이머" : "타이머 끝!"; text = J.fmtMMSS(t.remaining); isRunning = t.running;
    } else if (mode === "sw") {
      var s = J.sw.state();
      frac = (s.ms % 3600000) / 3600000; label = "시간 재는 중"; text = J.sw.fmt(s.ms).replace(/\.\d\d$/, ""); isRunning = s.running;
    }
    J.$("focusPhase").textContent = label;
    J.$("focusTime").textContent = text;
    var ring = J.$("focusRing");
    ring.style.strokeDasharray = C.toFixed(1);
    ring.style.strokeDashoffset = (C * (1 - Math.max(0, Math.min(1, frac)))).toFixed(1);
    J.$("focusRingWrap").className = "focus-ring-wrap" + (rest ? " rest" : "");
    J.$("focusPause").textContent = isRunning ? "일시정지" : "계속";
  }
  function tick() {
    if (!active) return;
    var nowMs = Date.now();
    var dt = Math.max(0, Math.min(600, (nowMs - lastTick) / 1000)); // 화면이 꺼졌다 켜져도 10분까지는 이어서 센다
    lastTick = nowMs;
    if (running()) {
      sessionSec += dt;
      var k = J.dateKey();
      J.data.study[k] = (J.data.study[k] || 0) + dt;
    }
    draw();
  }
  var saveIv = null;

  J.focus = {
    active: function () { return active; },
    start: function () {
      if (active) return;
      if (!ov) build();
      active = true;
      sessionSec = 0;
      lastTick = Date.now();
      mode = J.pomo.state().running ? "pomo" : J.timer.state().running ? "timer" : J.sw.state().running ? "sw" : null;
      ov.hidden = false;
      document.body.classList.add("focus-on");
      J.audio.ensure();
      try {
        var el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
      } catch (e) {}
      wakeWasOn = !!J.wake.want;
      if (!wakeWasOn) J.wake.set(true);
      J.$("focusNote").textContent = "알림이 신경 쓰이면 패드 화면 위에서 아래로 쓸어서 '방해 금지'를 켜줘. 앱이 직접 켤 수는 없어.";
      setTimeout(function () { if (J.$("focusNote")) J.$("focusNote").textContent = ""; }, 12000);
      saveIv = setInterval(function () { J.save(); }, 60000);
      draw();
    },
    stop: function () {
      if (!active) return;
      active = false;
      clearInterval(saveIv);
      J.save();
      ov.hidden = true;
      document.body.classList.remove("focus-on");
      try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {}); } catch (e) {}
      if (!wakeWasOn) J.wake.set(false);
      var mins = Math.floor(sessionSec / 60);
      J.say(mins >= 1 ? "수고했어! 이번에 " + hm(sessionSec) + " 집중했어. 오늘 총 " + hm(studyToday()) + "이야." : "집중모드를 껐어.");
      J.emit("study");
    },
    todayText: function () { return "오늘 공부한 시간은 " + hm(studyToday()) + "이야."; }
  };
  J.onTick(tick);
})();

/* ===== 시계 모드: 화면 가득 시계만 (테마 풍경은 그대로 뒤에 보임) ===== */
(function () {
  var J = window.J;
  var DN = ["일", "월", "화", "수", "목", "금", "토"];
  if (!J.data.clockMode) J.data.clockMode = { kind: "digital", sec: true, quote: true };
  var S = J.data.clockMode;
  var ov = null, active = false, hideT = null, wakeWasOn = false;

  function build() {
    ov = J.html(
      '<div class="clockmode" id="clockMode" role="dialog" aria-modal="true" aria-label="시계 모드" hidden>' +
        '<div class="cm-body">' +
          '<div class="cm-time" id="cmTime"></div>' +
          '<svg class="cm-analog" id="cmAnalog" viewBox="0 0 300 300" aria-hidden="true"></svg>' +

      face += '<line x1="' + (150 + Math.sin(a) * r1).toFixed(1) + '" y1="' + (150 - Math.cos(a) * r1).toFixed(1) + '" x2="' + (150 + Math.sin(a) * r2).toFixed(1) + '" y2="' + (150 - Math.cos(a) * r2).toFixed(1) + '" class="' + (big ? "cm-tick big" : "cm-tick") + '"/>';
    }
    face += '<line id="cmH" x1="150" y1="150" x2="150" y2="82" class="cm-hand h"/>' +
      '<line id="cmM" x1="150" y1="150" x2="150" y2="44" class="cm-hand m"/>' +
      '<line id="cmS" x1="150" y1="166" x2="150" y2="30" class="cm-hand s"/>' +
      '<circle cx="150" cy="150" r="6" class="cm-pin"/>';
    J.$("cmAnalog").innerHTML = face;
    J.$("cmKind").addEventListener("click", function () { S.kind = S.kind === "digital" ? "analog" : "digital"; J.save(); draw(); poke(); });
    J.$("cmSec").addEventListener("click", function () { S.sec = !S.sec; J.save(); draw(); poke(); });
    J.$("cmQ").addEventListener("click", function () { S.quote = !S.quote; J.save(); draw(); poke(); });
    J.$("cmExit").addEventListener("click", function () { J.clockMode.stop(); });
    ov.addEventListener("pointerdown", poke);
    document.addEventListener("keydown", function (e) { if (active && e.key === "Escape") J.clockMode.stop(); });
  }
  // 손대면 버튼이 잠깐 나타났다가 사라진다
  function poke() {
    if (!ov) return;
    ov.classList.add("show-bar");
    clearTimeout(hideT);
    hideT = setTimeout(function () { if (ov) ov.classList.remove("show-bar"); }, 3500);
  }
  function draw() {
    if (!active) return;
    var d = new Date(), h = J.data.home;
    var hh = d.getHours();
    if (!h.clock24) hh = hh % 12 || 12;
    var t = (h.clock24 ? J.pad2(hh) : hh) + ":" + J.pad2(d.getMinutes());
    var digital = S.kind !== "analog";
    J.$("cmTime").hidden = !digital;
    J.$("cmAnalog").style.display = digital ? "none" : "block";
    if (digital) {
      J.$("cmTime").innerHTML = "";
      J.$("cmTime").appendChild(document.createTextNode(t));
      if (S.sec) J.$("cmTime").appendChild(J.el("small", null, ":" + J.pad2(d.getSeconds())));
      if (!h.clock24) J.$("cmTime").appendChild(J.el("small", "ampm", d.getHours() < 12 ? " AM" : " PM"));
    } else {
      var s = d.getSeconds(), m = d.getMinutes() + s / 60, H = (d.getHours() % 12) + m / 60;
      J.$("cmH").setAttribute("transform", "rotate(" + (H * 30).toFixed(2) + " 150 150)");
      J.$("cmM").setAttribute("transform", "rotate(" + (m * 6).toFixed(2) + " 150 150)");
      J.$("cmS").setAttribute("transform", "rotate(" + (s * 6) + " 150 150)");
      J.$("cmS").style.display = S.sec ? "" : "none";
    }
    J.$("cmDate").textContent = (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + DN[d.getDay()] + "요일";
    var bl = J.tt && J.tt.banner ? J.tt.banner() : null;
    var sub = bl ? bl.filter(Boolean).join(" · ") : "";
    J.$("cmSub").textContent = sub || "";
    J.$("cmSub").hidden = !sub;
    var q = J.quote && J.quote.current ? J.quote.current() : null;
    J.$("cmQuote").hidden = !S.quote || !q;
    if (q) J.$("cmQuote").textContent = "“" + q[0] + "”" + (q[1] ? " — " + q[1] : "");
    var mu = J.music && J.music.nowText ? J.music.nowText() : "";
    J.$("cmMusic").hidden = !mu;
    J.$("cmMusic").textContent = mu ? "♪ " + mu : "";
    J.$("cmKind").textContent = digital ? "아날로그로" : "디지털로";
    J.$("cmSec").textContent = S.sec ? "초 숨기기" : "초 보이기";
    J.$("cmQ").textContent = S.quote ? "명언 숨기기" : "명언 보이기";
  }

  J.clockMode = {
    active: function () { return active; },
    start: function () {
      if (active) return;
      if (J.focus && J.focus.active()) J.focus.stop();
      if (!ov) build();
      active = true;
      ov.hidden = false;
      document.body.classList.add("clock-on");
      try { var el = document.documentElement; if (el.requestFullscreen) el.requestFullscreen().catch(function () {}); } catch (e) {}
      wakeWasOn = !!J.wake.want;
      if (!wakeWasOn) J.wake.set(true);
      draw();
      poke();
    },
    stop: function () {
      if (!active) return;
      active = false;
      ov.hidden = true;
      document.body.classList.remove("clock-on");
      try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {}); } catch (e) {}
      if (!wakeWasOn) J.wake.set(false);
    }
  };
  J.onTick(draw);
})();

/* ===== 도구 > 음악: 내 기기에 있는 노래 파일을 넣어서 듣기 =====
   노래 파일은 이 브라우저 안(IndexedDB)에 저장된다. 인터넷 없이 재생되고, 화면을 꺼도 계속 나온다. */
(function () {
  var J = window.J;
  if (!J.data.music || typeof J.data.music !== "object") J.data.music = {};
  var M = J.data.music;
  if (!Array.isArray(M.order)) M.order = [];
  if (M.vol == null) M.vol = 0.8;
  if (!M.repeat) M.repeat = "all"; // all | one | off
  if (M.shuffle == null) M.shuffle = false;

  var DB = null, dbFailed = false;
  var songs = {};          // id -> { id, name, size, type }
  var temp = {};           // 저장에 실패했을 때 이번만 쓰는 파일
  var audio = new Audio();
  audio.preload = "metadata";
  var curId = null, curUrl = null;
  var history = [];

  function openDB(cb) {
    if (DB) return cb(DB);
    if (dbFailed || !window.indexedDB) { dbFailed = true; return cb(null); }
    try {
      var rq = indexedDB.open("jarvis-music", 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore("songs", { keyPath: "id" }); };
      rq.onsuccess = function () { DB = rq.result; cb(DB); };
      rq.onerror = function () { dbFailed = true; cb(null); };
    } catch (e) { dbFailed = true; cb(null); }
  }
  function tx(mode) { return DB.transaction("songs", mode).objectStore("songs"); }
  function loadList(cb) {
    openDB(function (db) {
      if (!db) { cb(); return; }
      var out = {};
      var rq = tx("readonly").openCursor();
      rq.onsuccess = function () {
        var c = rq.result;
        if (c) { var v = c.value; out[v.id] = { id: v.id, name: v.name, size: v.size, type: v.type }; c["continue"](); }
        else {
          songs = out;
          M.order = M.order.filter(function (id) { return songs[id]; });
          Object.keys(songs).forEach(function (id) { if (M.order.indexOf(id) < 0) M.order.push(id); });
          cb();
        }
      };
      rq.onerror = function () { cb(); };
    });
  }
  function getBlob(id, cb) {
    if (temp[id]) return cb(temp[id]);
    if (!DB) return cb(null);
    var rq = tx("readonly").get(id);
    rq.onsuccess = function () { cb(rq.result ? rq.result.blob : null); };
    rq.onerror = function () { cb(null); };
  }
  function cleanName(n) { return String(n || "노래").replace(/\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|webm|mp4)$/i, "").replace(/_/g, " ").trim(); }
  function list() { return M.order.filter(function (id) { return songs[id]; }).map(function (id) { return songs[id]; }); }
  function fmt(s) { if (!isFinite(s) || s < 0) s = 0; var m = Math.floor(s / 60); return m + ":" + J.pad2(Math.floor(s % 60)); }

  function addFiles(files, done) {
    var arr = Array.prototype.slice.call(files || []).filter(function (f) { return /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav|ogg|opus|flac)$/i.test(f.name); });
    if (!arr.length) { done(0, 0, "노래 파일(mp3, m4a 같은 것)을 골라줘."); return; }
    openDB(function (db) {
      var ok = 0, bad = 0, i = 0;
      function nextOne() {
        if (i >= arr.length) { J.save(); done(ok, bad, db ? "" : "이 브라우저는 노래를 저장할 수 없어서 이번에만 들을 수 있어. 앱을 다시 열면 다시 넣어야 해."); return; }
        var f = arr[i++];
        var id = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        var meta = { id: id, name: cleanName(f.name), size: f.size, type: f.type || "audio/mpeg" };
        if (!db) { temp[id] = f; songs[id] = meta; M.order.push(id); ok++; nextOne(); return; }
        try {
          var t = db.transaction("songs", "readwrite");
          t.objectStore("songs").put({ id: id, name: meta.name, size: meta.size, type: meta.type, blob: f, added: Date.now() });
          t.oncomplete = function () { songs[id] = meta; M.order.push(id); ok++; nextOne(); };
          t.onerror = t.onabort = function () { temp[id] = f; songs[id] = meta; M.order.push(id); bad++; nextOne(); };
        } catch (e) { temp[id] = f; songs[id] = meta; M.order.push(id); bad++; nextOne(); }
      }
      nextOne();
    });
  }
  function removeSong(id) {
    if (id === curId) { audio.pause(); curId = null; if (curUrl) URL.revokeObjectURL(curUrl); curUrl = null; }
    delete songs[id]; delete temp[id];
    M.order = M.order.filter(function (x) { return x !== id; });
    if (M.last === id) M.last = null;
    J.save();
    if (DB) { try { tx("readwrite")["delete"](id); } catch (e) {} }
    draw();
  }

  function playId(id, keepHistory) {
    if (!songs[id]) return;
    getBlob(id, function (blob) {
      if (!blob) { J.say("이 노래 파일을 찾지 못했어. 다시 넣어줘."); return; }
      if (curUrl) URL.revokeObjectURL(curUrl);
      curUrl = URL.createObjectURL(blob);
      if (curId && !keepHistory) history.push(curId);
      curId = id;
      M.last = id;
      J.save();
      audio.src = curUrl;
      audio.volume = M.vol;
      var p = audio.play();
      if (p && p["catch"]) p["catch"](function () {});
      setSession();
      draw();
    });
  }
  function pickNext(dir) {
    var l = M.order.filter(function (id) { return songs[id]; });
    if (!l.length) return null;
    if (dir < 0) {
      if (audio.currentTime > 4 || !history.length) return curId || l[0];
      return history.pop();
    }
    if (M.shuffle && l.length > 1) {
      var cand = l.filter(function (id) { return id !== curId; });
      return cand[Math.floor(Math.random() * cand.length)];
    }
    var i = l.indexOf(curId);
    if (i < 0) return l[0];
    if (i + 1 >= l.length) return M.repeat === "all" ? l[0] : null;
    return l[i + 1];
  }
  function next() { var id = pickNext(1); if (id) playId(id); else { audio.pause(); draw(); } }
  function prev() {
    if (audio.currentTime > 4 && curId) { audio.currentTime = 0; return; }
    var id = pickNext(-1); if (id) playId(id, true);
  }
  function play() {
    if (curId && audio.src) { var p = audio.play(); if (p && p["catch"]) p["catch"](function () {}); draw(); return true; }
    var l = list();
    if (!l.length) return false;
    playId(M.last && songs[M.last] ? M.last : (M.shuffle ? l[Math.floor(Math.random() * l.length)].id : l[0].id));
    return true;
  }
  function pause() { audio.pause(); draw(); }
  function toggle() { if (audio.paused) return play(); pause(); return true; }

  audio.addEventListener("ended", function () {
    if (M.repeat === "one") { audio.currentTime = 0; audio.play(); return; }
    next();
  });
  ["play", "pause"].forEach(function (ev) { audio.addEventListener(ev, function () { draw(); setSessionState(); }); });
  audio.addEventListener("timeupdate", drawTime);
  audio.addEventListener("loadedmetadata", drawTime);

  function setSession() {
    if (!("mediaSession" in navigator) || !curId) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: songs[curId].name, artist: "자비스 음악", album: "내 노래" });
      navigator.mediaSession.setActionHandler("play", function () { play(); });
      navigator.mediaSession.setActionHandler("pause", function () { pause(); });
      navigator.mediaSession.setActionHandler("nexttrack", next);
      navigator.mediaSession.setActionHandler("previoustrack", prev);
    } catch (e) {}
  }
  function setSessionState() {
    try { if ("mediaSession" in navigator) navigator.mediaSession.playbackState = audio.paused ? "paused" : "playing"; } catch (e) {}
  }

  /* ---------- 화면 ---------- */
  J.tab({
    id: "music",
    group: "tools",
    label: "음악",
    show: function () { draw(); },
    mount: function (root) {
      root.appendChild(J.el("h1", "view-title", "음악"));
      var grid = J.el("div", "grid");
      grid.appendChild(J.html(
        '<section class="panel music-now" aria-labelledby="h-mnow">' +
          '<h2 id="h-mnow">지금 듣는 노래</h2>' +

          '<p class="muted" id="muNote">패드에 있는 mp3·m4a 파일을 골라. 한 번 넣으면 이 브라우저 안에 저장돼서 인터넷 없이 들을 수 있어.</p>' +

      J.$("muSeek").addEventListener("input", function (e) { if (isFinite(audio.duration)) audio.currentTime = (e.target.value / 1000) * audio.duration; });

  // 홈 아래쪽 작은 플레이어

  function drawTime() {
    var d = audio.duration, c = audio.currentTime;
    if (J.$("muCur")) {
      J.$("muCur").textContent = fmt(c);
      J.$("muDur").textContent = fmt(d);
      if (document.activeElement !== J.$("muSeek")) J.$("muSeek").value = isFinite(d) && d > 0 ? Math.round((c / d) * 1000) : 0;
    }

  function draw() {
    var playing = !audio.paused && !!curId;
    mini.hidden = !curId;
    if (curId && songs[curId]) {
      J.$("mpTitle").textContent = (playing ? "♪ " : "⏸ ") + songs[curId].name;
      J.$("mpPlay").textContent = playing ? "⏸" : "▶";

    document.body.classList.toggle("has-mini", !!curId);

    J.$("muTitle").textContent = curId && songs[curId] ? songs[curId].name : list().length ? "▶을 누르면 재생돼" : "노래를 넣어봐";

      li.appendChild(t);

  J.music = {

    list: list,
    playId: playId,
    playing: function () { return !audio.paused && !!curId; },
    nowText: function () { return curId && songs[curId] && !audio.paused ? songs[curId].name : ""; },
    setShuffle: function (v) { M.shuffle = !!v; J.save(); draw(); },
    setRepeat: function (v) { M.repeat = v; J.save(); draw(); }
  };

  // 말로 하는 음악 명령
  var baseUnderstand = J.understand;
  J.understand = function (line) {
    var s = String(line || "").replace(/\s+/g, " ").trim();
    if (/시계\s*모드/.test(s)) { J.clockMode.start(); return true; }
    if (/(노래|음악|뮤직)/.test(s) || /(다음|이전)\s*곡/.test(s)) {
      if (/(다음|넘겨|스킵)/.test(s)) { if (!list().length) J.say("넣은 노래가 없어. 도구 > 음악에서 넣어줘."); else { next(); J.say("다음 곡."); } return true; }
      if (/이전/.test(s)) { prev(); J.say("이전 곡."); return true; }
      if (/(멈|꺼|끄|정지|중지|그만)/.test(s)) { pause(); J.say("음악을 멈췄어."); return true; }
      if (/(틀|켜|재생|들려|듣)/.test(s)) {
        if (play()) J.say("음악 틀게."); else { J.say("아직 넣은 노래가 없어. 음악 화면에서 노래 파일을 넣어줘."); J.go("music"); }
        return true;
      }
      if (/(목록|뭐 있|리스트)/.test(s)) { var l = list(); J.say(l.length ? "내 노래 " + l.length + "곡\n" + l.slice(0, 12).map(function (x, i) { return (i + 1) + ". " + x.name; }).join("\n") : "넣은 노래가 없어."); return true; }
    }
    return baseUnderstand ? baseUnderstand(line) : false;
  };

  loadList(function () { J.save(); draw(); });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
})();

/* ===== 명령어 가지치기: 명령어 창 아래에서 단계별로 골라 실행 =====
   노드 모양: { t: 이름, kids: [노드] 또는 function(){ return [노드] }, run: function(){}, ask: { ph: 안내, run: function(글){ 다음 노드 목록을 돌려줄 수도 있음 } } } */
(function () {
  var J = window.J;
  var DN = ["일", "월", "화", "수", "목", "금", "토"];
  var stack = [];       // 지금까지 들어온 노드들
  var pendingAsk = null;
  var open = false;
  var box, pathEl, chipsEl;

  /* ---------- 작은 도우미 ---------- */
  function leaf(t, fn) { return { t: t, run: fn }; }
  function ask(t, ph, fn) { return { t: t, ask: { ph: ph, run: fn } }; }
  function group(t, kids) { return { t: t, kids: kids }; }
  function say(x) { J.say(x); }
  function look(key, val) { J.data.home[key] = val; J.save(); J.applyLook(); }
  function dateAfter(n) { return JX.key(JX.addDays(new Date(), n)); }
  function md(k) { var d = JX.fromKey(k); return (d.getMonth() + 1) + "/" + d.getDate() + "(" + DN[d.getDay()] + ")"; }
  function won(n) { return JX.won(n); }

  /* ---------- 가지들 ---------- */
  function todoNodes() {
    return [
      ask("추가", "할 일을 적고 Enter", function (t) { J.addTodo(t); say("할 일에 넣었어 → " + t); }),
      leaf("목록 보기", function () { J.understand("할 일 뭐 있어"); }),
      group("완료하기", function () {
        var list = [];
        J.data.todos.forEach(function (t, i) {
          if (!t.done) list.push(leaf((i + 1) + ". " + t.text, function () { J.markTodoDone(t); say("잘했어! 완료 → " + t.text); refresh(); }));
        });
        return list.length ? list : [leaf("남은 할 일이 없어", function () { say("남은 할 일이 없어."); })];
      }),
      group("지우기", function () {
        var list = J.data.todos.map(function (t) {
          return leaf((t.done ? "✓ " : "") + t.text, function () {
            J.data.todos = J.data.todos.filter(function (x) { return x.id !== t.id; });
            J.save(); J.renderTodos(); say("지웠어 → " + t.text); refresh();
          });
        });
        return list.length ? list : [leaf("할 일이 없어", function () { say("할 일이 없어."); })];
      }),
      leaf("완료한 것 정리", function () { var n = J.clearDoneTodos(); say(n ? "완료한 할 일 " + n + "개를 지웠어." : "지울 게 없어."); }),
      leaf("할 일 화면 열기", function () { J.go("todo"); })
    ];
  }
  function memoNodes() {
    return [
      ask("메모하기", "메모할 내용을 적고 Enter", function (t) { J.addMemo(t); say("메모해뒀어 → " + t); }),
      leaf("최근 메모 보기", function () { J.understand("메모 보여줘"); }),
      group("지우기", function () {
        var list = J.data.memos.slice().reverse().map(function (m) {
          return leaf(m.text.length > 18 ? m.text.slice(0, 18) + "…" : m.text, function () {
            J.data.memos = J.data.memos.filter(function (x) { return x.id !== m.id; });
            J.save(); J.renderMemos(); say("메모를 지웠어."); refresh();
          });
        });
        return list.length ? list : [leaf("메모가 없어", function () { say("메모가 없어."); })];
      }),
      leaf("메모 화면 열기", function () { J.go("todo"); })
    ];
  }
  function timeNodes() {
    var mins = [1, 2, 3, 5, 7, 10, 15, 20, 25, 30, 40, 45, 50, 60, 90, 120];
    return [
      group("타이머", [group("시간 고르기", mins.map(function (m) { return leaf(m + "분", function () { J.timer.start(m * 60); }); })),
        ask("직접 입력", "몇 분? (예: 12)", function (t) { var m = parseInt(t, 10); if (m > 0 && m <= 600) J.timer.start(m * 60); else say("1~600 사이 숫자로 적어줘."); }),
        leaf("멈춤", function () { J.timer.pause(); say("타이머 멈췄어."); }),
        leaf("계속", function () { J.timer.resume(); say("타이머 계속 돌릴게."); }),
        leaf("끄기", function () { J.timer.reset(); say("타이머를 껐어."); })]),
      group("뽀모도로", [
        leaf("시작", function () { say("뽀모도로 " + J.pomo.start() + " 시작할게."); }),
        leaf("멈춤", function () { J.pomo.stop(); say("뽀모도로 멈췄어."); }),
        leaf("다음 단계", function () { say("다음 단계: " + J.pomo.skip()); }),
        leaf("처음으로", function () { J.pomo.reset(); say("뽀모도로를 처음으로 돌렸어."); }),
        group("집중 시간", [15, 20, 25, 30, 40, 45, 50, 60].map(function (m) { return leaf(m + "분", function () { J.pomo.setMinutes("focus", m); say("집중 시간을 " + m + "분으로 바꿨어."); }); })),
        group("휴식 시간", [3, 5, 10, 15].map(function (m) { return leaf(m + "분", function () { J.pomo.setMinutes("short", m); say("짧은 휴식을 " + m + "분으로 바꿨어."); }); }))
      ]),
      group("스톱워치", [
        leaf("시작", function () { J.sw.start(); say("스톱워치 시작했어."); }),
        leaf("멈춤", function () { say("스톱워치 멈췄어. " + J.sw.stop()); }),
        leaf("구간 기록", function () { var t = J.sw.lap(); say(t ? "구간 기록 " + t : "스톱워치가 돌 때만 돼."); }),
        leaf("초기화", function () { J.sw.reset(); say("스톱워치를 처음으로 돌렸어."); })
      ]),
      leaf("지금 몇 시?", function () { J.understand("지금 몇 시야"); }),
      leaf("오늘 공부 시간", function () { say(J.focus.todayText()); }),
      group("화면 켜두기", [
        leaf("켜기", function () { setWake(true); }),
        leaf("끄기", function () { setWake(false); })
      ]),
      leaf("시간 화면 열기", function () { J.go("time"); })
    ];
  }
  function setWake(on) {
    var cb = J.$("wakeToggle");
    if (!cb) return;
    cb.checked = on;
    cb.dispatchEvent(new Event("change"));
    say(on ? "화면 켜두기를 켰어. 결과는 시간 화면 위쪽에 보여." : "화면 켜두기를 껐어.");
  }
  function schoolNodes() {
    var days = [["월요일", 1], ["화요일", 2], ["수요일", 3], ["목요일", 4], ["금요일", 5]];
    function dayDate(dow) { var t = new Date(); return JX.addDays(t, (dow - t.getDay() + 7) % 7); }
    return [
      group("시간표", [
        leaf("지금 수업", function () { say(J.tt.nowText()); }),
        leaf("다음 수업", function () { say(J.tt.nextText()); }),
        leaf("오늘", function () { say(J.tt.dayText(new Date())); }),
        leaf("내일", function () { say(J.tt.dayText(JX.addDays(new Date(), 1))); })
      ].concat(days.map(function (d) { return leaf(d[0], function () { say(J.tt.dayText(dayDate(d[1]))); }); }))
        .concat([leaf("시간표 화면 열기", function () { J.go("tt"); })])),
      group("급식", [
        leaf("오늘", function () { say(J.meal.text(new Date())); }),
        leaf("내일", function () { say(J.meal.text(JX.addDays(new Date(), 1))); }),
        leaf("모레", function () { say(J.meal.text(JX.addDays(new Date(), 2))); })
      ].concat(days.map(function (d) { return leaf(d[0], function () { say(J.meal.text(dayDate(d[1]))); }); }))
        .concat([leaf("급식 화면 열기", function () { J.go("meal"); })]))
    ];
  }
  function eventNodes() {
    function addFlow(title) {
      var picks = [["오늘", 0], ["내일", 1], ["모레", 2], ["3일 뒤", 3], ["일주일 뒤", 7], ["2주 뒤", 14], ["한 달 뒤", 30]];
      return picks.map(function (p) {
        return leaf(p[0], function () { var k = dateAfter(p[1]); J.cal.add(k, title); say(md(k) + " '" + title + "' 일정 넣었어."); reset(); });
      }).concat([ask("날짜 직접", "날짜를 적어줘 (예: 10/20, 다음 주 금요일)", function (t) {
        var d = JX.parseKDate(t, new Date());
        if (!d) { say("날짜를 못 알아들었어. 10/20처럼 적어줘."); return; }
        var k = JX.key(d.date); J.cal.add(k, title); say(md(k) + " '" + title + "' 일정 넣었어."); reset();
      })]);
    }
    return [
      ask("추가", "일정 이름을 적고 Enter (예: 학원, 생일 파티)", function (t) { return { t: t + " → 날짜", kids: addFlow(t) }; }),
      leaf("오늘 일정", function () { listEvents(JX.key(new Date()), 0); }),
      leaf("내일 일정", function () { listEvents(dateAfter(1), 0); }),
      leaf("이번 주", function () { listEvents(null, 7); }),
      leaf("다가오는 일정 (30일)", function () { listEvents(null, 30); }),
      leaf("캘린더 열기", function () { J.go("cal"); })
    ];
  }
  function listEvents(key, days) {
    var evs = key ? J.data.events.filter(function (e) { return e.date === key; }) : J.cal.upcoming(days);
    if (!evs.length) { say(key ? md(key) + "에는 일정이 없어." : "그 기간에 일정이 없어."); return; }
    say((key ? md(key) + " 일정이야." : "다가오는 일정이야.") + "\n" + evs.slice(0, 10).map(function (e) {
      return md(e.date) + " " + (e.time ? e.time + " " : "") + e.title + (e.dday ? " · " + J.dday.label(e) : "");
    }).join("\n"));
  }
  function ddayNodes() {
    function addFlow(title) {
      var picks = [["+7일", 7], ["+14일", 14], ["+30일", 30], ["+50일", 50], ["+100일", 100], ["+365일", 365]];
      return picks.map(function (p) {
        return leaf(p[0], function () { var e = J.dday.add(title, dateAfter(p[1]), "until"); say(title + " " + J.dday.label(e) + " 만들었어."); reset(); });
      }).concat([
        ask("날짜 직접", "날짜를 적어줘 (예: 10/20)", function (t) {
          var d = JX.parseKDate(t, new Date());
          if (!d) { say("날짜를 못 알아들었어. 10/20처럼 적어줘."); return; }
          var e = J.dday.add(title, JX.key(d.date), "until"); say(title + " " + J.dday.label(e) + " 만들었어."); reset();
        }),
        leaf("오늘부터 세기 (며칠째)", function () { var e = J.dday.add(title, JX.key(new Date()), "since"); say(title + " " + J.dday.label(e) + "부터 세기 시작했어."); reset(); })
      ]);
    }
    return [
      ask("새로 만들기", "D-day 이름을 적고 Enter (예: 중간고사)", function (t) { return { t: t + " → 날짜", kids: addFlow(t) }; }),
      leaf("목록 보기", function () {
        var l = J.dday.list();
        say(l.length ? "D-day 목록이야.\n" + l.map(function (e) { return (e.id === J.data.ddayPin ? "★ " : "") + e.title + " " + J.dday.label(e); }).join("\n") : "D-day가 없어.");
      }),
      group("대표로 정하기", function () {
        var l = J.dday.list();
        return l.length ? l.map(function (e) { return leaf(e.title + " " + J.dday.label(e), function () { J.dday.pin(e.id); say("'" + e.title + "'을 대표 D-day로 정했어."); }); }) : [leaf("D-day가 없어", function () { say("D-day가 없어."); })];
      }),
      group("지우기", function () {
        var l = J.dday.list();
        return l.length ? l.map(function (e) { return leaf(e.title + " " + J.dday.label(e), function () { J.dday.remove(e.id); say("'" + e.title + "' D-day를 지웠어."); refresh(); }); }) : [leaf("D-day가 없어", function () { say("D-day가 없어."); })];
      }),
      leaf("D-day 화면 열기", function () { J.go("dday"); })
    ];
  }
  function moneyNodes() {
    var outCats = ["식비", "간식", "교통", "학용품", "문화", "쇼핑", "기타"];
    var outAmts = [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 15000, 20000, 30000, 50000];
    var inCats = ["용돈", "선물", "기타"];
    var inAmts = [5000, 10000, 20000, 30000, 50000, 100000];
    function amountNodes(type, cat, amts) {
      return amts.map(function (a) {
        return leaf(won(a), function () { J.money.add({ type: type, amount: a, cat: cat, memo: "" }); say((type === "in" ? "들어온 돈 " : "쓴 돈 ") + won(a) + " (" + cat + ") 기록했어."); });
      }).concat([ask("직접 입력", "금액을 적어줘 (예: 3500, 1만2천원)", function (t) {
        var a = /^\d+$/.test(t.trim()) ? parseInt(t, 10) : JX.parseAmount(/원/.test(t) ? t : t + "원");
        if (!(a > 0)) { say("금액을 못 알아들었어."); return; }
        J.money.add({ type: type, amount: a, cat: cat, memo: "" }); say((type === "in" ? "들어온 돈 " : "쓴 돈 ") + won(a) + " (" + cat + ") 기록했어.");
      })]);
    }
    return [
      group("쓴 돈 기록", outCats.map(function (c) { return group(c, amountNodes("out", c, outAmts)); })),
      group("들어온 돈 기록", inCats.map(function (c) { return group(c, amountNodes("in", c, inAmts)); })),
      leaf("이번 달 요약", function () { say(J.money.monthText()); }),
      leaf("오늘 쓴 돈", function () { say("오늘 쓴 돈은 " + won(J.money.daySpent(JX.key(new Date()))) + "이야."); }),
      leaf("가계부 열기", function () { J.go("money"); })
    ];
  }
  function diaryNodes() {
    var moods = [["😄", "최고"], ["🙂", "좋음"], ["😐", "보통"], ["😢", "슬픔"], ["😡", "화남"], ["😴", "피곤"]];
    return [
      leaf("오늘 일기 쓰기", function () { J.diary.open(JX.key(new Date())); }),
      group("오늘 기분 남기기", moods.map(function (m) {
        return leaf(m[0] + " " + m[1], function () {
          var k = JX.key(new Date());
          var e = J.data.diary[k] || (J.data.diary[k] = { mood: "", text: "", updated: 0 });
          e.mood = m[0]; e.updated = Date.now();
          J.save(); if (J.cal) J.cal.redraw();
          say("오늘 기분 " + m[0] + " 남겼어.");
        });
      })),
      leaf("어제 일기", function () { J.diary.open(dateAfter(-1)); }),
      leaf("일기 화면 열기", function () { J.go("diary"); })
    ];
  }
  function dictNodes() {
    return [
      ask("단어 찾기", "영어 단어나 한글 뜻을 적고 Enter", function (t) {
        var x = J.dict.lookup(t);
        if (x) { say(J.dict.text(x)); return; }
        var r = J.dict.search(t, 8);
        say(r.length ? "비슷한 단어야.\n" + r.map(J.dict.text).join("\n") : "'" + t + "'는 아직 사전에 없어.");
      }),
      leaf("오늘의 단어", function () { var x = J.dict.dayWord(); if (x) say("오늘의 단어: " + J.dict.text(x)); }),
      leaf("오늘의 숙어", function () { var x = J.dict.dayIdiom(); if (x) say("오늘의 숙어: " + J.dict.text(x)); }),
      leaf("내 단어장", function () { var l = J.dict.starred(); say(l.length ? "내 단어장 (" + l.length + "개)\n" + l.slice(0, 15).map(J.dict.text).join("\n") : "단어장이 비어 있어."); }),
      group("알파벳으로 둘러보기", function () {
        return J.dict.letters().map(function (lc) {
          return group(lc[0].toUpperCase() + " (" + lc[1] + ")", function () {
            return J.dict.prefixes(lc[0]).map(function (pc) {
              return group(pc[0] + "… (" + pc[1] + ")", function () {
                return J.dict.withPrefix(pc[0]).map(function (x) {
                  return leaf(x.w, function () { say(J.dict.text(x)); J.dict.speak(x.w); });
                });
              });
            });
          });
        });
      }),
      leaf("퀴즈 하러 가기", function () { J.go("dict"); var b = J.$("quizStart"); if (b) b.click(); }),
      leaf("사전 화면 열기", function () { J.go("dict"); })
    ];
  }
  function calcNodes() {
    return [
      ask("식 계산", "계산할 식을 적고 Enter (예: 3*(2+5), 2^10)", function (t) {
        try { say(t + " = " + JCalc.format(JCalc.evaluate(t, { deg: true }))); } catch (e) { say("계산 못 했어: " + e.message); }
      }),
      leaf("최근 계산", function () { var h = J.data.calcHistory; say(h.length ? h.slice(0, 5).map(function (x) { return x.e + " = " + x.r; }).join("\n") : "계산 기록이 없어."); }),
      leaf("계산기 열기", function () { J.go("calc"); })
    ];
  }
  function lookNodes() {
    var accents = Object.keys(J.ACCENTS || {}).map(function (k) { return leaf(J.ACCENTS[k].label, function () { J.data.home.accentPicked = true; look("accent", k); say("강조 색을 " + J.ACCENTS[k].label + "으로 바꿨어."); }); });
    var grads = Object.keys(J.GRADIENTS || {}).map(function (k, i) { return leaf("그라데이션 " + (i + 1), function () { J.data.home.bgGradient = k; look("bg", "gradient"); say("배경을 바꿨어."); }); });
    return [
      group("테마 추천 조합", J.PRESETS.map(function (pr) { return leaf(pr[0], function () { J.data.home.layout = pr[2]; J.data.home.accentPicked = false; J.data.home.bg = "none"; look("style", pr[1]); J.layoutHome(); say("테마를 '" + pr[0] + "'로 바꿨어."); }); })),
      group("색상 테마", [["basic", "기본"]].concat(Object.keys(J.PALETTES).map(function (k) { return [k, J.PALETTES[k].t]; })).concat([["note", "종이 노트"], ["hud", "자비스 HUD"]]).map(function (o) { return leaf(o[1], function () { J.data.home.accentPicked = false; look("style", o[0]); say("색상을 " + o[1] + "로 바꿨어."); }); })),
      group("배치", Object.keys(J.LAYOUTS).map(function (k) { return leaf(J.LAYOUTS[k], function () { look("layout", k); J.layoutHome(); say("배치를 " + J.LAYOUTS[k] + "로 바꿨어."); }); })),
      group("화면 밝기", [leaf("기기 설정대로", function () { look("theme", "auto"); }), leaf("밝게", function () { look("theme", "light"); }), leaf("어둡게", function () { look("theme", "dark"); })]),
      group("강조 색", accents),
      group("글자 크기", [["s", "작게"], ["m", "보통"], ["l", "크게"], ["xl", "아주 크게"]].map(function (o) { return leaf(o[1], function () { look("fontSize", o[0]); }); })),
      group("글꼴", Object.keys(J.FONTS).map(function (k) { return leaf(J.FONTS[k].label, function () { look("font", k); say("글꼴을 " + J.FONTS[k].label + "로 바꿨어."); }); })),
      group("모서리", [["s", "각지게"], ["m", "보통"], ["l", "둥글게"]].map(function (o) { return leaf(o[1], function () { look("radius", o[0]); }); })),
      group("배경", [leaf("없음", function () { look("bg", "none"); })].concat(grads)),
      group("시계", [
        leaf("24시간으로", function () { look("clock24", true); }), leaf("오전/오후로", function () { look("clock24", false); }),
        leaf("초 보이기", function () { look("clockSec", true); }), leaf("초 숨기기", function () { look("clockSec", false); }),
        leaf("크게", function () { look("clockBig", true); }), leaf("보통 크기", function () { look("clockBig", false); })
      ]),
      ask("부를 이름 바꾸기", "새 이름을 적고 Enter", function (t) { look("name", t.trim().slice(0, 12)); say("이제 " + t.trim() + "이라고 부를게."); }),
      ask("내 문구 바꾸기", "홈에 띄울 문구를 적고 Enter", function (t) { look("motto", t.slice(0, 80)); J.data.home.hidden = J.data.home.hidden.filter(function (x) { return x !== "motto"; }); J.save(); J.layoutHome(); say("내 문구를 바꿨어."); }),
      leaf("꾸미기 화면 열기", function () { J.go("look"); })
    ];
  }
  function moreNodes() {
    return [
      group("명언", [leaf("오늘의 명언", function () { J.quote.today(); J.renderQuote(); say(J.quote.text()); }), leaf("다른 명언", function () { J.quote.next(); J.renderQuote(); say(J.quote.text()); })]),
      group("성장", [leaf("내 레벨", function () { say(J.game.text()); }), leaf("배지 보기", function () { J.go("growth"); })]),
      group("백업", [leaf("백업 파일 받기", function () { J.go("more"); var b = J.$("exportBtn"); if (b) b.click(); }), leaf("백업 화면 열기", function () { J.go("more"); })]),
      group("화면 열기", [["홈", "home"], ["시간표", "tt"], ["급식", "meal"], ["캘린더", "cal"], ["D-day", "dday"], ["할 일·메모", "todo"], ["일기", "diary"], ["가계부", "money"], ["성장", "growth"], ["타이머", "time"], ["계산기", "calc"], ["영어사전", "dict"], ["꾸미기", "look"], ["백업", "more"]].map(function (o) { return leaf(o[0], function () { J.go(o[1]); }); }))
    ];
  }

  var ROOT = group("처음", function () {
    return [
      leaf("공부 집중모드", function () { J.focus.start(); }),
      leaf("시계 모드", function () { J.clockMode.start(); }),
      group("음악", function () {
        var l = J.music.list();
        var base = [
          leaf("재생 / 멈춤", function () { if (!J.music.toggle()) say("넣은 노래가 없어. 음악 화면에서 노래 파일을 넣어줘."); }),
          leaf("다음 곡", function () { J.music.next(); }),
          leaf("이전 곡", function () { J.music.prev(); }),
          leaf("섞어 듣기 켜기", function () { J.music.setShuffle(true); say("섞어 듣기를 켰어."); }),
          leaf("순서대로 듣기", function () { J.music.setShuffle(false); say("순서대로 들을게."); }),
          group("반복", [["all", "전체 반복"], ["one", "한 곡 반복"], ["off", "반복 없음"]].map(function (o) { return leaf(o[1], function () { J.music.setRepeat(o[0]); say(o[1] + "으로 바꿨어."); }); })),
          leaf("음악 화면 열기 (노래 넣기)", function () { J.go("music"); })
        ];
        if (l.length) base.splice(3, 0, group("곡 고르기 (" + l.length + ")", l.map(function (x) { return leaf(x.name, function () { J.music.playId(x.id); say("♪ " + x.name); }); })));
        return base;
      }),
      group("할 일", todoNodes), group("메모", memoNodes), group("시간", timeNodes), group("학교", schoolNodes),
      group("일정", eventNodes), group("D-day", ddayNodes), group("가계부", moneyNodes), group("일기", diaryNodes),
      group("영어사전", dictNodes), group("계산", calcNodes), group("꾸미기", lookNodes), group("더보기", moreNodes),
      leaf("총 몇 가지?", function () { say("지금 고를 수 있는 명령은 " + J.cmdCount().toLocaleString() + "가지야. 할 일·D-day·단어가 늘면 더 많아져."); })
    ];
  });

  function kidsOf(n) { return typeof n.kids === "function" ? n.kids() : (n.kids || []); }
  J.cmdCount = function () {
    var count = 0;
    (function walk(n, depth) {
      if (depth > 8) return;
      if (n.run || n.ask) { count++; return; }
      kidsOf(n).forEach(function (k) { walk(k, depth + 1); });
    })(ROOT, 0);
    return count;
  };

  /* ---------- 화면 ---------- */
  function cur() { return stack.length ? stack[stack.length - 1] : ROOT; }
  function reset() { stack = []; pendingAsk = null; setAskUI(); draw(); }
  function refresh() { draw(); }
  function setAskUI() {
    var input = J.$("cmdInput");
    if (!input) return;
    if (pendingAsk) {
      input.placeholder = pendingAsk.ask.ph;
      input.classList.add("asking");
    } else {
      input.placeholder = "말하듯이 쓰거나 아래에서 골라  예) 다음 시간 뭐야? · 10분 뒤에 알려줘";
      input.classList.remove("asking");
    }
  }
  function draw() {
    if (!chipsEl) return;
    pathEl.textContent = "";
    if (pendingAsk) open = true;
    box.classList.toggle("open", open);
    var tog = J.el("button", "ctree-crumb ctree-toggle", open ? "명령 고르기 ▴" : "명령 고르기 ▾");
    tog.type = "button";
    tog.setAttribute("aria-expanded", open ? "true" : "false");
    tog.addEventListener("click", function () { J.audio.ensure(); open = !open; if (!open) { stack = []; pendingAsk = null; setAskUI(); } draw(); });
    pathEl.appendChild(tog);
    chipsEl.hidden = !open;
    if (!open) { chipsEl.textContent = ""; return; }
    if (stack.length) {
      var home = J.el("button", "ctree-crumb", "← 처음");
      home.type = "button";
      home.addEventListener("click", reset);
      pathEl.appendChild(home);
      var back = J.el("button", "ctree-crumb", "← 뒤로");
      back.type = "button";
      back.addEventListener("click", function () { stack.pop(); pendingAsk = null; setAskUI(); draw(); });
      pathEl.appendChild(back);
      pathEl.appendChild(J.el("span", "ctree-path", stack.map(function (n) { return n.t; }).join(" › ")));
    }
    if (pendingAsk) {
      var cancel = J.el("button", "ctree-crumb", "입력 취소");
      cancel.type = "button";
      cancel.addEventListener("click", function () { pendingAsk = null; setAskUI(); draw(); });
      pathEl.appendChild(cancel);
    }
    chipsEl.textContent = "";
    var kids = kidsOf(cur());
    kids.forEach(function (k) {
      var b = J.el("button", "ctree-chip" + (k.kids ? " branch" : k.ask ? " input" : "") + (pendingAsk === k ? " on" : ""), k.t + (k.kids ? " ›" : k.ask ? " ✎" : ""));
      b.type = "button";
      b.addEventListener("click", function () { choose(k); });
      chipsEl.appendChild(b);
    });
    chipsEl.scrollTop = 0;
  }
  function choose(n) {
    J.audio.ensure();
    if (n.kids) { stack.push(n); pendingAsk = null; setAskUI(); draw(); return; }
    if (n.ask) {
      pendingAsk = n;
      setAskUI();
      draw();
      var input = J.$("cmdInput");
      if (input) input.focus();
      return;
    }
    if (n.run) {
      J._echo(stack.map(function (x) { return x.t; }).concat([n.t]).join(" › "));
      n.run();
      if (!n.stay) { open = false; stack = []; }
      draw();
    }
  }
  // 명령어 창에 글을 넣었을 때: 입력을 기다리는 중이면 그쪽으로 보낸다
  J.cmdTreeTakeInput = function (text) {
    if (!pendingAsk) return false;
    var n = pendingAsk;
    pendingAsk = null;
    setAskUI();
    var next = n.ask.run(text);
    if (next && next.kids) { stack.push(next); }
    else { open = false; stack = []; }
    draw();
    return true;
  };

  J.on("started", function () {
    var form = J.$("cmdForm");
    if (!form) return;
    box = J.el("div", "ctree");
    pathEl = J.el("div", "ctree-top");
    chipsEl = J.el("div", "ctree-chips");
    chipsEl.setAttribute("role", "group");
    chipsEl.setAttribute("aria-label", "명령 고르기");
    box.appendChild(pathEl);
    box.appendChild(chipsEl);
    form.parentNode.insertBefore(box, form.nextSibling);
    setAskUI();
    draw();
  });
})();

/* ===== 시작 ===== */
window.J.start();

</script>
</body>
</html>
